name: Update identified victims dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "55 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate Tech for Palestine victims dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          import urllib.request
          from pathlib import Path

          URL = "https://data.techforpalestine.org/api/v3/killed-in-gaza.min.json"
          SUMMARY = "https://data.techforpalestine.org/api/v3/summary.min.json"
          OUT = Path("data/killed-in-gaza-v3.min.json")
          META = Path("data/killed-in-gaza-v3.meta.json")

          headers = {
              "User-Agent": "GazaTimeline-Victims/1.0",
              "Accept": "application/json",
          }

          def fetch(url, timeout=90):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read()

          raw = fetch(URL)
          if len(raw) < 500_000:
              raise RuntimeError(
                  f"Downloaded victims dataset is suspiciously small: {len(raw):,} bytes"
              )

          data = json.loads(raw)

          if not isinstance(data, list) or len(data) < 2:
              raise RuntimeError("Victims API did not return the expected array-of-arrays")

          header = data[0]
          if not isinstance(header, list):
              raise RuntimeError("Victims v3 header row is missing")

          required = {"name", "en_name", "sex", "age"}
          missing = required - set(header)
          if missing:
              raise RuntimeError(f"Victims dataset missing required columns: {sorted(missing)}")

          rows = data[1:]

          # Hard safety floor. Tech for Palestine currently documents more than
          # 60,000 records; a dramatic drop is more likely to indicate an API/
          # parsing failure than a legitimate update.
          if len(rows) < 50_000:
              raise RuntimeError(
                  f"Refusing unexpectedly small victims list: {len(rows):,} records"
              )

          name_i = header.index("name")
          en_i = header.index("en_name")
          sex_i = header.index("sex")
          age_i = header.index("age")

          valid_names = 0
          valid_sex = 0
          valid_age = 0

          for row in rows:
              if not isinstance(row, list) or len(row) != len(header):
                  raise RuntimeError("Victims dataset contains a malformed row")

              if row[name_i] or row[en_i]:
                  valid_names += 1

              if row[sex_i] in ("m", "f"):
                  valid_sex += 1

              age = row[age_i]
              if age in ("", None):
                  continue

              try:
                  numeric_age = float(age)
              except Exception:
                  raise RuntimeError(f"Invalid age value: {age!r}")

              if not 0 <= numeric_age <= 120:
                  raise RuntimeError(f"Implausible age value: {numeric_age}")

              valid_age += 1

          if valid_names < len(rows) * 0.95:
              raise RuntimeError("Too many victims records lack names")

          if valid_sex < len(rows) * 0.90:
              raise RuntimeError("Too many victims records have invalid sex values")

          if valid_age < len(rows) * 0.80:
              raise RuntimeError("Too many victims records lack a usable age")

          summary = None
          try:
              summary = json.loads(fetch(SUMMARY, timeout=45))
          except Exception as error:
              print("Summary endpoint warning:", error)

          OUT.parent.mkdir(exist_ok=True)

          # Atomic replace: a failed validation never overwrites the last good file.
          with tempfile.NamedTemporaryFile(
              mode="wb",
              dir=OUT.parent,
              delete=False,
              prefix="victims-",
              suffix=".tmp",
          ) as tmp:
              tmp.write(raw)
              tmp_path = Path(tmp.name)

          # Re-open the exact bytes we're about to publish.
          check = json.loads(tmp_path.read_text(encoding="utf-8"))
          if len(check) != len(data):
              tmp_path.unlink(missing_ok=True)
              raise RuntimeError("Atomic victims-file validation failed")

          os.replace(tmp_path, OUT)

          update_i = header.index("update") if "update" in header else None
          max_update = None
          if update_i is not None:
              values = []
              for row in rows:
                  try:
                      if row[update_i] not in ("", None):
                          values.append(int(row[update_i]))
                  except Exception:
                      pass
              max_update = max(values) if values else None

          META.write_text(
              json.dumps(
                  {
                      "source": "Tech for Palestine — Killed in Gaza v3",
                      "api": URL,
                      "records": len(rows),
                      "valid_names": valid_names,
                      "valid_sex": valid_sex,
                      "valid_age": valid_age,
                      "latest_list_update_number": max_update,
                      "summary": summary,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          print(f"VALID victims dataset: {len(rows):,} records")
          print(f"Records with usable age: {valid_age:,}")
          print(f"Records with valid sex: {valid_sex:,}")
          print(f"Latest list update number: {max_update}")
          PY

      - name: Commit victims data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/killed-in-gaza-v3.min.json data/killed-in-gaza-v3.meta.json
          git diff --cached --quiet && exit 0

          git commit -m "Update identified victims dataset"
          git pull --rebase origin main
          git push origin main
