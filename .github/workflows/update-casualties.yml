name: Update Gaza casualty timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests beautifulsoup4

      - name: Extract exact OCHA killed and injured sentences
        shell: bash
        run: |
          cat > /tmp/update_casualties.py <<'PY'
          from pathlib import Path
          from datetime import date, datetime, timedelta, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import re
          import time

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          BASE = "https://www.ochaopt.org/content/"
          VERSION = 4
          START = date(2023, 10, 8)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-CasualtyTimeline/4.0",
              "Accept-Language": "en",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|"
              "August|September|October|November|December"
          )

          NUMBER = r"\d{1,3}(?:,\d{3})+|\d{4,6}"

          KILLED_PATTERNS = [
              re.compile(
                  rf"(?P<n>{NUMBER})\s+"
                  rf"(?:Palestinians?|people|persons|individuals|civilians)?"
                  rf"\s*(?:have\s+been|were|are|reportedly|reported\s+as)?"
                  rf"\s*killed\b",
                  re.I,
              ),
              re.compile(
                  rf"\b(?:killed|fatalities)\b"
                  rf"[^\d]{{0,45}}(?P<n>{NUMBER})",
                  re.I,
              ),
          ]

          INJURED_PATTERNS = [
              re.compile(
                  rf"(?P<n>{NUMBER})\s+"
                  rf"(?:Palestinians?|people|persons|individuals|civilians)?"
                  rf"\s*(?:have\s+been|were|are|reportedly|reported\s+as)?"
                  rf"\s*injured\b",
                  re.I,
              ),
              re.compile(
                  rf"\b(?:injured|injuries)\b"
                  rf"[^\d]{{0,45}}(?P<n>{NUMBER})",
                  re.I,
              ),
          ]

          DATE_RE = re.compile(
              rf"\b(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})\b",
              re.I,
          )

          def parse_number(raw):
              return int(raw.replace(",", ""))

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def page_text(url):
              try:
                  r = session.get(url, timeout=25)

                  if r.status_code == 404:
                      return None

                  r.raise_for_status()

                  soup = BeautifulSoup(r.text, "html.parser")

                  for tag in soup([
                      "script",
                      "style",
                      "nav",
                      "header",
                      "footer",
                      "form",
                  ]):
                      tag.decompose()

                  return clean(
                      soup.get_text(" ", strip=True)
                  )

              except Exception as error:
                  print("FETCH FAILED", url, error)
                  return None

          def candidate_chunks(text):
              # OCHA frequently puts the cumulative casualty statement in one
              # long sentence. Split only at strong sentence boundaries.
              parts = re.split(
                  r"(?<=[.!?])\s+(?=[A-Z])",
                  text,
              )

              output = []

              for part in parts:
                  part = clean(part)

                  if not (
                      40 <= len(part) <= 1800
                  ):
                      continue

                  low = part.lower()

                  # HARD FILTERS. If any of these are absent, the sentence is
                  # not allowed into the dataset.
                  if "7 october 2023" not in low:
                      continue

                  if (
                      "killed" not in low
                      and "fatalit" not in low
                  ):
                      continue

                  if (
                      "injured" not in low
                      and "injur" not in low
                  ):
                      continue

                  if not any(
                      term in low
                      for term in (
                          "gaza",
                          "ministry of health",
                          "moh",
                      )
                  ):
                      continue

                  output.append(part)

              return output

          def extract_metric(chunk, patterns):
              values = []

              for pattern in patterns:
                  for match in pattern.finditer(chunk):
                      value = parse_number(
                          match.group("n")
                      )
                      values.append(value)

              if not values:
                  return None

              # The same sentence can also mention subgroup casualties.
              # The cumulative Gaza-wide total is the largest matching value.
              return max(values)

          def extract_effective_date(chunk, page_url):
              # Prefer wording like:
              # "Between 7 October 2023 and 25 June 2025..."
              between = re.search(
                  rf"Between\s+7\s+October\s+2023\s+and\s+"
                  rf"(?:\d{{1,2}}:\d{{2}}\s+(?:hours?\s+)?(?:on\s+)?)?"
                  rf"(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})",
                  chunk,
                  re.I,
              )

              if between:
                  raw = between.group(1)

                  try:
                      return datetime.strptime(
                          raw,
                          "%d %B %Y",
                      ).date().isoformat()
                  except Exception:
                      pass

              # Also accept:
              # "since 7 October 2023 ... as of 25 June 2025"
              asof = re.search(
                  rf"(?:as\s+of|up\s+to|through)\s+"
                  rf"(?:\d{{1,2}}:\d{{2}}\s+(?:hours?\s+)?(?:on\s+)?)?"
                  rf"(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})",
                  chunk,
                  re.I,
              )

              if asof:
                  try:
                      return datetime.strptime(
                          asof.group(1),
                          "%d %B %Y",
                      ).date().isoformat()
                  except Exception:
                      pass

              # Last resort: if the sentence contains exactly two dates and
              # one is 7 October 2023, the other is the effective date.
              dates = []

              for match in DATE_RE.finditer(chunk):
                  try:
                      parsed = datetime.strptime(
                          match.group(1),
                          "%d %B %Y",
                      ).date()
                  except Exception:
                      continue

                  dates.append(parsed)

              unique = sorted(set(dates))

              other = [
                  d
                  for d in unique
                  if d != date(2023, 10, 7)
              ]

              if len(other) == 1:
                  return other[0].isoformat()

              return None

          def parse_url(url, label):
              text = page_text(url)

              if not text:
                  return None

              accepted = []

              for chunk in candidate_chunks(text):
                  killed = extract_metric(
                      chunk,
                      KILLED_PATTERNS,
                  )
                  injured = extract_metric(
                      chunk,
                      INJURED_PATTERNS,
                  )
                  effective = extract_effective_date(
                      chunk,
                      url,
                  )

                  if (
                      killed is None
                      or injured is None
                      or effective is None
                  ):
                      continue

                  # Sanity checks reject parser mistakes only.
                  if not (100 <= killed <= 500000):
                      continue

                  if not (100 <= injured <= 1000000):
                      continue

                  if injured <= killed:
                      continue

                  if effective < "2023-10-08":
                      continue

                  if effective > date.today().isoformat():
                      continue

                  accepted.append({
                      "date": effective,
                      "killed": killed,
                      "injured": injured,
                      "source_url": url,
                      "series_label": label,
                      "source_sentence": chunk,
                      "parser_version": VERSION,
                  })

              if not accepted:
                  return None

              # One page may repeat the exact same sentence in mobile/desktop
              # markup. Collapse identical results.
              unique = {
                  (
                      row["date"],
                      row["killed"],
                      row["injured"],
                  ): row
                  for row in accepted
              }

              # If a page yields two different cumulative pairs, reject the
              # whole page rather than guessing.
              if len(unique) != 1:
                  print(
                      "AMBIGUOUS PAGE",
                      url,
                      list(unique),
                  )
                  return None

              return next(iter(unique.values()))

          def urls_to_scan():
              urls = []

              # Early OCHA series, beginning October 2023.
              for number in range(1, 190):
                  urls.append((
                      BASE
                      + "hostilities-gaza-strip-and-israel-flash-update-"
                      + str(number),
                      f"Flash Update #{number}",
                  ))

              # Later numbered Gaza situation updates.
              for number in range(150, 451):
                  urls.append((
                      BASE
                      + "humanitarian-situation-update-"
                      + str(number)
                      + "-gaza-strip",
                      f"Situation Update #{number}",
                  ))

              # Some later Gaza response reports use this numbering.
              for number in range(1, 121):
                  urls.append((
                      BASE
                      + "gaza-humanitarian-response-situation-report-no-"
                      + str(number),
                      f"Gaza Humanitarian Response Report #{number}",
                  ))

              # Current OCHA reports use dates in the URL rather than a report
              # number. Probe every date from October 2025 through today;
              # nonexistent dates simply return 404.
              current = date(2025, 10, 1)
              today = date.today()

              while current <= today:
                  slug = (
                      f"{current.day}-"
                      f"{current.strftime('%B').lower()}-"
                      f"{current.year}"
                  )

                  urls.append((
                      BASE
                      + "humanitarian-situation-report-"
                      + slug,
                      "Humanitarian Situation Report",
                  ))

                  current += timedelta(days=1)

              return urls

          def discover_records():
              targets = urls_to_scan()
              print(
                  "Scanning",
                  len(targets),
                  "possible OCHA pages",
              )

              records = []

              # Concurrency makes the many harmless 404 checks fast while
              # staying modest enough not to hammer OCHA.
              with ThreadPoolExecutor(
                  max_workers=6
              ) as executor:
                  futures = {
                      executor.submit(
                          parse_url,
                          url,
                          label,
                      ): (url, label)
                      for url, label in targets
                  }

                  completed = 0

                  for future in as_completed(futures):
                      completed += 1

                      try:
                          row = future.result()
                      except Exception as error:
                          url, _ = futures[future]
                          print(
                              "PARSE FAILED",
                              url,
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "FOUND",
                              row["date"],
                              row["killed"],
                              row["injured"],
                              row["series_label"],
                          )
                          records.append(row)

                      if completed % 100 == 0:
                          print(
                              "Checked",
                              completed,
                              "/",
                              len(targets),
                          )

              return records

          def reconcile(records):
              # Group by effective casualty date.
              by_date = {}

              for row in records:
                  by_date.setdefault(
                      row["date"],
                      [],
                  ).append(row)

              final = []

              for effective in sorted(by_date):
                  rows = by_date[effective]

                  pairs = {
                      (
                          row["killed"],
                          row["injured"],
                      )
                      for row in rows
                  }

                  # Multiple OCHA pages agreeing on the same figures are fine.
                  # Disagreement means the date is omitted.
                  if len(pairs) != 1:
                      print(
                          "DATE CONFLICT OMITTED",
                          effective,
                          pairs,
                      )
                      continue

                  # Prefer a Situation Update URL where possible.
                  rows.sort(
                      key=lambda row: (
                          "Situation Update"
                          not in row["series_label"],
                          row["source_url"],
                      )
                  )

                  final.append(rows[0])

              # Cumulative series validation.
              cleaned = []

              for row in final:
                  if cleaned:
                      previous = cleaned[-1]

                      if (
                          row["killed"]
                          < previous["killed"]
                          or row["injured"]
                          < previous["injured"]
                      ):
                          print(
                              "DECREASING TOTAL OMITTED",
                              row,
                          )
                          continue

                  cleaned.append(row)

              return cleaned

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              records = reconcile(
                  discover_records()
              )

              if not records:
                  raise RuntimeError(
                      "No exact OCHA cumulative killed/injured "
                      "sentences were found."
                  )

              # Do not store full copied OCHA prose in the public JSON.
              # It is useful during validation, but the published file needs
              # only the numbers/date/source.
              public = []

              for row in records:
                  public.append({
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "parser_version": VERSION,
                  })

              payload = {
                  "source": (
                      "UN OCHA oPt pages citing cumulative "
                      "Gaza casualty figures"
                  ),
                  "attribution": (
                      "Casualty totals are reported figures; "
                      "OCHA commonly attributes Palestinian "
                      "Gaza totals to the Gaza Ministry of Health."
                  ),
                  "method": (
                      "A record is accepted only when killed and "
                      "injured cumulative totals occur in the same "
                      "OCHA sentence and that sentence anchors the "
                      "figures to 7 October 2023."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "records from",
                  public[0]["date"],
                  "to",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_casualties.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline"
          git push
