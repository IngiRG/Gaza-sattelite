name: Update Gaza casualty timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests beautifulsoup4

      - name: Read cumulative Gaza casualty totals from OCHA
        shell: bash
        run: |
          cat > /tmp/update_casualties.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import re
          import time

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          BASE = "https://www.ochaopt.org/content/"
          VERSION = 1

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-CasualtyTimeline/1.0",
              "Accept-Language": "en",
          })

          # Conservative import rule:
          # the SAME passage must explicitly start the period at 7 October 2023,
          # contain BOTH cumulative Gaza figures, and attribute them to MoH.
          #
          # Examples accepted:
          # "Between 7 October 2023 and 25 June 2025, the MoH in Gaza reported
          #  that at least 56,156 Palestinians were killed, and 132,239
          #  Palestinians were injured."
          #
          # "Between 7 October 2023 and 12:00 on 23 January 2024, at least
          #  25,490 Palestinians were killed in Gaza and 63,354 Palestinians
          #  were injured, according to the MoH."
          PERIOD_RE = re.compile(
              r"Between\s+7\s+October\s+2023\s+and\s+"
              r"(?:\d{1,2}:\d{2}\s+(?:hours?\s+)?on\s+)?"
              r"(?P<date>\d{1,2}\s+"
              r"(?:January|February|March|April|May|June|July|August|"
              r"September|October|November|December)\s+20\d{2})"
              r"\s*,\s*"
              r"(?P<body>.{0,650}?)"
              r"(?:(?:according\s+to)|(?:reported\s+by)|(?:according\s+to\s+the))"
              r".{0,80}?"
              r"(?:MoH|Ministry\s+of\s+Health)",
              re.I | re.S,
          )

          KILLED_RE = re.compile(
              r"(?:at\s+least\s+|more\s+than\s+|over\s+)?"
              r"(?P<n>\d{1,3}(?:,\d{3})+|\d{4,6})\s+"
              r"Palestinians?\s+were\s+killed(?:\s+in\s+Gaza)?",
              re.I,
          )

          INJURED_RE = re.compile(
              r"(?P<n>\d{1,3}(?:,\d{3})+|\d{4,6})\s+"
              r"(?:Palestinians?\s+)?were\s+injured",
              re.I,
          )

          # Some OCHA wording places "according to MoH" before the totals.
          ALT_RE = re.compile(
              r"Between\s+7\s+October\s+2023\s+and\s+"
              r"(?:\d{1,2}:\d{2}\s+(?:hours?\s+)?on\s+)?"
              r"(?P<date>\d{1,2}\s+"
              r"(?:January|February|March|April|May|June|July|August|"
              r"September|October|November|December)\s+20\d{2})"
              r"\s*,\s*"
              r"(?:(?:according\s+to\s+the\s+)?"
              r"(?:Ministry\s+of\s+Health|MoH)(?:\s+in\s+Gaza)?"
              r".{0,80}?)"
              r"(?P<body>.{0,650})",
              re.I | re.S,
          )

          def page_text(url):
              r = session.get(url, timeout=45)
              if r.status_code == 404:
                  return None
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "html.parser")
              for tag in soup(["script", "style", "nav", "header", "footer"]):
                  tag.decompose()
              return soup.get_text(" ", strip=True)

          def parse_number(raw):
              return int(raw.replace(",", ""))

          def extract(url, label):
              text = page_text(url)
              if not text:
                  return None

              text = re.sub(r"\s+", " ", text)

              candidates = []
              for regex in (PERIOD_RE, ALT_RE):
                  for match in regex.finditer(text):
                      body = match.group("body")
                      km = KILLED_RE.search(body)
                      im = INJURED_RE.search(body)

                      if not km or not im:
                          continue

                      killed = parse_number(km.group("n"))
                      injured = parse_number(im.group("n"))

                      # Sanity checks only reject impossible parser matches;
                      # they do not alter source numbers.
                      if not (100 <= killed <= 500000):
                          continue
                      if not (100 <= injured <= 1000000):
                          continue
                      if injured < killed:
                          continue

                      raw_date = match.group("date")
                      try:
                          date = datetime.strptime(
                              raw_date,
                              "%d %B %Y",
                          ).date().isoformat()
                      except Exception:
                          continue

                      candidates.append({
                          "date": date,
                          "killed": killed,
                          "injured": injured,
                          "source_url": url,
                          "series_label": label,
                      })

              if not candidates:
                  return None

              # A page can repeat the same passage. Require internal agreement.
              unique = {
                  (c["date"], c["killed"], c["injured"]): c
                  for c in candidates
              }

              if len(unique) != 1:
                  print(
                      "Ambiguous cumulative totals on",
                      url,
                      list(unique),
                  )
                  return None

              return next(iter(unique.values()))

          def probe(url, label):
              try:
                  return extract(url, label)
              except Exception as error:
                  print("Failed", url, error)
                  return None

          def discover_records():
              records = []

              # OCHA used numbered Flash Updates during the early war.
              for number in range(1, 190):
                  url = (
                      BASE
                      + "hostilities-gaza-strip-and-israel-flash-update-"
                      + str(number)
                  )
                  row = probe(
                      url,
                      f"Flash Update #{number}",
                  )
                  if row:
                      records.append(row)

                  if number % 25 == 0:
                      print("Scanned Flash Update", number)

                  time.sleep(0.035)

              # OCHA later used the Humanitarian Situation Update series.
              # The numbering is shared with West Bank updates, so 150-430 is
              # intentionally probed; non-Gaza/missing pages simply return 404
              # or fail the exact Gaza cumulative-period rule.
              for number in range(150, 431):
                  url = (
                      BASE
                      + "humanitarian-situation-update-"
                      + str(number)
                      + "-gaza-strip"
                  )
                  row = probe(
                      url,
                      f"Situation Update #{number}",
                  )
                  if row:
                      records.append(row)

                  if number % 25 == 0:
                      print("Scanned Situation Update", number)

                  time.sleep(0.035)

              # Deduplicate by source date. If multiple OCHA pages publish an
              # identical cumulative total for the same date, keep one.
              by_date = {}
              conflicts = {}

              for row in records:
                  date = row["date"]

                  if date not in by_date:
                      by_date[date] = row
                      continue

                  old = by_date[date]

                  if (
                      old["killed"] == row["killed"]
                      and old["injured"] == row["injured"]
                  ):
                      # Prefer Situation Update over Flash Update when both
                      # contain the exact same totals.
                      if (
                          "Situation Update" in row["series_label"]
                          and "Flash Update" in old["series_label"]
                      ):
                          by_date[date] = row
                  else:
                      conflicts.setdefault(date, []).extend(
                          [old, row]
                      )

              # If two OCHA pages disagree for the same effective date, omit
              # that date entirely instead of choosing between them.
              for date in conflicts:
                  by_date.pop(date, None)
                  print(
                      "Omitted conflicting OCHA totals for",
                      date,
                  )

              output = list(by_date.values())
              output.sort(key=lambda r: r["date"])
              return output

          def validate_series(records):
              clean = []

              for row in records:
                  if clean:
                      prev = clean[-1]

                      # Cumulative series should not decrease. OCHA/MoH may
                      # revise totals historically; a decreasing row is not
                      # silently repaired—just skipped from this visualization.
                      if row["killed"] < prev["killed"]:
                          print(
                              "Skipped decreasing fatality total:",
                              row,
                          )
                          continue

                      if row["injured"] < prev["injured"]:
                          print(
                              "Skipped decreasing injury total:",
                              row,
                          )
                          continue

                  clean.append(row)

              return clean

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              records = validate_series(
                  discover_records()
              )

              if not records:
                  raise RuntimeError(
                      "No exact cumulative Gaza casualty passages "
                      "were found on OCHA pages."
                  )

              payload = {
                  "source": (
                      "UN OCHA oPt pages citing Gaza Ministry "
                      "of Health cumulative casualty totals"
                  ),
                  "method": (
                      "Only exact passages explicitly covering the period "
                      "from 7 October 2023 and containing both cumulative "
                      "killed and injured totals are accepted."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": records,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  f"Wrote {len(records)} casualty records "
                  f"from {records[0]['date']} through "
                  f"{records[-1]['date']}."
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_casualties.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline"
          git push
