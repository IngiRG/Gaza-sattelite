name: Update Gaza casualty timeline from WHO

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4

      - name: Build casualty timeline from WHO EMRO reports
        shell: bash
        run: |
          cat > /tmp/update_who.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, date
          from urllib.parse import urljoin
          import json
          import re
          import subprocess
          import tempfile

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          VERSION = 9

          ARCHIVES = [
              "https://www.emro.who.int/opt/information-resources/emergency-situation-reports.html",
              "https://www.emro.who.int/fr/opt/information-resources/emergency-situation-reports.html",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-WHO-CasualtyTimeline/9.0",
              "Accept-Language": "en",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|"
              "August|September|October|November|December"
          )

          ISSUE_RE = re.compile(r"\bIssue\s+(\d+)\b", re.I)

          def clean(text):
              return re.sub(r"[ \t]+", " ", text or "").strip()

          def get(url, timeout=60):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r

          def discover():
              found = {}

              for archive in ARCHIVES:
                  try:
                      soup = BeautifulSoup(
                          get(archive).text,
                          "html.parser",
                      )
                  except Exception as error:
                      print("Archive failed:", archive, error)
                      continue

                  for a in soup.find_all("a", href=True):
                      label = clean(a.get_text(" ", strip=True))
                      href = urljoin(archive, a["href"])

                      if ".pdf" not in href.lower():
                          continue

                      # Keep only Gaza/oPt emergency situation-report PDFs.
                      joined = (label + " " + href).lower()
                      if not any(term in joined for term in (
                          "sitrep",
                          "situation",
                          "palestine",
                          "opt",
                      )):
                          continue

                      found[href] = label

              if not found:
                  raise RuntimeError(
                      "WHO EMRO emergency report archive returned no PDFs."
                  )

              print("Discovered", len(found), "WHO PDF candidates")
              return found

          def pdf_text(url):
              data = get(url, timeout=120).content

              if not data.startswith(b"%PDF"):
                  return ""

              with tempfile.TemporaryDirectory() as td:
                  pdf = Path(td) / "report.pdf"
                  txt = Path(td) / "report.txt"
                  pdf.write_bytes(data)

                  # First three pages contain the overview/casualty totals.
                  result = subprocess.run(
                      [
                          "pdftotext",
                          "-f", "1",
                          "-l", "3",
                          "-layout",
                          str(pdf),
                          str(txt),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if result.returncode != 0 or not txt.exists():
                      return ""

                  return txt.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

          def parse_issue(text, label):
              match = ISSUE_RE.search(text) or ISSUE_RE.search(label)
              return int(match.group(1)) if match else None

          def parse_date(text):
              # Strongest form first: "As of 11 January 2024 at 13:00".
              patterns = [
                  rf"\bAs\s+of\s+(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})",
                  rf"\b7\s+Oct\s+2023\s*-\s*(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})",
                  rf"\bGeneral\s+updates\s*-\s*as\s+of\s+(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})",
                  rf"\b(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})\b",
              ]

              for pattern in patterns:
                  m = re.search(pattern, text[:5000], re.I)
                  if not m:
                      continue

                  try:
                      d = datetime.strptime(
                          clean(m.group(1)),
                          "%d %B %Y",
                      ).date()
                  except Exception:
                      continue

                  if date(2023,10,8) <= d <= date.today():
                      return d.isoformat()

              # Some WHO PDFs abbreviate months.
              m = re.search(
                  r"\bAs\s+of\s+(\d{1,2}\s+"
                  r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)"
                  r"\s+20\d{2})",
                  text[:5000],
                  re.I,
              )

              if m:
                  try:
                      d = datetime.strptime(
                          clean(m.group(1)),
                          "%d %b %Y",
                      ).date()
                      if date(2023,10,8) <= d <= date.today():
                          return d.isoformat()
                  except Exception:
                      pass

              return None

          def n(raw):
              return int(re.sub(r"[\s,]", "", raw))

          NUM = r"\d{1,3}(?:[,\s]\d{3})+|\d{3,6}"

          def valid(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def candidate_pairs(text):
              """
              Return only pairs from WHO's explicit Gaza headline/cumulative
              formats. No contextual guessing and no 'nearest number' logic.
              """
              candidates = []

              # Format A: Issue 10 style:
              # 8,805 Number of people killed in Gaza
              # 22,240 Number of people injured in Gaza
              killed = re.findall(
                  rf"({NUM})\s+"
                  rf"(?:Number\s+of\s+people\s+)?"
                  rf"killed\s+in\s+Gaza",
                  text,
                  re.I,
              )
              injured = re.findall(
                  rf"({NUM})\s+"
                  rf"(?:Number\s+of\s+people\s+)?"
                  rf"injured\s+in\s+Gaza",
                  text,
                  re.I,
              )

              for k in killed:
                  for i in injured:
                      kv, iv = n(k), n(i)
                      if valid(kv, iv):
                          candidates.append((kv, iv, "labelled-gaza"))

              # Format B: WHO overview cards:
              # 35,456 Fatalities
              # 79,476 Injuries
              #
              # Restrict this to the first-page overview zone and require
              # "Gaza Strip" + "Source: Ministry of Health".
              overview = text[:9000]
              low = overview.lower()

              if (
                  "gaza strip" in low
                  and (
                      "source: ministry of health" in low
                      or "source: ministry of health." in low
                  )
              ):
                  fatality_matches = re.findall(
                      rf"({NUM})\s+Fatalities\b",
                      overview,
                      re.I,
                  )
                  injury_matches = re.findall(
                      rf"({NUM})\s+Injuries\b",
                      overview,
                      re.I,
                  )

                  for k in fatality_matches:
                      for i in injury_matches:
                          kv, iv = n(k), n(i)
                          if valid(kv, iv):
                              candidates.append(
                                  (kv, iv, "who-overview-cards")
                              )

              # Format C: later WHO narrative:
              # "This brings the cumulative toll since October 2023 to
              # 68 858 deaths and 170 664 injuries."
              cumulative_patterns = [
                  re.compile(
                      rf"(?:cumulative(?:ly)?|cumulative\s+toll)"
                      rf".{{0,100}}?since\s+October\s+2023"
                      rf".{{0,120}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities|people\s+have\s+been\s+killed|people\s+killed)"
                      rf".{{0,120}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|injured)",
                      re.I | re.S,
                  ),
                  re.compile(
                      rf"brings?\s+the\s+cumulative\s+toll"
                      rf".{{0,80}}?since\s+October\s+2023"
                      rf".{{0,100}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities)"
                      rf".{{0,100}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|injured)",
                      re.I | re.S,
                  ),
                  re.compile(
                      rf"Cumulatively,\s+since\s+October\s+2023,"
                      rf".{{0,100}}?(?P<k>{NUM})\s+"
                      rf"(?:people\s+)?(?:have\s+been\s+)?killed"
                      rf".{{0,100}}?(?P<i>{NUM})\s+injured",
                      re.I | re.S,
                  ),
              ]

              for pattern in cumulative_patterns:
                  for m in pattern.finditer(text):
                      kv = n(m.group("k"))
                      iv = n(m.group("i"))
                      if valid(kv, iv):
                          candidates.append(
                              (kv, iv, "explicit-cumulative")
                          )

              return candidates

          def parse_report(url, label):
              try:
                  text = pdf_text(url)
              except Exception as error:
                  print("PDF failed:", url, error)
                  return None

              if len(text.strip()) < 200:
                  return None

              effective = parse_date(text)
              if not effective:
                  return None

              pairs = candidate_pairs(text)
              if not pairs:
                  return None

              # Collapse duplicate extractions of the same pair.
              by_pair = {}
              for killed, injured, method in pairs:
                  by_pair.setdefault(
                      (killed, injured),
                      set(),
                  ).add(method)

              if len(by_pair) != 1:
                  print(
                      "AMBIGUOUS WHO REPORT OMITTED",
                      url,
                      list(by_pair),
                  )
                  return None

              (killed, injured), methods = next(
                  iter(by_pair.items())
              )

              issue = parse_issue(text, label)

              return {
                  "date": effective,
                  "killed": killed,
                  "injured": injured,
                  "source_url": url,
                  "series_label": (
                      f"WHO Emergency Situation Report"
                      + (f" #{issue}" if issue else "")
                  ),
                  "source_type": "WHO EMRO",
                  "parse_method": "+".join(sorted(methods)),
                  "parser_version": VERSION,
              }

          def validate(rows):
              # Same-date dedupe.
              by_date = {}

              for row in rows:
                  d = row["date"]

                  if d not in by_date:
                      by_date[d] = row
                      continue

                  old = by_date[d]

                  if (
                      old["killed"] == row["killed"]
                      and old["injured"] == row["injured"]
                  ):
                      continue

                  # Two WHO reports disagreeing for the same as-of date:
                  # omit rather than choose.
                  print(
                      "WHO DATE CONFLICT OMITTED",
                      d,
                      (old["killed"], old["injured"]),
                      (row["killed"], row["injured"]),
                  )
                  by_date[d] = None

              ordered = [
                  row
                  for row in by_date.values()
                  if row is not None
              ]
              ordered.sort(key=lambda r: r["date"])

              final = []

              for row in ordered:
                  if final:
                      prev = final[-1]

                      # Cumulative totals should not go backwards.
                      if (
                          row["killed"] < prev["killed"]
                          or row["injured"] < prev["injured"]
                      ):
                          print(
                              "DECREASING WHO POINT OMITTED",
                              row,
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              reports = discover()
              rows = []

              # WHO archive is small enough to parse sequentially and gently.
              for index, (url, label) in enumerate(
                  reports.items(),
                  start=1,
              ):
                  print(
                      f"Parsing WHO report {index}/{len(reports)}"
                  )

                  row = parse_report(url, label)

                  if row:
                      print(
                          "FOUND",
                          row["date"],
                          row["killed"],
                          row["injured"],
                          row["series_label"],
                      )
                      rows.append(row)

              rows = validate(rows)

              if not rows:
                  raise RuntimeError(
                      "No unambiguous WHO Gaza casualty totals were parsed."
                  )

              # Never fill gaps or interpolate. Accuracy is preferred over
              # frequency. The frontend can calculate rates between points.
              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "source_type": row["source_type"],
                      "parser_version": VERSION,
                  }
                  for row in rows
              ]

              payload = {
                  "source": (
                      "WHO Eastern Mediterranean Regional Office "
                      "Gaza/oPt Emergency Situation Reports"
                  ),
                  "underlying_source": (
                      "Gaza Ministry of Health, as cited by WHO"
                  ),
                  "method": (
                      "Only explicit WHO-labelled Gaza totals or explicit "
                      "cumulative-since-October-2023 casualty statements "
                      "are accepted. No OCR, interpolation, nearest-number "
                      "matching, or inferred totals."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "WHO records from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_who.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline from WHO"
          git push
