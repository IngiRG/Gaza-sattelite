name: Update Gaza casualty dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and normalize Tech for Palestine casualty data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://data.techforpalestine.org/api/v2/casualties_daily.min.json"
          DOCS = "https://data.techforpalestine.org/docs/casualties-daily/"
          OUT = Path("data/casualty-timeline.json")

          req = urllib.request.Request(
              API,
              headers={
                  "User-Agent": "DestructionVisualized/1.0",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              source = json.load(response)

          if not isinstance(source, list) or len(source) < 100:
              raise RuntimeError(
                  f"Unexpected casualty API response: {type(source)} / "
                  f"{len(source) if isinstance(source, list) else 'not-list'}"
              )

          records = []

          def integer(value):
              if value is None:
                  return None
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          for raw in source:
              date = raw.get("report_date")
              if not date:
                  continue

              # Prefer explicitly reported cumulative values. The ext_ fields
              # provide the project's continuous daily series when a value is
              # absent. Keep flags so the frontend can distinguish them.
              killed_reported = integer(raw.get("killed_cum"))
              injured_reported = integer(raw.get("injured_cum"))
              children_reported = integer(raw.get("killed_children_cum"))
              women_reported = integer(raw.get("killed_women_cum"))

              killed = (
                  killed_reported
                  if killed_reported is not None
                  else integer(raw.get("ext_killed_cum"))
              )
              injured = (
                  injured_reported
                  if injured_reported is not None
                  else integer(raw.get("ext_injured_cum"))
              )
              children = (
                  children_reported
                  if children_reported is not None
                  else integer(raw.get("ext_killed_children_cum"))
              )
              women = (
                  women_reported
                  if women_reported is not None
                  else integer(raw.get("ext_killed_women_cum"))
              )

              if killed is None or injured is None:
                  continue

              records.append({
                  "date": date,
                  "killed": killed,
                  "injured": injured,
                  "children_killed": children,
                  "women_killed": women,

                  "killed_reported": killed_reported is not None,
                  "injured_reported": injured_reported is not None,
                  "children_reported": children_reported is not None,
                  "women_reported": women_reported is not None,

                  "daily_killed": integer(raw.get("killed")),
                  "daily_injured": integer(raw.get("injured")),
                  "ext_daily_killed": integer(raw.get("ext_killed")),
                  "ext_daily_injured": integer(raw.get("ext_injured")),

                  "report_source": raw.get("report_source", "missing"),
                  "report_period": raw.get("report_period"),
                  "source_url": DOCS,
                  "series_label": "Tech for Palestine Daily Casualties",
                  "source_type": "Tech for Palestine",
              })

          records.sort(key=lambda row: row["date"])

          if len(records) < 100:
              raise RuntimeError(
                  f"Only {len(records)} usable records were produced; refusing to publish."
              )

          # Basic integrity checks. We do not alter the source values.
          for row in records:
              if row["killed"] < 0 or row["injured"] < 0:
                  raise RuntimeError(f"Negative casualty total on {row['date']}")
              if row["injured"] < row["killed"]:
                  # Do not fail on this assumption globally: just sanity-log it.
                  print(
                      "WARNING injured total below killed total:",
                      row["date"],
                      row["killed"],
                      row["injured"],
                  )

          OUT.parent.mkdir(parents=True, exist_ok=True)

          payload = {
              "source": "Tech for Palestine Daily Casualties - Gaza",
              "source_url": API,
              "documentation_url": DOCS,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "method": (
                  "Daily Gaza casualty data downloaded from the Tech for Palestine "
                  "v2 casualties_daily API. Explicit cumulative values are preferred. "
                  "When a field is absent, the corresponding ext_ field supplied by "
                  "the dataset is used for continuity; reported/extrapolated flags are "
                  "retained for the frontend."
              ),
              "records": records,
          }

          OUT.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          print(
              f"SUCCESS: {len(records)} daily records, "
              f"{records[0]['date']} through {records[-1]['date']}"
          )
          print(
              "Latest:",
              records[-1]["killed"],
              "killed;",
              records[-1]["injured"],
              "injured;",
              records[-1]["children_killed"],
              "children killed;",
              records[-1]["women_killed"],
              "women killed",
          )
          PY

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline"
          git push
