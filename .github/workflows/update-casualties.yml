name: Update Gaza casualty timeline from Ministry of Health

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests beautifulsoup4

      - name: Build casualty timeline from Gaza Ministry of Health
        shell: bash
        run: |
          cat > /tmp/update_moh.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, date
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import re
          import time

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          BASE = "https://www.moh.gov.ps/portal/"
          VERSION = 16
          START = date(2023, 10, 8)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-MoH-CasualtyTimeline/16.0",
              "Accept-Language": "ar,en;q=0.9",
          })

          # Public Ministry archive/category pages. The English category is
          # useful for early-war translated statements; the main archive
          # provides the Arabic material and newer releases.
          LISTINGS = [
              BASE + "archive/",
              BASE + "category/english/",
              BASE + "en/",
          ]

          ARABIC_DIGITS = str.maketrans({
              "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
              "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
              "٬": ",", "،": ",",
          })

          NUM = r"\d{1,3}(?:,\d{3})+|\d{3,6}"

          EN_PATTERNS = [
              # "2,215 Palestinians killed ... and 8,714 citizens were injured"
              re.compile(
                  rf"(?P<k>{NUM})\s+Palestinians?\s+"
                  rf"(?:have\s+been\s+|were\s+|confirmed\s+)?killed"
                  rf".{{0,260}}?(?P<i>{NUM})\s+"
                  rf"(?:Palestinians?|citizens|people|others)?\s*"
                  rf"(?:have\s+been\s+|were\s+|are\s+)?injured",
                  re.I | re.S,
              ),

              # "death toll ... increased to 3,785 deaths ... injuring 12,493"
              re.compile(
                  rf"(?:death\s+toll|total\s+number\s+of\s+(?:martyrs|deaths)|"
                  rf"casualt(?:y|ies)\s+toll)"
                  rf".{{0,140}}?(?P<k>{NUM})"
                  rf".{{0,320}}?(?:injur(?:ed|ies|ing)|wounded)"
                  rf".{{0,90}}?(?P<i>{NUM})",
                  re.I | re.S,
              ),

              # "total number of martyrs has reached 72,208, with 172,068 wounded"
              re.compile(
                  rf"(?:total\s+number\s+of\s+)?martyrs?"
                  rf".{{0,100}}?(?:reached|is|stands?\s+at|to)?\s*"
                  rf"(?P<k>{NUM})"
                  rf".{{0,160}}?(?:with|and)\s+"
                  rf"(?P<i>{NUM})\s+(?:wounded|injured)",
                  re.I | re.S,
              ),

              # "61,258 fatalities and 152,045 injuries"
              re.compile(
                  rf"(?P<k>{NUM})\s+(?:deaths|fatalities|martyrs)"
                  rf".{{0,120}}?(?:and|with)\s+"
                  rf"(?P<i>{NUM})\s+(?:injuries|injured|wounded)",
                  re.I | re.S,
              ),
          ]

          AR_PATTERNS = [
              # "ارتفعت حصيلة العدوان ... إلى 45,000 شهيد و 100,000 إصابة"
              re.compile(
                  rf"(?:ارتفعت|ارتفاع|بلغت|تبلغ|وصلت)\s+"
                  rf"(?:حصيلة|الحصيلة)"
                  rf".{{0,160}}?(?P<k>{NUM})\s+"
                  rf"(?:شهيد|شهيداً|شهيدا|شهداء)"
                  rf".{{0,160}}?(?P<i>{NUM})\s+"
                  rf"(?:إصابة|اصابة|مصاب|جريح|جريحاً|جريحا)",
                  re.S,
              ),

              # "حصيلة العدوان الإسرائيلي 45,000 شهيد و100,000 إصابة"
              re.compile(
                  rf"(?:حصيلة|الحصيلة)"
                  rf".{{0,180}}?(?P<k>{NUM})\s+"
                  rf"(?:شهيد|شهيداً|شهيدا|شهداء)"
                  rf".{{0,180}}?(?P<i>{NUM})\s+"
                  rf"(?:إصابة|اصابة|مصاب|جريح|جريحاً|جريحا)",
                  re.S,
              ),

              # "إجمالي عدد الشهداء 45,000 ... إجمالي عدد الجرحى 100,000"
              re.compile(
                  rf"(?:إجمالي|اجمالي)\s+(?:عدد\s+)?(?:الشهداء|الوفيات)"
                  rf".{{0,100}}?(?P<k>{NUM})"
                  rf".{{0,260}}?(?:إجمالي|اجمالي)\s+(?:عدد\s+)?"
                  rf"(?:الجرحى|المصابين|الإصابات|الاصابات)"
                  rf".{{0,100}}?(?P<i>{NUM})",
                  re.S,
              ),

              # "72,208 شهيد ... 172,068 جريح/إصابة"
              re.compile(
                  rf"(?P<k>{NUM})\s+"
                  rf"(?:شهيد|شهيداً|شهيدا|شهداء)"
                  rf".{{0,220}}?(?P<i>{NUM})\s+"
                  rf"(?:إصابة|اصابة|مصاب|جريح|جريحاً|جريحا|الجرحى)",
                  re.S,
              ),
          ]

          def normalize(text):
              text = (text or "").translate(ARABIC_DIGITS)
              text = text.replace("\xa0", " ")
              return re.sub(r"\s+", " ", text).strip()

          def num(raw):
              return int(raw.replace(",", ""))

          def get(url, timeout=35):
              r = session.get(url, timeout=timeout)
              if r.status_code == 404:
                  return None
              r.raise_for_status()
              return r

          def parse_date_from_page(soup, text):
              for attrs in (
                  {"property": "article:published_time"},
                  {"name": "date"},
                  {"name": "DC.date"},
              ):
                  tag = soup.find("meta", attrs=attrs)
                  if tag and tag.get("content"):
                      raw = tag["content"].strip()
                      try:
                          return datetime.fromisoformat(
                              raw.replace("Z", "+00:00")
                          ).date()
                      except Exception:
                          pass

              # Site visibly prints dd/mm/yyyy on posts.
              m = re.search(
                  r"\b(\d{1,2})/(\d{1,2})/(20\d{2})\b",
                  text[:1800],
              )
              if m:
                  try:
                      return date(
                          int(m.group(3)),
                          int(m.group(2)),
                          int(m.group(1)),
                      )
                  except Exception:
                      pass

              # English month-name fallback.
              m = re.search(
                  r"\b(\d{1,2})\s+"
                  r"(January|February|March|April|May|June|July|August|"
                  r"September|October|November|December)\s+(20\d{2})\b",
                  text[:1800],
                  re.I,
              )
              if m:
                  try:
                      return datetime.strptime(
                          " ".join(m.groups()),
                          "%d %B %Y",
                      ).date()
                  except Exception:
                      pass

              return None

          def discover_posts():
              found = {}

              for root in LISTINGS:
                  empty = 0

                  for page_num in range(1, 220):
                      url = (
                          root
                          if page_num == 1
                          else urljoin(root, f"page/{page_num}/")
                      )

                      try:
                          r = get(url)
                      except Exception as error:
                          print("LISTING FAILED", url, error)
                          empty += 1
                          if empty >= 5:
                              break
                          continue

                      if r is None:
                          empty += 1
                          if empty >= 3:
                              break
                          continue

                      soup = BeautifulSoup(r.text, "html.parser")
                      page_links = 0

                      for a in soup.find_all("a", href=True):
                          href = urljoin(url, a["href"]).split("#", 1)[0]

                          if not href.startswith(BASE):
                              continue

                          # Exclude archive/category/navigation URLs.
                          if any(
                              token in href
                              for token in (
                                  "/category/",
                                  "/tag/",
                                  "/author/",
                                  "/page/",
                                  "/archive/",
                                  "/en/",
                                  "/wp-",
                                  "?",
                              )
                          ):
                              continue

                          label = normalize(
                              a.get_text(" ", strip=True)
                          )

                          # Individual WordPress posts have a trailing slash
                          # and a non-empty slug under /portal/.
                          tail = href[len(BASE):].strip("/")
                          if not tail or "/" in tail:
                              continue

                          found[href] = label
                          page_links += 1

                      if page_links:
                          empty = 0
                      else:
                          empty += 1

                      if empty >= 5:
                          break

                      # Avoid hammering the Ministry site.
                      time.sleep(0.06)

              print("Discovered", len(found), "MoH post URLs")
              return found

          def full_war_context(text, published):
              low = text.lower()

              # Explicit full-war anchors in English.
              english_anchor = any(
                  phrase in low
                  for phrase in (
                      "since 7 october 2023",
                      "since october 7 2023",
                      "since the start of escalation",
                      "since the start of the escalation",
                      "since the beginning of the ongoing escalation",
                      "since the start of hostilities",
                  )
              )

              # Arabic full-war anchors.
              arabic_anchor = any(
                  phrase in text
                  for phrase in (
                      "منذ السابع من أكتوبر",
                      "منذ 7 أكتوبر",
                      "منذ السابع من اكتوبر",
                      "منذ 7 اكتوبر",
                      "منذ بدء العدوان",
                      "منذ بداية العدوان",
                      "منذ بدء الحرب",
                      "منذ بداية الحرب",
                      "منذ بدء التصعيد",
                  )
              )

              # Explicit subset anchors make a statement ineligible unless
              # the same page also clearly states the full-war baseline.
              subset = any(
                  phrase in low
                  for phrase in (
                      "since the ceasefire",
                      "post-ceasefire",
                      "since ceasefire",
                  )
              ) or any(
                  phrase in text
                  for phrase in (
                      "منذ وقف إطلاق النار",
                      "منذ وقف اطلاق النار",
                      "منذ سريان وقف إطلاق النار",
                      "منذ سريان الهدنة",
                      "منذ الهدنة",
                  )
              )

              if subset and not (english_anchor or arabic_anchor):
                  return False

              if english_anchor or arabic_anchor:
                  return True

              # In the first weeks after 7 Oct, official MoH updates often
              # simply say "death toll" because the conflict had only just
              # begun. Permit that narrow early period.
              if published and published <= date(2023, 11, 30):
                  return True

              # Later pages without an explicit full-war anchor are accepted
              # only if they use unambiguous TOTAL/cumulative language.
              total_words = (
                  "total number of martyrs" in low
                  or "death toll" in low
                  or "cumulative" in low
                  or "إجمالي عدد الشهداء" in text
                  or "اجمالي عدد الشهداء" in text
                  or "حصيلة العدوان" in text
                  or "الحصيلة" in text
              )

              return total_words

          def extract_pairs(text):
              pairs = []

              for pattern in EN_PATTERNS + AR_PATTERNS:
                  for m in pattern.finditer(text):
                      k = num(m.group("k"))
                      i = num(m.group("i"))

                      if (
                          100 <= k <= 500000
                          and 100 <= i <= 1000000
                          and i > k
                      ):
                          pairs.append((k, i))

              return set(pairs)

          def parse_post(url):
              try:
                  r = get(url)
              except Exception as error:
                  print("POST FAILED", url, error)
                  return None

              if r is None:
                  return None

              soup = BeautifulSoup(r.text, "html.parser")

              for tag in soup([
                  "script", "style", "nav",
                  "header", "footer", "form",
              ]):
                  tag.decompose()

              text = normalize(
                  soup.get_text(" ", strip=True)
              )

              published = parse_date_from_page(
                  soup,
                  text,
              )

              if (
                  published is None
                  or published < START
                  or published > date.today()
              ):
                  return None

              low = text.lower()

              # Must clearly concern Gaza casualties.
              if (
                  "gaza" not in low
                  and "غزة" not in text
              ):
                  return None

              if not full_war_context(
                  text,
                  published,
              ):
                  return None

              pairs = extract_pairs(text)

              if not pairs:
                  return None

              # One official post containing multiple different plausible
              # cumulative pairs is ambiguous; do not guess.
              if len(pairs) != 1:
                  print(
                      "AMBIGUOUS MOH POST",
                      published,
                      url,
                      sorted(pairs),
                  )
                  return None

              killed, injured = next(iter(pairs))

              return {
                  "date": published.isoformat(),
                  "killed": killed,
                  "injured": injured,
                  "source_url": url,
                  "series_label": "Gaza Ministry of Health",
                  "source_type": "Gaza Ministry of Health",
                  "parser_version": VERSION,
              }

          def reconcile(rows):
              # Same-date duplicates are common because translated and Arabic
              # versions may both exist. Agreement is good; disagreement means
              # omit that date instead of choosing one.
              by_date = {}

              for row in rows:
                  by_date.setdefault(
                      row["date"],
                      [],
                  ).append(row)

              selected = []

              for d in sorted(by_date):
                  day_rows = by_date[d]
                  pairs = {
                      (r["killed"], r["injured"])
                      for r in day_rows
                  }

                  if len(pairs) != 1:
                      print(
                          "DATE CONFLICT OMITTED",
                          d,
                          sorted(pairs),
                      )
                      continue

                  # Prefer an English URL only for readability if the figures
                  # are identical; both are Ministry sources.
                  day_rows.sort(
                      key=lambda r: (
                          "/english/" not in r["source_url"]
                          and "press-release" not in r["source_url"],
                          r["source_url"],
                      )
                  )
                  selected.append(day_rows[0])

              # Validate cumulative sequence without altering source values.
              final = []

              for row in selected:
                  if final:
                      prev = final[-1]

                      if (
                          row["killed"] < prev["killed"]
                          or row["injured"] < prev["injured"]
                      ):
                          print(
                              "DECREASING POINT OMITTED",
                              row,
                          )
                          continue

                      d1 = datetime.fromisoformat(
                          prev["date"]
                      ).date()
                      d2 = datetime.fromisoformat(
                          row["date"]
                      ).date()
                      days = max(1, (d2 - d1).days)

                      # Only catches obvious parser errors, not substantive
                      # source revisions.
                      if (
                          (row["killed"] - prev["killed"]) / days > 5000
                          or
                          (row["injured"] - prev["injured"]) / days > 15000
                      ):
                          print(
                              "IMPOSSIBLE JUMP OMITTED",
                              row,
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              posts = discover_posts()
              rows = []

              print(
                  "Parsing",
                  len(posts),
                  "official Ministry posts",
              )

              with ThreadPoolExecutor(
                  max_workers=5
              ) as executor:
                  futures = {
                      executor.submit(
                          parse_post,
                          url,
                      ): url
                      for url in posts
                  }

                  done = 0

                  for future in as_completed(futures):
                      done += 1

                      try:
                          row = future.result()
                      except Exception as error:
                          print(
                              "PARSE FAILED",
                              futures[future],
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "FOUND",
                              row["date"],
                              row["killed"],
                              row["injured"],
                          )
                          rows.append(row)

                      if done % 100 == 0:
                          print(
                              "Checked",
                              done,
                              "/",
                              len(posts),
                          )

              rows = reconcile(rows)

              if len(rows) < 10:
                  raise RuntimeError(
                      "Only "
                      + str(len(rows))
                      + " Ministry casualty points parsed. "
                      + "Refusing to overwrite the existing timeline."
                  )

              payload = {
                  "source": "Gaza Ministry of Health official website",
                  "method": (
                      "Official moh.gov.ps posts only. English and Arabic "
                      "cumulative killed/injured statements are parsed; "
                      "Arabic-Indic numerals are normalized. Statements "
                      "limited to a ceasefire/sub-period are rejected. "
                      "Ambiguous, conflicting, decreasing, or implausible "
                      "points are omitted. No WHO/OCHA fallback, OCR, "
                      "interpolation, or inferred totals."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": rows,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(rows),
                  "direct Ministry points from",
                  rows[0]["date"],
                  "through",
                  rows[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_moh.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline from Ministry of Health"
          git push
