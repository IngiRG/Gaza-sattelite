name: Update Tech for Palestine datasets

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and normalize datasets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          CAS_API = "https://data.techforpalestine.org/api/v2/casualties_daily.min.json"
          INFRA_API = "https://data.techforpalestine.org/api/v3/infrastructure-damaged.min.json"

          CAS_DOCS = "https://data.techforpalestine.org/docs/casualties-daily/"
          INFRA_DOCS = "https://data.techforpalestine.org/docs/infrastructure-damaged/"

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DestructionVisualized/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def integer(value):
              if value is None:
                  return None
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          def nested(row, group, field):
              value = row.get(group)
              if not isinstance(value, dict):
                  return None
              return integer(value.get(field))

          # ---------------- Casualties ----------------
          casualty_source = fetch(CAS_API)

          if not isinstance(casualty_source, list) or len(casualty_source) < 100:
              raise RuntimeError("Unexpected casualty API response")

          casualty_records = []

          for raw in casualty_source:
              date = raw.get("report_date")
              if not date:
                  continue

              k_r = integer(raw.get("killed_cum"))
              i_r = integer(raw.get("injured_cum"))
              c_r = integer(raw.get("killed_children_cum"))
              w_r = integer(raw.get("killed_women_cum"))

              killed = k_r if k_r is not None else integer(raw.get("ext_killed_cum"))
              injured = i_r if i_r is not None else integer(raw.get("ext_injured_cum"))
              children = c_r if c_r is not None else integer(raw.get("ext_killed_children_cum"))
              women = w_r if w_r is not None else integer(raw.get("ext_killed_women_cum"))

              if killed is None or injured is None:
                  continue

              casualty_records.append({
                  "date": date,
                  "killed": killed,
                  "injured": injured,
                  "children_killed": children,
                  "women_killed": women,
                  "killed_reported": k_r is not None,
                  "injured_reported": i_r is not None,
                  "children_reported": c_r is not None,
                  "women_reported": w_r is not None,
                  "report_source": raw.get("report_source", "missing"),
                  "report_period": raw.get("report_period"),
                  "source_url": CAS_DOCS,
                  "series_label": "Tech for Palestine Daily Casualties",
                  "source_type": "Tech for Palestine",
              })

          casualty_records.sort(key=lambda r: r["date"])

          # ---------------- Infrastructure ----------------
          infrastructure_source = fetch(INFRA_API)

          if not isinstance(infrastructure_source, list) or len(infrastructure_source) < 20:
              raise RuntimeError("Unexpected infrastructure API response")

          infrastructure_records = []

          for raw in infrastructure_source:
              date = raw.get("report_date")
              if not date:
                  continue

              civic_r = nested(raw, "civic_buildings", "destroyed")
              civic_ext = nested(raw, "civic_buildings", "ext_destroyed")

              edu_d_r = nested(raw, "educational_buildings", "destroyed")
              edu_d_ext = nested(raw, "educational_buildings", "ext_destroyed")
              edu_x_r = nested(raw, "educational_buildings", "damaged")
              edu_x_ext = nested(raw, "educational_buildings", "ext_damaged")

              mosque_d_r = nested(raw, "places_of_worship", "mosques_destroyed")
              mosque_d_ext = nested(raw, "places_of_worship", "ext_mosques_destroyed")
              mosque_x_r = nested(raw, "places_of_worship", "mosques_damaged")
              mosque_x_ext = nested(raw, "places_of_worship", "ext_mosques_damaged")
              church_r = nested(raw, "places_of_worship", "churches_destroyed")
              church_ext = nested(raw, "places_of_worship", "ext_churches_destroyed")

              residential_r = nested(raw, "residential", "destroyed")
              residential_ext = nested(raw, "residential", "ext_destroyed")

              infrastructure_records.append({
                  "date": date,

                  "residential_destroyed": residential_r if residential_r is not None else residential_ext,
                  "residential_reported": residential_r is not None,

                  "educational_destroyed": edu_d_r if edu_d_r is not None else edu_d_ext,
                  "educational_destroyed_reported": edu_d_r is not None,

                  "educational_damaged": edu_x_r if edu_x_r is not None else edu_x_ext,
                  "educational_damaged_reported": edu_x_r is not None,

                  "civic_destroyed": civic_r if civic_r is not None else civic_ext,
                  "civic_reported": civic_r is not None,

                  "mosques_destroyed": mosque_d_r if mosque_d_r is not None else mosque_d_ext,
                  "mosques_destroyed_reported": mosque_d_r is not None,

                  "mosques_damaged": mosque_x_r if mosque_x_r is not None else mosque_x_ext,
                  "mosques_damaged_reported": mosque_x_r is not None,

                  "churches_destroyed": church_r if church_r is not None else church_ext,
                  "churches_reported": church_r is not None,

                  "source_url": INFRA_DOCS,
                  "series_label": "Tech for Palestine Infrastructure Damaged",
                  "source_type": "Tech for Palestine",
              })

          infrastructure_records.sort(key=lambda r: r["date"])

          # Require at least one usable infrastructure metric.
          infrastructure_records = [
              r for r in infrastructure_records
              if any(
                  r[k] is not None
                  for k in (
                      "residential_destroyed",
                      "educational_destroyed",
                      "educational_damaged",
                      "civic_destroyed",
                      "mosques_destroyed",
                      "mosques_damaged",
                      "churches_destroyed",
                  )
              )
          ]

          if len(casualty_records) < 100:
              raise RuntimeError(f"Only {len(casualty_records)} casualty records produced")

          if len(infrastructure_records) < 20:
              raise RuntimeError(f"Only {len(infrastructure_records)} infrastructure records produced")

          Path("data").mkdir(parents=True, exist_ok=True)

          Path("data/casualty-timeline.json").write_text(
              json.dumps({
                  "source": "Tech for Palestine Daily Casualties - Gaza",
                  "source_url": CAS_API,
                  "documentation_url": CAS_DOCS,
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "records": casualty_records,
              }, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          Path("data/infrastructure-timeline.json").write_text(
              json.dumps({
                  "source": "Tech for Palestine Infrastructure Damaged",
                  "source_url": INFRA_API,
                  "documentation_url": INFRA_DOCS,
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "method": (
                      "Explicit reported fields are preferred. If an explicit field "
                      "is absent, the corresponding ext_ field supplied by Tech for "
                      "Palestine is used. Reported flags are retained so the frontend "
                      "can distinguish actual observations from continuous values."
                  ),
                  "records": infrastructure_records,
              }, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          print(
              f"Casualties: {len(casualty_records)} records, "
              f"{casualty_records[0]['date']} to {casualty_records[-1]['date']}"
          )
          print(
              f"Infrastructure: {len(infrastructure_records)} records, "
              f"{infrastructure_records[0]['date']} to {infrastructure_records[-1]['date']}"
          )
          PY

      - name: Commit datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json data/infrastructure-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Tech for Palestine datasets"
          git push
