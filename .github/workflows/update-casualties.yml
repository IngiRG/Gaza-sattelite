name: Update Gaza casualty timeline from WHO

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4 pdfplumber pymupdf

      - name: Build WHO casualty timeline
        shell: bash
        run: |
          cat > /tmp/update_who.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urljoin
          import json
          import re
          import subprocess
          import tempfile

          import requests
          import pdfplumber
          import fitz
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          VERSION = 22

          ARCHIVES = [
              # Canonical WHO Gaza Emergency Situation Reports archive.
              "https://www.emro.who.int/opt/information-resources/emergency-situation-reports.html",
          ]

          # WHO's archive currently resolves Issue 68 to the wrong PDF on
          # some mirrors. This is the official WHO EMRO Issue 68 PDF.
          DIRECT_ISSUE_URLS = {
              68: "https://www.emro.who.int/images/stories/palestine/Sitrep_68.pdf",
          }

          VERIFIED_ISSUE_DATES = {
              # WHO canonical archive: Issue 68, 31 March 2026.
              68: "2026-03-31",
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-WHO-CasualtyTimeline/10.0",
              "Accept-Language": "en",
          })

          ISSUE_LABEL = re.compile(
              r"\bIssue\s+(\d+)\s*,?\s*"
              r"(\d{1,2}\s+"
              r"(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|"
              r"May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|"
              r"Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
              r"\s+20\d{2})",
              re.I,
          )

          PDF_ISSUE = re.compile(
              r"\bIssue\s*#?\s*(\d+)\b",
              re.I,
          )

          NUM = r"\d{1,3}(?:[,\s]\d{3})+|\d{3,6}"

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def n(raw):
              return int(re.sub(r"[\s,]", "", raw))

          def get(url, timeout=90):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r

          def parse_label_date(raw):
              raw = clean(raw)
              for fmt in (
                  "%d %B %Y",
                  "%d %b %Y",
              ):
                  try:
                      return datetime.strptime(
                          raw,
                          fmt,
                      ).date().isoformat()
                  except Exception:
                      pass
              return None

          def discover():
              """
              The WHO archive is our source of truth for:
              - issue number
              - issue/report date
              - PDF URL

              We do NOT infer those values from arbitrary PDF body text.
              """
              issues = {}

              for archive in ARCHIVES:
                  try:
                      soup = BeautifulSoup(
                          get(archive).text,
                          "html.parser",
                      )
                  except Exception as error:
                      print("ARCHIVE FAILED", archive, error)
                      continue

                  links = soup.find_all("a", href=True)

                  for a in links:
                      label = clean(
                          a.get_text(" ", strip=True)
                      )
                      match = ISSUE_LABEL.search(label)

                      if not match:
                          continue

                      issue = int(match.group(1))
                      report_date = parse_label_date(
                          match.group(2)
                      )

                      if not report_date:
                          continue

                      href = urljoin(
                          archive,
                          a["href"],
                      )

                      # Some archive links redirect to a PDF rather than
                      # ending with .pdf, so do not require a .pdf suffix.
                      current = issues.get(issue)

                      candidate = {
                          "issue": issue,
                          "date": VERIFIED_ISSUE_DATES.get(
                              issue,
                              report_date,
                          ),
                          "url": href,
                          "archive_label": label,
                      }

                      # Canonical archive metadata is authoritative.
                      # We may improve only the URL, never the issue/date.
                      if current is None:
                          issues[issue] = candidate
                      elif (
                          ".pdf" in href.lower()
                          and ".pdf" not in current["url"].lower()
                      ):
                          current["url"] = href

              if not issues:
                  raise RuntimeError(
                      "No WHO Gaza emergency situation-report "
                      "issues were discovered."
                  )

              output = [
                  issues[key]
                  for key in sorted(issues)
              ]

              print(
                  "WHO archive discovered",
                  len(output),
                  "issues:",
                  output[0]["issue"],
                  "through",
                  output[-1]["issue"],
              )

              return output

          def pdf_first_page_issue(pdf_bytes):
              """
              Return the WHO issue number printed on page 1, if present.
              Used to prevent an intermediate WHO page from sending us to
              a different issue's PDF.
              """
              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "candidate.pdf"
                  txt = Path(folder) / "candidate.txt"
                  pdf.write_bytes(pdf_bytes)

                  result = subprocess.run(
                      [
                          "pdftotext",
                          "-f", "1",
                          "-l", "1",
                          "-layout",
                          str(pdf),
                          str(txt),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if (
                      result.returncode != 0
                      or not txt.exists()
                  ):
                      return None

                  content = txt.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  match = PDF_ISSUE.search(content[:2500])
                  return (
                      int(match.group(1))
                      if match else None
                  )

          def resolve_pdf(url, expected_issue):
              """
              Resolve the WHO archive link to the PDF for exactly
              expected_issue.

              Some WHO archive links open an intermediate page containing
              multiple situation-report PDFs. The older resolver simply chose
              the highest-scoring PDF and could therefore select a later issue.
              This version verifies the issue number printed on page 1.
              """
              r = get(url, timeout=90)

              ctype = (
                  r.headers.get(
                      "content-type",
                      "",
                  ).lower()
              )

              # Direct PDF link: only accept it if the printed issue matches.
              if (
                  r.content.startswith(b"%PDF")
                  or "application/pdf" in ctype
              ):
                  actual_issue = pdf_first_page_issue(
                      r.content
                  )

                  if (
                      actual_issue is None
                      or actual_issue == expected_issue
                  ):
                      return r.url, r.content

                  raise RuntimeError(
                      f"direct PDF is issue {actual_issue}, "
                      f"expected issue {expected_issue}"
                  )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser",
              )

              candidates = []

              for a in soup.find_all("a", href=True):
                  href = urljoin(
                      r.url,
                      a["href"],
                  )

                  if ".pdf" not in href.lower():
                      continue

                  label = clean(
                      a.get_text(" ", strip=True)
                  ).lower()
                  low_href = href.lower()

                  score = 0

                  # Strongly prefer a link whose visible text/filename
                  # mentions the exact expected issue.
                  issue_tokens = (
                      f"issue-{expected_issue}",
                      f"issue_{expected_issue}",
                      f"issue {expected_issue}",
                      f"sitrep_{expected_issue}",
                      f"sitrep-{expected_issue}",
                      f"sitrep{expected_issue}",
                  )

                  combined = label + " " + low_href

                  if any(
                      token in combined
                      for token in issue_tokens
                  ):
                      score += 100

                  score += (
                      ("download" in label) * 2
                      + ("report" in label) * 2
                      + ("sitrep" in low_href) * 3
                      + ("palestine" in low_href) * 2
                      + ("opt" in low_href) * 2
                  )

                  candidates.append(
                      (score, href)
                  )

              if not candidates:
                  raise RuntimeError(
                      "WHO archive link did not expose any PDFs: "
                      + url
                  )

              # Highest-likelihood links first, but verify the printed
              # issue number before accepting anything.
              candidates.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              seen = set()

              for _, href in candidates:
                  if href in seen:
                      continue
                  seen.add(href)

                  try:
                      candidate = get(
                          href,
                          timeout=120,
                      )
                  except Exception as error:
                      print(
                          "Candidate PDF fetch failed:",
                          href,
                          error,
                      )
                      continue

                  if not candidate.content.startswith(b"%PDF"):
                      continue

                  actual_issue = pdf_first_page_issue(
                      candidate.content
                  )

                  if actual_issue == expected_issue:
                      print(
                          f"Resolved archive issue {expected_issue} "
                          f"to matching PDF: {candidate.url}"
                      )
                      return (
                          candidate.url,
                          candidate.content,
                      )

                  print(
                      f"Rejected candidate PDF for issue "
                      f"{expected_issue}: printed issue "
                      f"{actual_issue} ({candidate.url})"
                  )

              raise RuntimeError(
                  f"No PDF with printed issue {expected_issue} "
                  f"was found from WHO archive link {url}"
              )

          def report_text_views(pdf_bytes):
              """
              Entire PDF in both layout and raw modes for strict fallback.
              Spatial parsing remains primary.
              """
              outputs = []

              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "report.pdf"
                  pdf.write_bytes(pdf_bytes)

                  for mode in ("layout", "raw"):
                      txt = Path(folder) / f"report-{mode}.txt"

                      command = [
                          "pdftotext",
                      ]

                      command.append(
                          "-layout"
                          if mode == "layout"
                          else "-raw"
                      )

                      command += [
                          str(pdf),
                          str(txt),
                      ]

                      result = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                      )

                      if (
                          result.returncode == 0
                          and txt.exists()
                      ):
                          content = txt.read_text(
                              encoding="utf-8",
                              errors="ignore",
                          )

                          if content.strip():
                              outputs.append(
                                  (mode, content)
                              )

              return outputs

          def valid(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def normalize_views(texts):
              return [
                  (mode, clean(content))
                  for mode, content in texts
                  if clean(content)
              ]

          def extract_number_near_label(flat, label_regex, radius=120):
              values = set()

              for label in re.finditer(
                  label_regex,
                  flat,
                  re.I,
              ):
                  left = flat[
                      max(0, label.start() - radius):
                      label.start()
                  ]
                  right = flat[
                      label.end():
                      min(len(flat), label.end() + radius)
                  ]

                  left_nums = list(re.finditer(NUM, left))
                  right_nums = list(re.finditer(NUM, right))

                  if left_nums:
                      m = left_nums[-1]
                      if len(left) - m.end() <= 70:
                          values.add(n(m.group(0)))

                  if right_nums:
                      m = right_nums[0]
                      if m.start() <= 70:
                          values.add(n(m.group(0)))

              return values

          def layout_early_explicit(flat):
              killed = set()
              injured = set()

              for label in (
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"Palestinians?\s+killed\s+in\s+Gaza",
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"people\s+killed\s+in\s+Gaza",
                  r"Number\s+of\s+people\s+killed\s+in\s+Gaza",
              ):
                  killed.update(
                      extract_number_near_label(flat, label)
                  )

              for label in (
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"Palestinians?\s+injured\s+in\s+Gaza",
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"people\s+injured\s+in\s+Gaza",
                  r"Number\s+of\s+people\s+injured\s+in\s+Gaza",
              ):
                  injured.update(
                      extract_number_near_label(flat, label)
                  )

              return [
                  (k, i, "layout-early-explicit")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def gaza_overview_block(flat):
              low = flat.lower()
              gaza = low.find("gaza strip")
              if gaza < 0:
                  return None

              source = low.find(
                  "source: ministry of health",
                  gaza,
              )
              if source < 0:
                  source = low.find(
                      "source ministry of health",
                      gaza,
                  )
              if source < 0:
                  return None

              stops = []
              for marker in (
                  "health facility",
                  "health care functioning",
                  "healthcare functioning",
                  "health attacks",
                  "hospital functionality",
                  "hospitals functionality",
                  "phcc",
              ):
                  pos = low.find(marker, source + 10)
                  if pos > source:
                      stops.append(pos)

              end = min(stops) if stops else min(len(flat), source + 2400)
              return flat[gaza:end]

          def layout_overview_cards(flat):
              block = gaza_overview_block(flat)
              if not block:
                  return []

              killed = set()
              injured = set()

              for pattern in (
                  rf"(?P<n>{NUM})\s+(?:Reported\s+)?Fatalit(?:y|ies)\b",
                  rf"\bFatalit(?:y|ies)\b[^\d]{{0,50}}(?P<n>{NUM})",
              ):
                  for m in re.finditer(pattern, block, re.I):
                      killed.add(n(m.group("n")))

              for pattern in (
                  rf"(?P<n>{NUM})\s+(?:Reported\s+)?Injur(?:y|ies)\b",
                  rf"\bInjur(?:y|ies)\b[^\d]{{0,50}}(?P<n>{NUM})",
              ):
                  for m in re.finditer(pattern, block, re.I):
                      injured.add(n(m.group("n")))

              return [
                  (k, i, "layout-overview-cards")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def layout_cumulative_sentence(flat):
              patterns = [
                  re.compile(
                      rf"(?:cumulative\s+toll|cumulatively)"
                      rf".{{0,180}}?(?:since\s+October\s+2023|"
                      rf"since\s+7\s+October\s+2023)"
                      rf".{{0,200}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities|people\s+(?:have\s+been\s+)?killed)"
                      rf".{{0,220}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|people\s+injured|injured)",
                      re.I | re.S,
                  ),
                  re.compile(
                      rf"(?:brings?|bringing)\s+the\s+cumulative\s+toll"
                      rf".{{0,180}}?since\s+(?:7\s+)?October\s+2023"
                      rf".{{0,180}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities)"
                      rf".{{0,180}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|injured)",
                      re.I | re.S,
                  ),
              ]

              out = []
              for pattern in patterns:
                  for m in pattern.finditer(flat):
                      k = n(m.group("k"))
                      i = n(m.group("i"))
                      if valid(k, i):
                          out.append((k, i, "layout-cumulative-sentence"))
              return out

          def parse_known_layouts(texts):
              """
              Accept only one of three known WHO structures:
              1) early explicit Gaza killed/injured labels
              2) Gaza Strip Overview + Source: Ministry of Health + Fatalities/Injuries
              3) explicit cumulative-since-Oct-2023 sentence
              """
              all_pairs = {}

              for mode, flat in normalize_views(texts):
                  candidates = []
                  candidates.extend(layout_early_explicit(flat))
                  candidates.extend(layout_overview_cards(flat))
                  candidates.extend(layout_cumulative_sentence(flat))

                  for k, i, method in candidates:
                      all_pairs.setdefault((k, i), set()).add(f"{method}:{mode}")

              return all_pairs



          # -----------------------------------------------------------------
          # SPATIAL PAGE-1 PARSER
          # -----------------------------------------------------------------

          def word_number(text):
              raw = re.sub(r"[,\s]", "", text or "")
              if not re.fullmatch(r"\d{3,6}", raw):
                  return None
              try:
                  return int(raw)
              except Exception:
                  return None

          def spatial_pages(pdf_bytes):
              """
              Extract positioned words from every page independently.

              WHO sometimes places Gaza after West Bank or general sections,
              so limiting the parser to the first few pages loses valid issues.
              """
              with tempfile.NamedTemporaryFile(
                  suffix=".pdf",
                  delete=False,
              ) as tmp:
                  tmp.write(pdf_bytes)
                  tmp_path = tmp.name

              output = []

              try:
                  with pdfplumber.open(tmp_path) as pdf:
                      for page_index, page in enumerate(pdf.pages):
                          words = page.extract_words(
                              x_tolerance=2,
                              y_tolerance=3,
                              keep_blank_chars=False,
                              use_text_flow=False,
                          ) or []

                          output.append({
                              "page": page_index + 1,
                              "width": float(page.width),
                              "height": float(page.height),
                              "words": words,
                          })

                  return output

              finally:
                  try:
                      Path(tmp_path).unlink()
                  except Exception:
                      pass

          def line_groups(words, tolerance=4):
              """
              Convert positioned words into visual lines while retaining the
              bounding box of each line.
              """
              rows = []

              for word in sorted(
                  words,
                  key=lambda w: (
                      float(w.get("top", 0)),
                      float(w.get("x0", 0)),
                  ),
              ):
                  top = float(word.get("top", 0))
                  target = None

                  for row in rows[-8:]:
                      if abs(row["top"] - top) <= tolerance:
                          target = row
                          break

                  if target is None:
                      target = {
                          "top": top,
                          "words": [],
                      }
                      rows.append(target)

                  target["words"].append(word)

              output = []

              for row in rows:
                  ws = sorted(
                      row["words"],
                      key=lambda w: float(w.get("x0", 0)),
                  )
                  text = " ".join(
                      str(w.get("text", ""))
                      for w in ws
                  )
                  output.append({
                      "text": clean(text),
                      "top": min(float(w.get("top", 0)) for w in ws),
                      "bottom": max(float(w.get("bottom", 0)) for w in ws),
                      "x0": min(float(w.get("x0", 0)) for w in ws),
                      "x1": max(float(w.get("x1", 0)) for w in ws),
                      "words": ws,
                  })

              return output

          def numeric_words(words):
              out = []

              for word in words:
                  value = word_number(
                      str(word.get("text", ""))
                  )
                  if value is None:
                      continue

                  out.append({
                      "value": value,
                      "x0": float(word.get("x0", 0)),
                      "x1": float(word.get("x1", 0)),
                      "top": float(word.get("top", 0)),
                      "bottom": float(word.get("bottom", 0)),
                  })

              return out

          def center_x(item):
              return (
                  float(item["x0"])
                  + float(item["x1"])
              ) / 2.0

          def nearest_card_number(
              label,
              numbers,
              minimum,
              maximum,
          ):
              """
              WHO cards generally put the value immediately above/below the
              label and within the same column. Rank by vertical proximity
              with a heavy penalty for horizontal misalignment.
              """
              lx = center_x(label)
              candidates = []

              for num in numbers:
                  value = num["value"]

                  if not (
                      minimum <= value <= maximum
                  ):
                      continue

                  nx = center_x(num)
                  dx = abs(nx - lx)

                  # Same card / column.
                  if dx > 125:
                      continue

                  if num["bottom"] <= label["top"]:
                      dy = label["top"] - num["bottom"]
                  elif num["top"] >= label["bottom"]:
                      dy = num["top"] - label["bottom"]
                  else:
                      dy = 0

                  if dy > 125:
                      continue

                  score = dy + dx * 0.55
                  candidates.append(
                      (score, value)
                  )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda item: item[0]
              )

              # If two differently-valued numbers are virtually equally close,
              # don't guess.
              if (
                  len(candidates) > 1
                  and candidates[1][0] - candidates[0][0] < 5
                  and candidates[1][1] != candidates[0][1]
              ):
                  return None

              return candidates[0][1]

          def find_label_lines(lines, regex):
              return [
                  line
                  for line in lines
                  if re.search(
                      regex,
                      line["text"],
                      re.I,
                  )
              ]

          def spatial_early_labels(words, lines):
              killed_labels = find_label_lines(
                  lines,
                  r"(?:people|Palestinians?)\s+"
                  r"killed\s+in\s+Gaza",
              )
              injured_labels = find_label_lines(
                  lines,
                  r"(?:people|Palestinians?)\s+"
                  r"injured\s+in\s+Gaza",
              )

              nums = numeric_words(words)
              pairs = []

              for kl in killed_labels:
                  killed = nearest_card_number(
                      kl,
                      nums,
                      100,
                      500000,
                  )
                  if killed is None:
                      continue

                  for il in injured_labels:
                      injured = nearest_card_number(
                          il,
                          nums,
                          100,
                          1000000,
                      )
                      if (
                          injured is not None
                          and valid(killed, injured)
                      ):
                          pairs.append(
                              (
                                  killed,
                                  injured,
                                  "spatial-early-gaza-labels",
                              )
                          )

              return pairs

          def spatial_overview_cards(words, lines):
              """
              Parse only the Gaza Strip section that is explicitly tied to
              'Source: Ministry of Health'.

              Handles:
              - value above label
              - value below label
              - value and label on same row
              - Fatalities/Injuries cards side-by-side
              - cards stacked vertically
              """
              gaza_lines = find_label_lines(
                  lines,
                  r"\bGaza\s+Strip\b",
              )

              source_lines = find_label_lines(
                  lines,
                  r"Source:?\s+Ministry\s+of\s+Health",
              )

              if not gaza_lines or not source_lines:
                  return []

              results = []

              for gaza in gaza_lines:
                  gx = center_x(gaza)

                  nearby_sources = []

                  for source in source_lines:
                      sx = center_x(source)
                      dy = abs(source["top"] - gaza["top"])
                      dx = abs(sx - gx)

                      # Be generous spatially but still require the source label
                      # to belong to the same broad Gaza panel.
                      if dy <= 520 and dx <= 360:
                          nearby_sources.append(
                              (dy + dx * 0.35, source)
                          )

                  if not nearby_sources:
                      continue

                  nearby_sources.sort(
                      key=lambda item: item[0]
                  )

                  for _, source in nearby_sources[:2]:
                      top_min = max(
                          0,
                          min(gaza["top"], source["top"]) - 80,
                      )
                      top_max = max(
                          gaza["bottom"], source["bottom"]
                      ) + 620

                      # Build a candidate section around the Gaza heading/source.
                      scoped_lines = [
                          line
                          for line in lines
                          if top_min <= line["top"] <= top_max
                      ]

                      # Stop at the next major territorial/health section.
                      stops = []

                      for line in scoped_lines:
                          if line["top"] <= max(
                              gaza["bottom"],
                              source["bottom"],
                          ) + 30:
                              continue

                          if re.search(
                              r"\b(?:West\s+Bank|Israel|Lebanon|"
                              r"Health\s+Facility|Health\s+Care|"
                              r"Health\s+Attacks|Hospitals?|PHCCs?|"
                              r"Medical\s+Evacuation|Nutrition|"
                              r"Communicable\s+Diseases)\b",
                              line["text"],
                              re.I,
                          ):
                              stops.append(line["top"])

                      if stops:
                          top_max = min(stops)
                          scoped_lines = [
                              line
                              for line in scoped_lines
                              if line["top"] < top_max
                          ]

                      fatalities = find_label_lines(
                          scoped_lines,
                          r"\b(?:Reported\s+)?Fatalit(?:y|ies)\b",
                      )
                      injuries = find_label_lines(
                          scoped_lines,
                          r"\b(?:Reported\s+)?Injur(?:y|ies)\b",
                      )

                      nums = [
                          num
                          for num in numeric_words(words)
                          if (
                              top_min - 60
                              <= num["top"]
                              <= top_max + 60
                          )
                      ]

                      if not fatalities or not injuries:
                          continue

                      for fl in fatalities:
                          killed = nearest_card_number(
                              fl,
                              nums,
                              100,
                              500000,
                          )

                          if killed is None:
                              # Same-line fallback for layouts where the
                              # number and label are rendered in one text row.
                              for m in re.finditer(
                                  rf"(?P<n>{NUM})\s+"
                                  rf"(?:Reported\s+)?Fatalit(?:y|ies)\b",
                                  fl["text"],
                                  re.I,
                              ):
                                  killed = n(m.group("n"))
                                  break

                          if killed is None:
                              continue

                          for il in injuries:
                              injured = nearest_card_number(
                                  il,
                                  nums,
                                  100,
                                  1000000,
                              )

                              if injured is None:
                                  for m in re.finditer(
                                      rf"(?P<n>{NUM})\s+"
                                      rf"(?:Reported\s+)?Injur(?:y|ies)\b",
                                      il["text"],
                                      re.I,
                                  ):
                                      injured = n(m.group("n"))
                                      break

                              if (
                                  injured is not None
                                  and valid(killed, injured)
                              ):
                                  results.append(
                                      (
                                          killed,
                                          injured,
                                          "spatial-gaza-overview",
                                      )
                                  )

              return results

          # -----------------------------------------------------------------
          # GENERIC SEMANTIC CASUALTY PARSER
          # -----------------------------------------------------------------

          KILLED_LABEL = re.compile(
              r"\b(?:killed|fatalit(?:y|ies)|deaths?)\b",
              re.I,
          )

          INJURED_LABEL = re.compile(
              r"\b(?:injured|injur(?:y|ies)|wounded)\b",
              re.I,
          )

          GAZA_CONTEXT = re.compile(
              r"\bGaza(?:\s+Strip)?\b",
              re.I,
          )

          MOH_CONTEXT = re.compile(
              r"\b(?:Ministry\s+of\s+Health|MoH)\b",
              re.I,
          )

          def line_distance(a, b):
              ax = center_x(a)
              bx = center_x(b)
              ay = (a["top"] + a["bottom"]) / 2
              by = (b["top"] + b["bottom"]) / 2
              return abs(ay - by) + abs(ax - bx) * 0.35

          def section_context(lines, label_line, radius=8):
              """
              Return nearby visual lines around a casualty label.
              This is used to decide whether the label belongs to Gaza/MoH.
              """
              try:
                  idx = lines.index(label_line)
              except ValueError:
                  return ""

              start = max(0, idx - radius)
              end = min(len(lines), idx + radius + 1)

              return " ".join(
                  line["text"]
                  for line in lines[start:end]
              )

          def semantic_number_for_label(
              label_line,
              numbers,
              minimum,
              maximum,
          ):
              """
              Find the number most plausibly attached to a casualty label.

              Supports:
              - number above label
              - number below label
              - number immediately left/right
              - number on the same visual line
              """
              candidates = []

              lx = center_x(label_line)
              ly = (
                  label_line["top"]
                  + label_line["bottom"]
              ) / 2

              for num in numbers:
                  value = num["value"]

                  if not (
                      minimum <= value <= maximum
                  ):
                      continue

                  nx = center_x(num)
                  ny = (
                      num["top"]
                      + num["bottom"]
                  ) / 2

                  dx = abs(nx - lx)
                  dy = abs(ny - ly)

                  # Casualty cards/rows are normally close in either
                  # horizontal or vertical direction.
                  if dx > 180 or dy > 140:
                      continue

                  # Strongly prefer same column or same row.
                  score = (
                      min(dy, 80)
                      + min(dx, 120) * 0.42
                  )

                  same_row = (
                      abs(
                          num["top"]
                          - label_line["top"]
                      ) <= 12
                  )

                  same_column = (
                      abs(nx - lx) <= 55
                  )

                  if same_row:
                      score -= 35

                  if same_column:
                      score -= 30

                  candidates.append(
                      (
                          score,
                          value,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda item: item[0]
              )

              # Two nearly equal candidates with different values means
              # the visual relation is ambiguous.
              if (
                  len(candidates) > 1
                  and candidates[1][0]
                  - candidates[0][0]
                  < 8
                  and candidates[1][1]
                  != candidates[0][1]
              ):
                  return None

              return candidates[0][1]

          def semantic_page_pairs(words, lines):
              """
              Generic casualty extraction based on label meaning rather than
              WHO template.

              A candidate must:
              - contain a killed/fatalities/deaths label
              - contain an injured/injuries/wounded label
              - be in Gaza context
              - preferably be near Ministry of Health attribution
              - produce a plausible cumulative pair
              """
              killed_lines = [
                  line
                  for line in lines
                  if KILLED_LABEL.search(
                      line["text"]
                  )
              ]

              injured_lines = [
                  line
                  for line in lines
                  if INJURED_LABEL.search(
                      line["text"]
                  )
              ]

              if (
                  not killed_lines
                  or not injured_lines
              ):
                  return []

              numbers = numeric_words(
                  words
              )

              candidates = []

              for killed_line in killed_lines:
                  killed_context = section_context(
                      lines,
                      killed_line,
                      radius=9,
                  )

                  # Must be clearly about Gaza.
                  if not GAZA_CONTEXT.search(
                      killed_context
                  ):
                      continue

                  killed = semantic_number_for_label(
                      killed_line,
                      numbers,
                      100,
                      500000,
                  )

                  if killed is None:
                      continue

                  for injured_line in injured_lines:
                      # Labels must belong to the same visual neighborhood.
                      if line_distance(
                          killed_line,
                          injured_line,
                      ) > 360:
                          continue

                      injured_context = section_context(
                          lines,
                          injured_line,
                          radius=9,
                      )

                      combined_context = (
                          killed_context
                          + " "
                          + injured_context
                      )

                      if not GAZA_CONTEXT.search(
                          combined_context
                      ):
                          continue

                      injured = semantic_number_for_label(
                          injured_line,
                          numbers,
                          100,
                          1000000,
                      )

                      if injured is None:
                          continue

                      if not valid(
                          killed,
                          injured,
                      ):
                          continue

                      # Confidence score: explicit MoH attribution is best,
                      # Gaza mention is required, close labels are preferred.
                      score = 0

                      if MOH_CONTEXT.search(
                          combined_context
                      ):
                          score += 100

                      score += 40

                      score -= min(
                          80,
                          line_distance(
                              killed_line,
                              injured_line,
                          ) / 5,
                      )

                      candidates.append({
                          "killed": killed,
                          "injured": injured,
                          "score": score,
                          "context": combined_context,
                      })

              if not candidates:
                  return []

              candidates.sort(
                  key=lambda row: row["score"],
                  reverse=True,
              )

              best = candidates[0]

              # If a competing different pair is nearly as strong, reject.
              for other in candidates[1:]:
                  if (
                      best["score"]
                      - other["score"]
                      < 12
                      and (
                          best["killed"],
                          best["injured"],
                      )
                      != (
                          other["killed"],
                          other["injured"],
                      )
                  ):
                      return []

              return [
                  (
                      best["killed"],
                      best["injured"],
                      "generic-semantic",
                  )
              ]

          # -----------------------------------------------------------------
          # MULTI-ENGINE PDF RECONSTRUCTION
          # -----------------------------------------------------------------

          def pymupdf_pages(pdf_bytes):
              """
              Second spatial extraction engine.

              PyMuPDF often reconstructs WHO card/table text differently from
              pdfplumber, which helps when one engine splits numbers or labels.
              """
              output = []

              doc = fitz.open(
                  stream=pdf_bytes,
                  filetype="pdf",
              )

              try:
                  for page_index in range(
                      len(doc)
                  ):
                      page = doc[
                          page_index
                      ]

                      raw_words = page.get_text(
                          "words"
                      )

                      words = []

                      for item in raw_words:
                          # x0, y0, x1, y1, text, block, line, word
                          if len(item) < 5:
                              continue

                          x0, y0, x1, y1, token = item[:5]

                          words.append({
                              "text": str(token),
                              "x0": float(x0),
                              "x1": float(x1),
                              "top": float(y0),
                              "bottom": float(y1),
                          })

                      output.append({
                          "page": page_index + 1,
                          "width": float(
                              page.rect.width
                          ),
                          "height": float(
                              page.rect.height
                          ),
                          "words": words,
                      })

              finally:
                  doc.close()

              return output

          def reconstruct_numeric_tokens(words):
              """
              Reconstruct numbers that PDF engines split into pieces, e.g.
              '31' ',' '272' or '31,' '272'.

              Existing complete numeric tokens are retained.
              """
              enriched = []

              for word in words:
                  copy = dict(word)
                  enriched.append(copy)

              # Work by visual line.
              rows = {}

              for word in words:
                  key = round(
                      float(
                          word.get(
                              "top",
                              0,
                          )
                      ) / 4
                  )

                  rows.setdefault(
                      key,
                      [],
                  ).append(word)

              reconstructed = []

              for row_words in rows.values():
                  ws = sorted(
                      row_words,
                      key=lambda w: float(
                          w.get(
                              "x0",
                              0,
                          )
                      ),
                  )

                  for start in range(
                      len(ws)
                  ):
                      combined = ""
                      x0 = float(
                          ws[start].get(
                              "x0",
                              0,
                          )
                      )
                      top = float(
                          ws[start].get(
                              "top",
                              0,
                          )
                      )
                      bottom = float(
                          ws[start].get(
                              "bottom",
                              0,
                          )
                      )
                      last_x1 = x0

                      for end in range(
                          start,
                          min(
                              len(ws),
                              start + 5,
                          ),
                      ):
                          w = ws[end]
                          token = str(
                              w.get(
                                  "text",
                                  "",
                              )
                          ).strip()

                          # Only numeric punctuation pieces can participate.
                          if not re.fullmatch(
                              r"[\d,\s]+",
                              token,
                          ):
                              break

                          wx0 = float(
                              w.get(
                                  "x0",
                                  0,
                              )
                          )

                          if (
                              end > start
                              and wx0
                              - last_x1
                              > 12
                          ):
                              break

                          combined += token

                          x1 = float(
                              w.get(
                                  "x1",
                                  wx0,
                              )
                          )

                          bottom = max(
                              bottom,
                              float(
                                  w.get(
                                      "bottom",
                                      bottom,
                                  )
                              ),
                          )

                          last_x1 = x1

                          normalized = re.sub(
                              r"[\s,]",
                              "",
                              combined,
                          )

                          if re.fullmatch(
                              r"\d{3,6}",
                              normalized,
                          ):
                              reconstructed.append({
                                  "text": combined,
                                  "x0": x0,
                                  "x1": x1,
                                  "top": top,
                                  "bottom": bottom,
                              })

              # Add reconstructed tokens and dedupe by geometry/text.
              seen = set()

              for word in enriched + reconstructed:
                  key = (
                      str(
                          word.get(
                              "text",
                              "",
                          )
                      ),
                      round(
                          float(
                              word.get(
                                  "x0",
                                  0,
                              )
                          ),
                          1,
                      ),
                      round(
                          float(
                              word.get(
                                  "top",
                                  0,
                              )
                          ),
                          1,
                      ),
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  yield word

          def reconstruct_label_lines(lines):
              """
              Merge adjacent visual lines so labels broken across rows such as

                  Number of people
                  killed in Gaza

              can be recognized semantically.
              """
              output = list(lines)

              for i in range(
                  len(lines)
              ):
                  for width in (
                      2,
                      3,
                  ):
                      if (
                          i + width
                          > len(lines)
                      ):
                          continue

                      group = lines[
                          i:i + width
                      ]

                      # Require vertical adjacency.
                      okay = True

                      for a, b in zip(
                          group,
                          group[1:],
                      ):
                          if (
                              b["top"]
                              - a["bottom"]
                              > 26
                          ):
                              okay = False
                              break

                      if not okay:
                          continue

                      output.append({
                          "text": clean(
                              " ".join(
                                  row["text"]
                                  for row in group
                              )
                          ),
                          "top": min(
                              row["top"]
                              for row in group
                          ),
                          "bottom": max(
                              row["bottom"]
                              for row in group
                          ),
                          "x0": min(
                              row["x0"]
                              for row in group
                          ),
                          "x1": max(
                              row["x1"]
                              for row in group
                          ),
                          "words": [
                              word
                              for row in group
                              for word in row["words"]
                          ],
                      })

              return output

          def prepare_engine_page(
              page_info,
              engine,
          ):
              words = list(
                  reconstruct_numeric_tokens(
                      page_info[
                          "words"
                      ]
                  )
              )

              lines = line_groups(
                  words
              )

              lines = reconstruct_label_lines(
                  lines
              )

              return {
                  "engine": engine,
                  "page": page_info["page"],
                  "width": page_info.get(
                      "width",
                      0,
                  ),
                  "height": page_info.get(
                      "height",
                      0,
                  ),
                  "words": words,
                  "lines": lines,
              }

          def all_engine_pages(
              pdf_bytes
          ):
              """
              Return each PDF page from both spatial engines.
              """
              output = []

              for info in spatial_pages(
                  pdf_bytes
              ):
                  output.append(
                      prepare_engine_page(
                          info,
                          "pdfplumber",
                      )
                  )

              try:
                  for info in pymupdf_pages(
                      pdf_bytes
                  ):
                      output.append(
                          prepare_engine_page(
                              info,
                              "pymupdf",
                          )
                      )
              except Exception as error:
                  print(
                      "PyMuPDF extraction failed:",
                      error,
                  )

              return output

          # -----------------------------------------------------------------
          # WHOLE GAZA-SECTION PARSER
          # -----------------------------------------------------------------

          SECTION_STOP = re.compile(
              r"\b(?:West\s+Bank|Israel|Lebanon|"
              r"Health\s+Facility|Health\s+Care\s+Function|"
              r"Health\s+Attacks|Hospitals?|PHCCs?|"
              r"Medical\s+Evacuation|Nutrition|"
              r"Communicable\s+Diseases|"
              r"Operational\s+Response|Key\s+Challenges)\b",
              re.I,
          )

          def gaza_section_lines(lines):
              """
              Isolate the visual Gaza section on a page.

              Start at a 'Gaza' / 'Gaza Strip' heading and continue until the
              next major territorial or thematic section. This lets labels and
              values be separated by multiple lines without leaking in numbers
              from West Bank or unrelated health-system sections.
              """
              starts = []

              for idx, line in enumerate(lines):
                  if re.search(
                      r"\bGaza(?:\s+Strip)?\b",
                      line["text"],
                      re.I,
                  ):
                      starts.append(idx)

              sections = []

              for start in starts:
                  end = min(
                      len(lines),
                      start + 45,
                  )

                  for idx in range(
                      start + 1,
                      min(len(lines), start + 45),
                  ):
                      text = lines[idx]["text"]

                      if SECTION_STOP.search(text):
                          end = idx
                          break

                  chunk = lines[start:end]

                  joined = " ".join(
                      line["text"]
                      for line in chunk
                  )

                  # Must contain both casualty concepts somewhere in the
                  # section. MoH attribution is preferred but not mandatory
                  # because some WHO templates put the source label above or
                  # below the card.
                  if not KILLED_LABEL.search(joined):
                      continue

                  if not INJURED_LABEL.search(joined):
                      continue

                  sections.append(chunk)

              return sections

          def numbers_in_section(section):
              """
              Return plausible casualty-scale numbers inside a Gaza section.
              Reconstructed numeric tokens are already present in line words.
              """
              output = []
              seen = set()

              for line in section:
                  for word in line["words"]:
                      value = word_number(
                          str(
                              word.get(
                                  "text",
                                  "",
                              )
                          )
                      )

                      if value is None:
                          # Reconstructed values may retain commas/spaces.
                          raw = re.sub(
                              r"[\s,]",
                              "",
                              str(
                                  word.get(
                                      "text",
                                      "",
                                  )
                              ),
                          )

                          if re.fullmatch(
                              r"\d{3,6}",
                              raw,
                          ):
                              value = int(
                                  raw
                              )

                      if value is None:
                          continue

                      if not (
                          100
                          <= value
                          <= 1000000
                      ):
                          continue

                      key = (
                          value,
                          round(
                              float(
                                  word.get(
                                      "x0",
                                      0,
                                  )
                              ),
                              1,
                          ),
                          round(
                              float(
                                  word.get(
                                      "top",
                                      0,
                                  )
                              ),
                              1,
                          ),
                      )

                      if key in seen:
                          continue

                      seen.add(key)

                      output.append({
                          "value": value,
                          "line": line,
                          "word": word,
                      })

              return output

          def label_lines_in_section(
              section,
              label_regex,
          ):
              return [
                  line
                  for line in section
                  if label_regex.search(
                      line["text"]
                  )
              ]

          def section_candidate_values(
              section,
              label_regex,
              minimum,
              maximum,
          ):
              """
              Associate casualty labels with numbers anywhere in the same Gaza
              section.

              Ranking favors:
              1) same line
              2) adjacent lines
              3) same visual column
              4) shortest line-distance

              This is deliberately broader than the old nearest-card parser.
              """
              labels = label_lines_in_section(
                  section,
                  label_regex,
              )

              nums = numbers_in_section(
                  section
              )

              candidates = []

              for label in labels:
                  try:
                      label_index = section.index(label)
                  except ValueError:
                      continue

                  lx = center_x(label)

                  for item in nums:
                      value = item["value"]

                      if not (
                          minimum
                          <= value
                          <= maximum
                      ):
                          continue

                      num_line = item["line"]

                      try:
                          num_index = section.index(
                              num_line
                          )
                      except ValueError:
                          continue

                      line_gap = abs(
                          num_index
                          - label_index
                      )

                      if line_gap > 12:
                          continue

                      word = item["word"]
                      nx = (
                          float(word.get("x0", 0))
                          + float(word.get("x1", 0))
                      ) / 2

                      dx = abs(nx - lx)

                      score = (
                          line_gap * 24
                          + min(dx, 300) * 0.18
                      )

                      if line_gap == 0:
                          score -= 45

                      if line_gap == 1:
                          score -= 20

                      if dx <= 60:
                          score -= 25

                      candidates.append({
                          "score": score,
                          "value": value,
                          "label": label["text"],
                          "line_gap": line_gap,
                      })

              candidates.sort(
                  key=lambda row: row["score"]
              )

              # Deduplicate same numeric value, keeping best score.
              best_by_value = {}

              for row in candidates:
                  value = row["value"]

                  if (
                      value not in best_by_value
                      or row["score"]
                      < best_by_value[value]["score"]
                  ):
                      best_by_value[value] = row

              return sorted(
                  best_by_value.values(),
                  key=lambda row: row["score"],
              )

          def semantic_gaza_section_pairs(
              words,
              lines,
          ):
              """
              Parse killed/injured totals anywhere within a coherent Gaza
              section. This is the main parser for templates where labels and
              numbers are visually separated.
              """
              pairs = []

              for section in gaza_section_lines(
                  lines
              ):
                  joined = " ".join(
                      line["text"]
                      for line in section
                  )

                  killed_values = section_candidate_values(
                      section,
                      KILLED_LABEL,
                      100,
                      500000,
                  )

                  injured_values = section_candidate_values(
                      section,
                      INJURED_LABEL,
                      100,
                      1000000,
                  )

                  if (
                      not killed_values
                      or not injured_values
                  ):
                      continue

                  candidate_pairs = []

                  for k in killed_values[:6]:
                      for i in injured_values[:6]:
                          killed = k["value"]
                          injured = i["value"]

                          if not valid(
                              killed,
                              injured,
                          ):
                              continue

                          score = (
                              k["score"]
                              + i["score"]
                          )

                          # MoH attribution is an important positive signal.
                          if MOH_CONTEXT.search(
                              joined
                          ):
                              score -= 70

                          # Explicit Gaza-wide language strengthens the pair.
                          if re.search(
                              r"\b(?:Gaza\s+Strip|in\s+Gaza)\b",
                              joined,
                              re.I,
                          ):
                              score -= 30

                          # Prefer pairs where both labels are within the same
                          # broad visual area rather than far apart.
                          score += abs(
                              k["line_gap"]
                              - i["line_gap"]
                          ) * 3

                          candidate_pairs.append(
                              (
                                  score,
                                  killed,
                                  injured,
                              )
                          )

                  if not candidate_pairs:
                      continue

                  candidate_pairs.sort(
                      key=lambda item: item[0]
                  )

                  best = candidate_pairs[0]

                  # Reject only when a different pair is essentially tied.
                  if (
                      len(candidate_pairs) > 1
                      and candidate_pairs[1][0]
                      - best[0]
                      < 10
                      and (
                          candidate_pairs[1][1],
                          candidate_pairs[1][2],
                      )
                      != (
                          best[1],
                          best[2],
                      )
                  ):
                      continue

                  pairs.append(
                      (
                          best[1],
                          best[2],
                          "generic-gaza-section",
                      )
                  )

              return pairs

          def spatial_parse(pdf_bytes):
              """
              Multi-engine semantic parser.

              pdfplumber and PyMuPDF independently reconstruct each page.
              The whole Gaza section parser is primary. Local semantic and
              exact-card parsers are fallbacks.

              If both engines agree on a pair, confidence is highest.
              A pair found by one engine may still be accepted if no competing
              plausible pair exists.
              """
              pair_support = {}

              for page_info in all_engine_pages(
                  pdf_bytes
              ):
                  words = page_info[
                      "words"
                  ]
                  lines = page_info[
                      "lines"
                  ]

                  if not words:
                      continue

                  candidates = []

                  candidates.extend(
                      semantic_gaza_section_pairs(
                          words,
                          lines,
                      )
                  )

                  if not candidates:
                      candidates.extend(
                          semantic_page_pairs(
                              words,
                              lines,
                          )
                      )

                  if not candidates:
                      candidates.extend(
                          spatial_early_labels(
                              words,
                              lines,
                          )
                      )
                      candidates.extend(
                          spatial_overview_cards(
                              words,
                              lines,
                          )
                      )

                  for killed, injured, method in candidates:
                      key = (
                          killed,
                          injured,
                      )

                      pair_support.setdefault(
                          key,
                          {
                              "methods": set(),
                              "engines": set(),
                              "pages": set(),
                          },
                      )

                      pair_support[
                          key
                      ]["methods"].add(
                          method
                      )
                      pair_support[
                          key
                      ]["engines"].add(
                          page_info[
                              "engine"
                          ]
                      )
                      pair_support[
                          key
                      ]["pages"].add(
                          page_info[
                              "page"
                          ]
                      )

              if not pair_support:
                  return {}

              ranked = []

              for pair, info in pair_support.items():
                  score = 0

                  # Independent engine agreement is the strongest signal.
                  score += (
                      len(
                          info[
                              "engines"
                          ]
                      )
                      * 100
                  )

                  score += (
                      len(
                          info[
                              "methods"
                          ]
                      )
                      * 20
                  )

                  score += min(
                      20,
                      len(
                          info[
                              "pages"
                          ]
                      )
                      * 5,
                  )

                  ranked.append(
                      (
                          score,
                          pair,
                          info,
                      )
                  )

              ranked.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              best_score, best_pair, best_info = ranked[0]

              # A differently-valued pair with nearly equal evidence is
              # ambiguous and must not be accepted.
              if len(ranked) > 1:
                  second_score, second_pair, _ = ranked[1]

                  if (
                      second_pair
                      != best_pair
                      and best_score
                      - second_score
                      < 35
                  ):
                      return {}

              killed, injured = best_pair

              methods = set()

              for method in best_info[
                  "methods"
              ]:
                  methods.add(
                      "multi-engine:"
                      + method
                  )

              for engine in best_info[
                  "engines"
              ]:
                  methods.add(
                      "engine:"
                      + engine
                  )

              return {
                  (
                      killed,
                      injured,
                  ): methods
              }


          def parse_issue(meta):
              try:
                  if meta["issue"] in DIRECT_ISSUE_URLS:
                      direct = DIRECT_ISSUE_URLS[
                          meta["issue"]
                      ]
                      response = get(
                          direct,
                          timeout=120,
                      )

                      if not response.content.startswith(b"%PDF"):
                          raise RuntimeError(
                              "direct WHO override is not a PDF"
                          )

                      actual_issue = pdf_first_page_issue(
                          response.content
                      )

                      if actual_issue != meta["issue"]:
                          raise RuntimeError(
                              f"direct override printed issue "
                              f"{actual_issue}, expected "
                              f"{meta['issue']}"
                          )

                      pdf_url = response.url
                      pdf_bytes = response.content

                  else:
                      pdf_url, pdf_bytes = resolve_pdf(
                          meta["url"],
                          meta["issue"],
                      )

              except Exception as error:
                  print(
                      f"ISSUE {meta['issue']} PDF FAILED:",
                      error,
                  )
                  return None

              texts = report_text_views(
                  pdf_bytes
              )

              if not texts:
                  print(
                      "ISSUE",
                      meta["issue"],
                      "has no usable first-page text",
                  )
                  return None

              usable_texts = []

              for mode, content in texts:
                  issue_match = PDF_ISSUE.search(
                      content[:2500]
                  )

                  if issue_match:
                      parsed_issue = int(
                          issue_match.group(1)
                      )

                      if parsed_issue != meta["issue"]:
                          print(
                              "ISSUE NUMBER MISMATCH:",
                              meta["issue"],
                              "archive vs",
                              parsed_issue,
                              f"PDF ({mode})",
                          )
                          continue

                  usable_texts.append(
                      (mode, content)
                  )

              # Primary method: use the actual visual coordinates from the
              # PDF so card values stay attached to their labels.
              all_pairs = spatial_parse(
                  pdf_bytes
              )

              # Strict text-layout parser is fallback only.
              text_pairs = parse_known_layouts(
                  usable_texts
              )

              if not all_pairs:
                  all_pairs = text_pairs
              else:
                  # Agreement from text extraction strengthens the same pair.
                  for pair, methods in text_pairs.items():
                      if pair in all_pairs:
                          all_pairs[pair].update(
                              methods
                          )

              if not all_pairs:
                  print(
                      "NO CASUALTY PAIR: issue",
                      meta["issue"],
                      meta["date"],
                  )
                  return None

              # The same true pair appearing through multiple layouts/methods
              # is strong agreement. Different pairs are rejected.
              if len(all_pairs) > 1:
                  print(
                      "AMBIGUOUS ISSUE",
                      meta["issue"],
                      list(all_pairs),
                  )
                  return None

              (killed, injured), methods = next(
                  iter(all_pairs.items())
              )

              return {
                  "date": meta["date"],
                  "killed": killed,
                  "injured": injured,
                  "source_url": pdf_url,
                  "series_label": (
                      "WHO Emergency Situation Report "
                      f"#{meta['issue']}"
                  ),
                  "source_type": "WHO EMRO",
                  "issue": meta["issue"],
                  "parse_method": "+".join(
                      sorted(methods)
                  ),
                  "parser_version": VERSION,
              }

          def validate(rows):
              """
              Validate WHO cumulative series without modifying any source value.

              Chronology is rejection-only:
              - totals must not decrease
              - extreme jumps are rejected
              - no interpolation or correction is ever performed
              """
              rows.sort(
                  key=lambda row: (
                      row["date"],
                      int(
                          row.get(
                              "issue",
                              9999,
                          )
                      ),
                  )
              )

              final = []

              for row in rows:
                  if final:
                      previous = final[-1]

                      if (
                          row["killed"]
                          < previous["killed"]
                          or row["injured"]
                          < previous["injured"]
                      ):
                          print(
                              "DECREASING TOTAL OMITTED:",
                              row.get("issue"),
                              row["killed"],
                              row["injured"],
                          )
                          continue

                      try:
                          d1 = datetime.fromisoformat(
                              previous["date"]
                          ).date()
                          d2 = datetime.fromisoformat(
                              row["date"]
                          ).date()
                          delta_days = max(
                              1,
                              (d2 - d1).days,
                          )
                      except Exception:
                          delta_days = 1

                      killed_rate = (
                          row["killed"]
                          - previous["killed"]
                      ) / delta_days

                      injured_rate = (
                          row["injured"]
                          - previous["injured"]
                      ) / delta_days

                      # Deliberately generous parser-error guard.
                      if (
                          killed_rate > 5000
                          or injured_rate > 15000
                      ):
                          print(
                              "IMPLAUSIBLE JUMP OMITTED:",
                              row.get("issue"),
                              row["killed"],
                              row["injured"],
                          )
                          continue

                  final.append(
                      row
                  )

              return final

          def load_existing_good():
              """
              Preserve previously published WHO-only issue records. This lets
              the parser add coverage without deleting a record just because
              a later run encounters a temporary PDF/layout problem.
              """
              if not OUT.exists():
                  return {}

              try:
                  payload = json.loads(
                      OUT.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return {}

              good = {}

              for row in payload.get("records", []):
                  source_type = str(
                      row.get("source_type", "")
                  ).lower()
                  label = str(
                      row.get("series_label", "")
                  ).lower()

                  if (
                      "who" not in source_type
                      and "who" not in label
                  ):
                      continue

                  issue = row.get("issue")

                  if issue is None:
                      m = re.search(
                          r"#(\d+)",
                          str(row.get("series_label", "")),
                      )
                      issue = (
                          int(m.group(1))
                          if m else None
                      )

                  if issue is None:
                      continue

                  try:
                      killed = int(row["killed"])
                      injured = int(row["injured"])
                  except Exception:
                      continue

                  if valid(killed, injured):
                      good[int(issue)] = row

              return good

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              metas = discover()
              rows = []

              for index, meta in enumerate(
                  metas,
                  start=1,
              ):
                  print(
                      f"Parsing WHO issue {meta['issue']} "
                      f"({index}/{len(metas)})"
                  )

                  row = parse_issue(meta)

                  if row:
                      print(
                          "FOUND",
                          row["issue"],
                          row["date"],
                          row["killed"],
                          row["injured"],
                          row["parse_method"],
                      )
                      rows.append(row)

              rows = validate(rows)

              parsed_by_issue = {
                  int(row["issue"]): row
                  for row in rows
              }

              existing_good = load_existing_good()
              archive_issues = {
                  int(meta["issue"])
                  for meta in metas
              }
              restored = 0

              for issue, old_row in existing_good.items():
                  if (
                      issue in archive_issues
                      and issue not in parsed_by_issue
                  ):
                      parsed_by_issue[issue] = old_row
                      restored += 1

              rows = list(parsed_by_issue.values())
              rows.sort(
                  key=lambda row: int(
                      row.get("issue", 9999)
                  )
              )
              rows = validate(rows)

              print(
                  "WHO parsing summary:",
                  len(rows),
                  "accepted records from",
                  len(metas),
                  "archive issues;",
                  restored,
                  "previously verified WHO records preserved",
              )

              missing = sorted(
                  set(int(meta["issue"]) for meta in metas)
                  - set(int(row["issue"]) for row in rows)
              )

              print(
                  "Missing/unparsed WHO issues:",
                  ", ".join(map(str, missing))
                  if missing else "none",
              )

              # Safety gate: never overwrite the timeline with a sparse parse.
              if len(rows) < 35:
                  raise RuntimeError(
                      "Only "
                      + str(len(rows))
                      + " WHO issues parsed successfully. "
                      + "Refusing to publish. Missing/unparsed issues: "
                      + ", ".join(map(str, missing))
                  )

              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "source_type": row["source_type"],
                      "issue": row["issue"],
                      "parser_version": VERSION,
                  }
                  for row in rows
              ]

              payload = {
                  "source": (
                      "WHO Eastern Mediterranean Regional Office "
                      "Gaza emergency situation reports"
                  ),
                  "underlying_source": (
                      "Gaza Ministry of Health, as labelled by WHO"
                  ),
                  "method": (
                      "Issue number and date come from WHO's official "
                      "Emergency Situation Reports archive. Every PDF is parsed "
                      "independently with pdfplumber and PyMuPDF, plus strict "
                      "pdftotext fallback. Broken numeric tokens and multi-line "
                      "casualty labels are reconstructed before the full Gaza "
                      "section is isolated. Killed/fatalities/deaths and "
                      "injured/injuries/wounded are then paired within that Gaza "
                      "section. Independent engine agreement increases confidence; "
                      "competing plausible pairs are rejected. Chronology is used "
                      "only to reject decreases or obviously impossible parser "
                      "jumps and never to invent or alter values. Previously "
                      "verified WHO-only records are preserved. No OCR, "
                      "interpolation, OCHA fallback, or inferred totals."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "WHO casualty points from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_who.py

