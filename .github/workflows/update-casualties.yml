name: Update Gaza casualty timeline from WHO

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4

      - name: Build WHO casualty timeline
        shell: bash
        run: |
          cat > /tmp/update_who.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urljoin
          import json
          import re
          import subprocess
          import tempfile

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          VERSION = 10

          ARCHIVES = [
              "https://www.emro.who.int/opt/information-resources/emergency-situation-reports.html",
              "https://www.emro.who.int/fr/opt/information-resources/emergency-situation-reports.html",
              "https://www.emro.who.int/opt/information-resources/",
              "https://www.emro.who.int/fr/opt/information-resources/",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-WHO-CasualtyTimeline/10.0",
              "Accept-Language": "en",
          })

          ISSUE_LABEL = re.compile(
              r"\bIssue\s+(\d+)\s*,?\s*"
              r"(\d{1,2}\s+"
              r"(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|"
              r"May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|"
              r"Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
              r"\s+20\d{2})",
              re.I,
          )

          PDF_ISSUE = re.compile(
              r"\bIssue\s*#?\s*(\d+)\b",
              re.I,
          )

          NUM = r"\d{1,3}(?:[,\s]\d{3})+|\d{3,6}"

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def n(raw):
              return int(re.sub(r"[\s,]", "", raw))

          def get(url, timeout=90):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r

          def parse_label_date(raw):
              raw = clean(raw)
              for fmt in (
                  "%d %B %Y",
                  "%d %b %Y",
              ):
                  try:
                      return datetime.strptime(
                          raw,
                          fmt,
                      ).date().isoformat()
                  except Exception:
                      pass
              return None

          def discover():
              """
              The WHO archive is our source of truth for:
              - issue number
              - issue/report date
              - PDF URL

              We do NOT infer those values from arbitrary PDF body text.
              """
              issues = {}

              for archive in ARCHIVES:
                  try:
                      soup = BeautifulSoup(
                          get(archive).text,
                          "html.parser",
                      )
                  except Exception as error:
                      print("ARCHIVE FAILED", archive, error)
                      continue

                  links = soup.find_all("a", href=True)

                  for a in links:
                      label = clean(
                          a.get_text(" ", strip=True)
                      )
                      match = ISSUE_LABEL.search(label)

                      if not match:
                          continue

                      issue = int(match.group(1))
                      report_date = parse_label_date(
                          match.group(2)
                      )

                      if not report_date:
                          continue

                      href = urljoin(
                          archive,
                          a["href"],
                      )

                      # Some archive links redirect to a PDF rather than
                      # ending with .pdf, so do not require a .pdf suffix.
                      current = issues.get(issue)

                      candidate = {
                          "issue": issue,
                          "date": report_date,
                          "url": href,
                          "archive_label": label,
                      }

                      # Prefer links that visibly point to PDFs.
                      if current is None:
                          issues[issue] = candidate
                      elif (
                          ".pdf" in href.lower()
                          and ".pdf" not in current["url"].lower()
                      ):
                          issues[issue] = candidate

              if not issues:
                  raise RuntimeError(
                      "No WHO Gaza emergency situation-report "
                      "issues were discovered."
                  )

              output = [
                  issues[key]
                  for key in sorted(issues)
              ]

              print(
                  "WHO archive discovered",
                  len(output),
                  "issues:",
                  output[0]["issue"],
                  "through",
                  output[-1]["issue"],
              )

              return output

          def resolve_pdf(url):
              r = get(url, timeout=90)

              ctype = (
                  r.headers.get(
                      "content-type",
                      "",
                  ).lower()
              )

              if (
                  r.content.startswith(b"%PDF")
                  or "application/pdf" in ctype
              ):
                  return r.url, r.content

              # If WHO linked to an intermediate page, locate the PDF there.
              soup = BeautifulSoup(
                  r.text,
                  "html.parser",
              )

              pdfs = []

              for a in soup.find_all("a", href=True):
                  href = urljoin(r.url, a["href"])

                  if ".pdf" in href.lower():
                      label = clean(
                          a.get_text(" ", strip=True)
                      ).lower()

                      score = (
                          ("download" in label) * 2
                          + ("report" in label) * 2
                          + ("sitrep" in href.lower()) * 3
                          + ("palestine" in href.lower()) * 2
                      )

                      pdfs.append(
                          (score, href)
                      )

              if not pdfs:
                  raise RuntimeError(
                      "WHO archive link did not resolve to a PDF: "
                      + url
                  )

              pdfs.sort(reverse=True)

              for _, href in pdfs[:5]:
                  candidate = get(
                      href,
                      timeout=120,
                  )

                  if candidate.content.startswith(b"%PDF"):
                      return candidate.url, candidate.content

              raise RuntimeError(
                  "No valid PDF found from WHO page: "
                  + url
              )

          def first_page_text(pdf_bytes):
              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "report.pdf"
                  txt = Path(folder) / "page1.txt"

                  pdf.write_bytes(pdf_bytes)

                  result = subprocess.run(
                      [
                          "pdftotext",
                          "-f", "1",
                          "-l", "1",
                          "-layout",
                          str(pdf),
                          str(txt),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if (
                      result.returncode != 0
                      or not txt.exists()
                  ):
                      return ""

                  return txt.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

          def valid(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def pairs_from_early_gaza_labels(text):
              """
              Issues 1-10 style, e.g.
              413 Estimated number of Palestinians killed in Gaza
              2300 Estimated number of Palestinians injured in Gaza

              Whitespace is normalized so column wrapping in pdftotext
              doesn't matter.
              """
              flat = clean(text)

              killed_patterns = [
                  re.compile(
                      rf"(?P<n>{NUM})\s+"
                      rf"(?:Estimated\s+number\s+of\s+)?"
                      rf"(?:people|Palestinians?)\s+"
                      rf"killed\s+in\s+Gaza",
                      re.I,
                  ),
                  re.compile(
                      rf"(?P<n>{NUM})\s+"
                      rf"(?:Estimated\s+number\s+of\s+)?"
                      rf"Palestinians?\s+killed\s+in\s+Gaza",
                      re.I,
                  ),
              ]

              injury_patterns = [
                  re.compile(
                      rf"(?P<n>{NUM})\s+"
                      rf"(?:Estimated\s+number\s+of\s+)?"
                      rf"(?:people|Palestinians?)\s+"
                      rf"injured\s+in\s+Gaza",
                      re.I,
                  ),
                  re.compile(
                      rf"(?P<n>{NUM})\s+"
                      rf"(?:Estimated\s+number\s+of\s+)?"
                      rf"Palestinians?\s+injured\s+in\s+Gaza",
                      re.I,
                  ),
              ]

              killed = set()
              injured = set()

              for pattern in killed_patterns:
                  for m in pattern.finditer(flat):
                      killed.add(
                          n(m.group("n"))
                      )

              for pattern in injury_patterns:
                  for m in pattern.finditer(flat):
                      injured.add(
                          n(m.group("n"))
                      )

              return [
                  (k, i, "explicit-gaza-labels")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def pairs_from_overview(text):
              """
              Later WHO format:

              Gaza Strip
              Overview
              Source: Ministry of Health.
              41,272 Fatalities
              95,551 Injuries

              Only inspect the first-page Gaza overview BEFORE
              'Health Facility' / 'Health Care' so health-attack casualty
              counts cannot be selected accidentally.
              """
              flat = clean(text)
              low = flat.lower()

              gaza_pos = low.find("gaza strip")
              if gaza_pos < 0:
                  return []

              source_pos = low.find(
                  "source: ministry of health",
                  gaza_pos,
              )

              if source_pos < 0:
                  source_pos = low.find(
                      "source: ministry of health.",
                      gaza_pos,
                  )

              if source_pos < 0:
                  return []

              end_positions = []

              for marker in (
                  "health facility",
                  "health care functioning",
                  "healthcare functioning",
                  "health attacks",
                  "hospitals functionality",
                  "phccs functionality",
              ):
                  pos = low.find(
                      marker,
                      source_pos + 20,
                  )
                  if pos > source_pos:
                      end_positions.append(pos)

              end = (
                  min(end_positions)
                  if end_positions
                  else min(
                      len(flat),
                      source_pos + 2200,
                  )
              )

              overview = flat[
                  gaza_pos:end
              ]

              killed = set()
              injured = set()

              for m in re.finditer(
                  rf"(?P<n>{NUM})\s+"
                  rf"(?:Reported\s+)?Fatalit(?:y|ies)\b",
                  overview,
                  re.I,
              ):
                  killed.add(
                      n(m.group("n"))
                  )

              for m in re.finditer(
                  rf"(?P<n>{NUM})\s+"
                  rf"(?:Reported\s+)?Injur(?:y|ies)\b",
                  overview,
                  re.I,
              ):
                  injured.add(
                      n(m.group("n"))
                  )

              # Some layouts put labels before values after text extraction.
              if not killed:
                  for m in re.finditer(
                      rf"\bFatalit(?:y|ies)\b"
                      rf"[^\d]{{0,40}}(?P<n>{NUM})",
                      overview,
                      re.I,
                  ):
                      killed.add(
                          n(m.group("n"))
                      )

              if not injured:
                  for m in re.finditer(
                      rf"\bInjur(?:y|ies)\b"
                      rf"[^\d]{{0,40}}(?P<n>{NUM})",
                      overview,
                      re.I,
                  ):
                      injured.add(
                          n(m.group("n"))
                      )

              return [
                  (k, i, "gaza-overview-moh")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def pairs_from_cumulative_sentence(text):
              """
              Backup for recent issues if WHO changes the cards but writes an
              explicit cumulative Gaza sentence on page 1.
              """
              flat = clean(text)
              patterns = [
                  re.compile(
                      rf"(?:cumulative\s+toll|cumulatively)"
                      rf".{{0,140}}?(?:since\s+October\s+2023|"
                      rf"since\s+7\s+October\s+2023)"
                      rf".{{0,160}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities|people\s+(?:have\s+been\s+)?killed)"
                      rf".{{0,180}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|people\s+injured|injured)",
                      re.I | re.S,
                  ),
              ]

              output = []

              for pattern in patterns:
                  for m in pattern.finditer(flat):
                      killed = n(m.group("k"))
                      injured = n(m.group("i"))

                      if valid(killed, injured):
                          output.append(
                              (
                                  killed,
                                  injured,
                                  "explicit-cumulative-sentence",
                              )
                          )

              return output

          def parse_issue(meta):
              try:
                  pdf_url, pdf_bytes = resolve_pdf(
                      meta["url"]
                  )
              except Exception as error:
                  print(
                      f"ISSUE {meta['issue']} PDF FAILED:",
                      error,
                  )
                  return None

              text = first_page_text(
                  pdf_bytes
              )

              if len(text.strip()) < 100:
                  print(
                      "ISSUE",
                      meta["issue"],
                      "has no usable first-page text",
                  )
                  return None

              issue_match = PDF_ISSUE.search(
                  text[:1800]
              )

              if issue_match:
                  parsed_issue = int(
                      issue_match.group(1)
                  )

                  if parsed_issue != meta["issue"]:
                      print(
                          "ISSUE NUMBER MISMATCH:",
                          meta["issue"],
                          "archive vs",
                          parsed_issue,
                          "PDF",
                      )
                      return None

              candidates = []
              candidates.extend(
                  pairs_from_early_gaza_labels(text)
              )
              candidates.extend(
                  pairs_from_overview(text)
              )
              candidates.extend(
                  pairs_from_cumulative_sentence(text)
              )

              by_pair = {}

              for killed, injured, method in candidates:
                  by_pair.setdefault(
                      (killed, injured),
                      set(),
                  ).add(method)

              if not by_pair:
                  print(
                      "NO CASUALTY PAIR: issue",
                      meta["issue"],
                      meta["date"],
                  )
                  return None

              if len(by_pair) > 1:
                  print(
                      "AMBIGUOUS ISSUE",
                      meta["issue"],
                      list(by_pair),
                  )
                  return None

              (killed, injured), methods = next(
                  iter(by_pair.items())
              )

              return {
                  "date": meta["date"],
                  "killed": killed,
                  "injured": injured,
                  "source_url": pdf_url,
                  "series_label": (
                      "WHO Emergency Situation Report "
                      f"#{meta['issue']}"
                  ),
                  "source_type": "WHO EMRO",
                  "issue": meta["issue"],
                  "parse_method": "+".join(
                      sorted(methods)
                  ),
                  "parser_version": VERSION,
              }

          def validate(rows):
              rows.sort(
                  key=lambda row: row["issue"]
              )

              final = []

              for row in rows:
                  if final:
                      previous = final[-1]

                      # WHO/MoH cumulative figures should not go backwards.
                      # Never correct a source value automatically.
                      if (
                          row["killed"]
                          < previous["killed"]
                          or row["injured"]
                          < previous["injured"]
                      ):
                          print(
                              "DECREASING TOTAL OMITTED:",
                              row["issue"],
                              row["killed"],
                              row["injured"],
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              metas = discover()
              rows = []

              for index, meta in enumerate(
                  metas,
                  start=1,
              ):
                  print(
                      f"Parsing WHO issue {meta['issue']} "
                      f"({index}/{len(metas)})"
                  )

                  row = parse_issue(meta)

                  if row:
                      print(
                          "FOUND",
                          row["issue"],
                          row["date"],
                          row["killed"],
                          row["injured"],
                          row["parse_method"],
                      )
                      rows.append(row)

              rows = validate(rows)

              # Safety gate. WHO currently has far more than 19 Gaza issues.
              # If parsing suddenly collapses, do NOT overwrite good data.
              if len(rows) < 40:
                  missing = sorted(
                      set(meta["issue"] for meta in metas)
                      - set(row["issue"] for row in rows)
                  )

                  raise RuntimeError(
                      "Only "
                      + str(len(rows))
                      + " WHO issues parsed successfully. "
                      + "Refusing to publish. Missing/unparsed issues: "
                      + ", ".join(map(str, missing))
                  )

              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "source_type": row["source_type"],
                      "issue": row["issue"],
                      "parser_version": VERSION,
                  }
                  for row in rows
              ]

              payload = {
                  "source": (
                      "WHO Eastern Mediterranean Regional Office "
                      "Gaza emergency situation reports"
                  ),
                  "underlying_source": (
                      "Gaza Ministry of Health, as labelled by WHO"
                  ),
                  "method": (
                      "Issue number and date come from WHO's official report "
                      "archive. Casualty totals come only from first-page "
                      "Gaza-specific labels or the Gaza Overview block marked "
                      "'Source: Ministry of Health'. No OCR, interpolation, "
                      "nearest-number matching, or inferred totals."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "WHO casualty points from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_who.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Expand WHO Gaza casualty timeline"
          git push
