name: Update Gaza casualty timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests beautifulsoup4

      - name: Extract Gaza casualty totals from OCHA
        shell: bash
        run: |
          cat > /tmp/update_casualties.py <<'PY'
          from pathlib import Path
          from datetime import date, datetime, timedelta, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import re

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://www.ochaopt.org/content/"
          OUT = Path("data/casualty-timeline.json")
          VERSION = 5

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-CasualtyTimeline/5.0",
              "Accept-Language": "en",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|"
              "August|September|October|November|December"
          )

          N = r"\d{1,3}(?:,\d{3})+|\d{3,6}"

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def number(raw):
              return int(raw.replace(",", ""))

          def fetch(url):
              try:
                  r = session.get(url, timeout=25)
                  if r.status_code == 404:
                      return None
                  r.raise_for_status()

                  soup = BeautifulSoup(r.text, "html.parser")

                  for tag in soup([
                      "script", "style", "nav", "header",
                      "footer", "form"
                  ]):
                      tag.decompose()

                  title = clean(
                      soup.title.get_text(" ", strip=True)
                      if soup.title else ""
                  )

                  text = clean(
                      soup.get_text(" ", strip=True)
                  )

                  return title, text

              except Exception as error:
                  print("FETCH FAILED", url, error)
                  return None

          def parse_date_word(raw):
              try:
                  return datetime.strptime(
                      clean(raw),
                      "%d %B %Y",
                  ).date().isoformat()
              except Exception:
                  return None

          def page_date(title, text):
              # OCHA pages normally expose publication date near the title.
              patterns = [
                  rf"\b(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})\b",
                  rf"\b(\d{{1,2}}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+20\d{{2}})\b",
              ]

              for haystack in (title, text[:1400]):
                  for pattern in patterns:
                      m = re.search(pattern, haystack, re.I)
                      if not m:
                          continue

                      raw = clean(m.group(1))

                      for fmt in ("%d %B %Y", "%d %b %Y"):
                          try:
                              return datetime.strptime(
                                  raw, fmt
                              ).date().isoformat()
                          except Exception:
                              pass

              return None

          # FORMAT 1 — used extensively in 2024 / early 2025:
          #
          # Between 7 October 2023 and 30 December 2024,
          # at least 45,541 Palestinians were killed and
          # 108,338 were injured, according to MoH in Gaza.
          BETWEEN = re.compile(
              rf"Between\s+7\s+October\s+2023\s+and\s+"
              rf"(?P<date>\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})"
              rf"(?P<body>.{{0,500}}?)"
              rf"(?P<k>{N})\s+Palestinians?\s+were\s+killed"
              rf"(?P<middle>.{{0,180}}?)"
              rf"(?P<i>{N})\s+(?:Palestinians?\s+)?were\s+injured"
              rf"(?P<tail>.{{0,180}}?(?:MoH|Ministry\s+of\s+Health).{{0,80}}?Gaza|"
              rf".{{0,180}}?according\s+to\s+(?:MoH|Ministry\s+of\s+Health).{{0,80}}?)",
              re.I | re.S,
          )

          # FORMAT 2 — later OCHA updates:
          #
          # This brings the casualty toll among Palestinians since
          # 7 October 2023, as reported by MoH, to
          # 64,656 fatalities and 163,503 injuries.
          TOLL = re.compile(
              rf"(?:brings?|bringing)\s+the\s+casualty\s+toll"
              rf".{{0,180}}?Palestinians?"
              rf".{{0,180}}?since\s+7\s+October\s+2023"
              rf".{{0,220}}?(?:MoH|Ministry\s+of\s+Health)"
              rf".{{0,180}}?(?P<k>{N})\s+fatalit(?:y|ies)"
              rf".{{0,120}}?(?P<i>{N})\s+injur(?:y|ies)",
              re.I | re.S,
          )

          # FORMAT 3 — early October 2023:
          #
          # As of 20:00, according to the Ministry of Health in Gaza,
          # at least 413 Palestinians have been killed and 2,300 others injured.
          EARLY_ASOF = re.compile(
              rf"As\s+of\s+\d{{1,2}}:\d{{2}}"
              rf".{{0,140}}?(?:MoH|Ministry\s+of\s+Health)"
              rf".{{0,80}}?Gaza"
              rf".{{0,160}}?(?P<k>{N})\s+Palestinians?"
              rf"\s+(?:have\s+been|were)\s+killed"
              rf".{{0,140}}?(?P<i>{N})\s+(?:others?\s+)?injured",
              re.I | re.S,
          )

          # FORMAT 4 — early Flash Updates:
          #
          # Since the start of hostilities, 2,808 Palestinians have been
          # killed and 10,850 have been injured.
          EARLY_SINCE = re.compile(
              rf"Since\s+the\s+start\s+of\s+(?:the\s+)?hostilities"
              rf".{{0,100}}?(?P<k>{N})\s+Palestinians?"
              rf"\s+(?:have\s+been|were)\s+killed"
              rf".{{0,120}}?(?P<i>{N})\s+(?:Palestinians?\s+)?"
              rf"(?:have\s+been|were)?\s*injured",
              re.I | re.S,
          )

          def valid(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def parse_page(url, label, early=False):
              result = fetch(url)

              if not result:
                  return None

              title, text = result
              matches = []

              # Format 1 gives its own effective date.
              for m in BETWEEN.finditer(text):
                  killed = number(m.group("k"))
                  injured = number(m.group("i"))
                  effective = parse_date_word(
                      m.group("date")
                  )

                  if effective and valid(killed, injured):
                      matches.append((
                          effective,
                          killed,
                          injured,
                          "between-7-oct",
                      ))

              # Format 2 uses the OCHA page/update date.
              for m in TOLL.finditer(text):
                  killed = number(m.group("k"))
                  injured = number(m.group("i"))
                  effective = page_date(
                      title,
                      text,
                  )

                  if effective and valid(killed, injured):
                      matches.append((
                          effective,
                          killed,
                          injured,
                          "casualty-toll",
                      ))

              # Early formats are ONLY allowed on the known Gaza Flash
              # Update URL families. This prevents accidental use of Israeli
              # or West Bank casualty sentences elsewhere on the site.
              if early:
                  effective = page_date(
                      title,
                      text,
                  )

                  for regex, method in (
                      (EARLY_ASOF, "early-as-of"),
                      (EARLY_SINCE, "early-since"),
                  ):
                      for m in regex.finditer(text):
                          killed = number(m.group("k"))
                          injured = number(m.group("i"))

                          if (
                              effective
                              and effective >= "2023-10-08"
                              and valid(killed, injured)
                          ):
                              matches.append((
                                  effective,
                                  killed,
                                  injured,
                                  method,
                              ))

              if not matches:
                  return None

              unique = {
                  (d, k, i): method
                  for d, k, i, method in matches
              }

              # Different totals on the same page = don't guess.
              if len(unique) != 1:
                  print(
                      "AMBIGUOUS PAGE OMITTED",
                      url,
                      list(unique),
                  )
                  return None

              (effective, killed, injured), method = next(
                  iter(unique.items())
              )

              if effective > date.today().isoformat():
                  return None

              return {
                  "date": effective,
                  "killed": killed,
                  "injured": injured,
                  "source_url": url,
                  "series_label": label,
                  "parse_method": method,
                  "parser_version": VERSION,
              }

          def targets():
              rows = []

              # The first reports used "Escalation..." in the URL.
              for n in range(1, 30):
                  rows.append((
                      BASE
                      + "escalation-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                      True,
                  ))

              # The longer-running early series used "Hostilities...".
              for n in range(1, 190):
                  rows.append((
                      BASE
                      + "hostilities-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                      True,
                  ))

              # Later Gaza Humanitarian Situation Updates.
              for n in range(150, 451):
                  rows.append((
                      BASE
                      + "humanitarian-situation-update-"
                      + str(n)
                      + "-gaza-strip",
                      f"Situation Update #{n}",
                      False,
                  ))

              # Some newer OCHA pages use date-based Situation Report URLs.
              current = date(2025, 10, 1)
              today = date.today()

              while current <= today:
                  slug = (
                      f"{current.day}-"
                      f"{current.strftime('%B').lower()}-"
                      f"{current.year}"
                  )

                  rows.append((
                      BASE
                      + "humanitarian-situation-report-"
                      + slug,
                      "Humanitarian Situation Report",
                      False,
                  ))

                  current += timedelta(days=1)

              return rows

          def collect():
              todo = targets()
              print(
                  "Checking",
                  len(todo),
                  "possible OCHA URLs",
              )

              records = []

              with ThreadPoolExecutor(
                  max_workers=6
              ) as executor:
                  futures = {
                      executor.submit(
                          parse_page,
                          url,
                          label,
                          early,
                      ): url
                      for url, label, early in todo
                  }

                  done = 0

                  for future in as_completed(futures):
                      done += 1

                      try:
                          row = future.result()
                      except Exception as error:
                          print(
                              "PARSE FAILED",
                              futures[future],
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "FOUND",
                              row["date"],
                              row["killed"],
                              row["injured"],
                              row["parse_method"],
                          )
                          records.append(row)

                      if done % 100 == 0:
                          print(
                              "Checked",
                              done,
                              "/",
                              len(todo),
                          )

              return records

          def reconcile(records):
              grouped = {}

              for row in records:
                  grouped.setdefault(
                      row["date"],
                      [],
                  ).append(row)

              output = []

              for effective in sorted(grouped):
                  rows = grouped[effective]

                  pairs = {
                      (
                          row["killed"],
                          row["injured"],
                      )
                      for row in rows
                  }

                  if len(pairs) != 1:
                      print(
                          "CONFLICTING DATE OMITTED",
                          effective,
                          pairs,
                      )
                      continue

                  # Prefer later structured OCHA update series over duplicate
                  # Flash Update pages carrying the same totals.
                  rows.sort(
                      key=lambda row: (
                          "Situation Update"
                          not in row["series_label"]
                          and "Humanitarian Situation Report"
                          not in row["series_label"],
                          row["source_url"],
                      )
                  )

                  output.append(rows[0])

              # Cumulative totals can be revised, but a parser-generated
              # backwards jump is much more likely to be wrong. Omit it rather
              # than modifying OCHA's source number.
              final = []

              for row in output:
                  if final:
                      previous = final[-1]

                      if (
                          row["killed"]
                          < previous["killed"]
                          or row["injured"]
                          < previous["injured"]
                      ):
                          print(
                              "DECREASING POINT OMITTED",
                              row,
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              records = reconcile(
                  collect()
              )

              if not records:
                  raise RuntimeError(
                      "No Gaza casualty totals were parsed "
                      "from OCHA."
                  )

              # Strip parser internals from the public site data.
              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "parser_version": VERSION,
                  }
                  for row in records
              ]

              payload = {
                  "source": (
                      "UN OCHA oPt Gaza updates; Palestinian "
                      "casualty totals attributed by OCHA to "
                      "the Gaza Ministry of Health."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS",
                  len(public),
                  "records",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_casualties.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline"
          git push
