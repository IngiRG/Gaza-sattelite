name: Update Gaza casualty timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4

      - name: Build weekly Gaza casualty timeline
        shell: bash
        run: |
          cat > /tmp/update_casualties.py <<'PY'
          from pathlib import Path
          from datetime import date, datetime, timedelta, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          import calendar
          import json
          import math
          import re
          import subprocess
          import tempfile
          import time

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://www.ochaopt.org"
          CONTENT = BASE + "/content/"
          SNAPSHOTS = BASE + "/page/publications/snapshots"
          OUT = Path("data/casualty-timeline.json")
          VERSION = 8
          START_DATE = date(2023, 10, 8)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-CasualtyTimeline/8.0",
              "Accept-Language": "en",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|"
              "August|September|October|November|December"
          )
          DATE_WORD = re.compile(
              rf"\b(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})\b",
              re.I,
          )
          NUMBER = r"\d{1,3}(?:,\d{3})+|\d{3,6}"

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def parse_number(raw):
              return int(raw.replace(",", "").replace(" ", ""))

          def parse_date(raw):
              raw = clean(raw)
              for fmt in ("%d %B %Y", "%d %b %Y"):
                  try:
                      return datetime.strptime(raw, fmt).date()
                  except Exception:
                      pass
              return None

          def request(url, timeout=45):
              r = session.get(url, timeout=timeout)
              if r.status_code == 404:
                  return None
              r.raise_for_status()
              return r

          def html_page(url):
              try:
                  r = request(url)
                  if r is None:
                      return None

                  soup = BeautifulSoup(r.text, "html.parser")
                  title = clean(
                      soup.find("h1").get_text(" ", strip=True)
                      if soup.find("h1")
                      else (
                          soup.title.get_text(" ", strip=True)
                          if soup.title else ""
                      )
                  )

                  published = None
                  for attrs in (
                      {"property": "article:published_time"},
                      {"name": "date"},
                      {"name": "DC.date"},
                  ):
                      tag = soup.find("meta", attrs=attrs)
                      if tag and tag.get("content"):
                          raw = tag["content"].strip()
                          try:
                              published = datetime.fromisoformat(
                                  raw.replace("Z", "+00:00")
                              ).date()
                              break
                          except Exception:
                              pass

                  if published is None:
                      # OCHA places the publication date close to the H1.
                      h1 = soup.find("h1")
                      vicinity = clean(
                          h1.parent.get_text(" ", strip=True)
                          if h1 and h1.parent else
                          r.text[:2500]
                      )
                      for m in DATE_WORD.finditer(vicinity):
                          d = parse_date(m.group(1))
                          if d and START_DATE <= d <= date.today():
                              published = d
                              break

                  links = [
                      urljoin(url, a["href"])
                      for a in soup.find_all("a", href=True)
                  ]

                  for tag in soup([
                      "script", "style", "nav", "header",
                      "footer", "form"
                  ]):
                      tag.decompose()

                  text = clean(soup.get_text(" ", strip=True))
                  return {
                      "title": title,
                      "published": published,
                      "text": text,
                      "links": links,
                  }
              except Exception as error:
                  print("HTML FAILED", url, error)
                  return None

          # -----------------------------------------------------------------
          # 1. OCHA HTML UPDATES
          # -----------------------------------------------------------------

          FULL_PATTERNS = [
              # "Between 7 October 2023 and 5 August 2024, at least
              # 39,623 Palestinians were killed and 91,469 were injured..."
              re.compile(
                  rf"Between\s+7\s+October\s+2023\s+and\s+"
                  rf"(?:\d{{1,2}}:\d{{2}}\s+(?:hours?\s+)?(?:on\s+)?)?"
                  rf"(?P<date>\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})"
                  rf".{{0,220}}?(?P<k>{NUMBER})\s+Palestinians?"
                  rf".{{0,60}}?killed(?:\s+in\s+Gaza)?"
                  rf".{{0,180}}?(?P<i>{NUMBER})\s+"
                  rf"(?:Palestinians?\s+)?(?:were\s+)?injured",
                  re.I | re.S,
              ),

              # "Since 7 October 2023 and as of 25 March 2025, the MoH ...
              # 50,144 ... killed and 113,704 ... injured."
              re.compile(
                  rf"Since\s+7\s+October\s+2023\s+and\s+as\s+of\s+"
                  rf"(?P<date>\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})"
                  rf".{{0,260}}?(?P<k>{NUMBER})\s+Palestinians?"
                  rf".{{0,80}}?killed"
                  rf".{{0,180}}?(?P<i>{NUMBER})\s+Palestinians?"
                  rf".{{0,50}}?injured",
                  re.I | re.S,
              ),

              # "This brings the casualty toll among Palestinians since
              # 7 October 2023 ... to 72,045 fatalities and 171,686 injuries."
              re.compile(
                  rf"(?:brings?|bringing)\s+the\s+casualty\s+toll"
                  rf".{{0,180}}?Palestinians?"
                  rf".{{0,180}}?since\s+7\s+October\s+2023"
                  rf".{{0,260}}?(?P<k>{NUMBER})\s+fatalit(?:y|ies)"
                  rf".{{0,160}}?(?P<i>{NUMBER})\s+injur(?:y|ies)",
                  re.I | re.S,
              ),

              # Early: "Since the start of hostilities, 2,808 Palestinians
              # have been killed and 10,850 have been injured."
              re.compile(
                  rf"Since\s+the\s+start\s+of\s+(?:the\s+)?hostilities"
                  rf".{{0,160}}?(?P<k>{NUMBER})\s+Palestinians?"
                  rf".{{0,70}}?killed"
                  rf".{{0,180}}?(?P<i>{NUMBER})\s+"
                  rf"(?:Palestinians?\s+)?(?:have\s+been\s+|were\s+)?injured",
                  re.I | re.S,
              ),

              # Early split wording:
              # "fatality toll ... stood at 11,078 ... Another 27,490
              # Palestinians have reportedly been injured."
              re.compile(
                  rf"(?:fatality|casualty)\s+toll"
                  rf".{{0,160}}?(?P<k>{NUMBER})"
                  rf".{{0,450}}?(?:another|about|approximately)?\s*"
                  rf"(?P<i>{NUMBER})\s+Palestinians?"
                  rf".{{0,80}}?injured",
                  re.I | re.S,
              ),

              # Dec 2023 style:
              # "between 7 October and 19 December ... 19,667 ... killed...
              # As of then, about 52,586 ... injured"
              re.compile(
                  rf"(?:According\s+to\s+the\s+MoH\s+in\s+Gaza,\s+)?"
                  rf"between\s+7\s+October(?:\s+2023)?\s+and\s+"
                  rf"(?P<date>\d{{1,2}}\s+(?:{MONTHS}))"
                  rf".{{0,260}}?(?P<k>{NUMBER})\s+"
                  rf"(?:people\s+)?Palestinians?"
                  rf".{{0,80}}?killed"
                  rf".{{0,300}}?(?P<i>{NUMBER})\s+"
                  rf"(?:people\s+)?(?:Palestinians?\s+)?"
                  rf".{{0,80}}?injured",
                  re.I | re.S,
              ),
          ]

          def valid_pair(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def paragraph_context(text, start, end):
              return text[max(0, start - 300):min(len(text), end + 300)].lower()

          def date_from_match(match, published):
              if "date" in match.groupdict() and match.group("date"):
                  raw = clean(match.group("date"))

                  # December 2023 regex may omit the year.
                  if not re.search(r"20\d{2}", raw):
                      raw += " 2023"

                  d = parse_date(raw)
                  if d:
                      return d

              return published

          def extract_html_record(url, label):
              page = html_page(url)
              if not page:
                  return None

              text = page["text"]
              candidates = []

              for pattern_index, pattern in enumerate(FULL_PATTERNS):
                  for match in pattern.finditer(text):
                      context = paragraph_context(
                          text, match.start(), match.end()
                      )

                      # Must clearly be the Gaza/MoH series.
                      if not any(x in context for x in (
                          "ministry of health",
                          "moh",
                          "gaza",
                      )):
                          continue

                      # Reject obvious West Bank / Israel-only passages.
                      if (
                          "west bank" in context
                          and "gaza" not in context
                      ):
                          continue

                      killed = parse_number(match.group("k"))
                      injured = parse_number(match.group("i"))

                      if not valid_pair(killed, injured):
                          continue

                      effective = date_from_match(
                          match, page["published"]
                      )

                      if not effective:
                          continue

                      if not (START_DATE <= effective <= date.today()):
                          continue

                      candidates.append({
                          "date": effective.isoformat(),
                          "killed": killed,
                          "injured": injured,
                          "source_url": url,
                          "series_label": label,
                          "source_type": "ocha-html",
                          "confidence": 100 - pattern_index,
                      })

              # Fallback for early pages where exact wording is:
              # "... 18,787 Palestinians killed. About 50,589 Palestinians
              # have reportedly been injured."
              if not candidates:
                  low = text.lower()
                  if (
                      ("ministry of health" in low or "moh" in low)
                      and "gaza" in low
                  ):
                      windows = []
                      for m in re.finditer(
                          r"(?:killed|fatalit(?:y|ies))",
                          text,
                          re.I,
                      ):
                          windows.append(
                              text[
                                  max(0, m.start() - 220):
                                  min(len(text), m.start() + 500)
                              ]
                          )

                      for window in windows:
                          k = re.search(
                              rf"(?P<n>{NUMBER})\s+Palestinians?"
                              rf".{{0,80}}?killed",
                              window,
                              re.I | re.S,
                          )
                          i = re.search(
                              rf"(?P<n>{NUMBER})\s+"
                              rf"(?:Palestinians?\s+)?"
                              rf".{{0,80}}?injured",
                              window,
                              re.I | re.S,
                          )

                          if not (k and i):
                              continue

                          killed = parse_number(k.group("n"))
                          injured = parse_number(i.group("n"))

                          if not valid_pair(killed, injured):
                              continue

                          effective = page["published"]
                          if not effective:
                              continue

                          candidates.append({
                              "date": effective.isoformat(),
                              "killed": killed,
                              "injured": injured,
                              "source_url": url,
                              "series_label": label,
                              "source_type": "ocha-html",
                              "confidence": 88,
                          })

              if not candidates:
                  return None

              unique = {
                  (
                      row["date"],
                      row["killed"],
                      row["injured"],
                  ): row
                  for row in candidates
              }

              # If one page gives different plausible cumulative totals,
              # don't guess.
              if len(unique) != 1:
                  print("AMBIGUOUS HTML PAGE", url, list(unique))
                  return None

              return next(iter(unique.values()))

          def html_targets():
              rows = []

              for n in range(1, 40):
                  rows.append((
                      CONTENT
                      + "escalation-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                  ))

              for n in range(1, 220):
                  rows.append((
                      CONTENT
                      + "hostilities-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                  ))

              for n in range(120, 390):
                  rows.append((
                      CONTENT
                      + "humanitarian-situation-update-"
                      + str(n)
                      + "-gaza-strip",
                      f"Situation Update #{n}",
                  ))

              # Date-based current reports. They are useful if OCHA again
              # publishes a full-war cumulative total in ordinary HTML.
              current = date(2026, 2, 1)
              today = date.today()
              while current <= today:
                  slug = (
                      f"{current.day}-"
                      f"{current.strftime('%B').lower()}-"
                      f"{current.year}"
                  )
                  rows.append((
                      CONTENT
                      + "humanitarian-situation-report-"
                      + slug,
                      "Humanitarian Situation Report",
                  ))
                  current += timedelta(days=1)

              return rows

          def collect_html():
              todo = html_targets()
              rows = []

              print("Scanning", len(todo), "OCHA HTML pages")

              with ThreadPoolExecutor(max_workers=6) as executor:
                  futures = {
                      executor.submit(
                          extract_html_record, url, label
                      ): url
                      for url, label in todo
                  }

                  done = 0
                  for future in as_completed(futures):
                      done += 1
                      try:
                          row = future.result()
                      except Exception as error:
                          print(
                              "HTML PARSE FAILED",
                              futures[future],
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "HTML",
                              row["date"],
                              row["killed"],
                              row["injured"],
                              row["series_label"],
                          )
                          rows.append(row)

                      if done % 100 == 0:
                          print(
                              "HTML checked",
                              done,
                              "/",
                              len(todo),
                          )

              return rows

          # -----------------------------------------------------------------
          # 2. OCHA REPORTED-IMPACT SNAPSHOTS
          # -----------------------------------------------------------------

          SNAPSHOT_TITLE = re.compile(
              r"Reported impact snapshot\s*\|\s*Gaza Strip\s*"
              r"\(([^)]+)\)",
              re.I,
          )
          EARLY_SNAPSHOT = re.compile(
              r"(?:Hostilities in the Gaza Strip and Israel\s*-\s*)?"
              r"reported impact\s*\|\s*Day\s*(\d+)",
              re.I,
          )

          def discover_snapshots():
              found = {}
              empty_streak = 0

              for page_num in range(0, 85):
                  url = (
                      SNAPSHOTS
                      if page_num == 0
                      else f"{SNAPSHOTS}?page={page_num}"
                  )

                  page = html_page(url)
                  if not page:
                      empty_streak += 1
                      if empty_streak >= 6:
                          break
                      continue

                  soup_response = request(url)
                  if soup_response is None:
                      continue

                  soup = BeautifulSoup(
                      soup_response.text, "html.parser"
                  )

                  count = 0
                  for a in soup.find_all("a", href=True):
                      title = clean(
                          a.get_text(" ", strip=True)
                      )

                      modern = SNAPSHOT_TITLE.search(title)
                      early = EARLY_SNAPSHOT.search(title)

                      if not (modern or early):
                          continue

                      snapshot_url = urljoin(
                          url, a["href"]
                      ).split("#", 1)[0]

                      if modern:
                          effective = parse_date(
                              modern.group(1)
                          )
                      else:
                          day_number = int(early.group(1))
                          effective = (
                              date(2023, 10, 7)
                              + timedelta(days=day_number - 1)
                          )

                      if (
                          effective
                          and START_DATE <= effective <= date.today()
                      ):
                          found[snapshot_url] = {
                              "url": snapshot_url,
                              "title": title,
                              "date": effective,
                          }
                          count += 1

                  if count:
                      empty_streak = 0
                  else:
                      empty_streak += 1

                  if page_num > 15 and empty_streak >= 6:
                      break

                  time.sleep(0.05)

              print(
                  "Discovered",
                  len(found),
                  "OCHA Gaza snapshots",
              )
              return list(found.values())

          def pdf_text(url):
              r = request(url, timeout=120)
              if r is None:
                  return ""

              data = r.content

              if not data.startswith(b"%PDF"):
                  return ""

              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "snapshot.pdf"
                  txt = Path(folder) / "snapshot.txt"
                  pdf.write_bytes(data)

                  process = subprocess.run(
                      [
                          "pdftotext",
                          "-layout",
                          str(pdf),
                          str(txt),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if (
                      process.returncode != 0
                      or not txt.exists()
                  ):
                      return ""

                  return txt.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

          def snapshot_pdf_links(snapshot_url):
              page = html_page(snapshot_url)
              if not page:
                  return []

              scored = []
              for href in page["links"]:
                  if not re.search(
                      r"\.pdf(?:\?|$)",
                      href,
                      re.I,
                  ):
                      continue

                  low = href.lower()
                  score = (
                      ("gaza" in low) * 4
                      + ("impact" in low) * 4
                      + ("snapshot" in low) * 4
                      + ("reported" in low) * 2
                  )
                  scored.append((score, href))

              scored.sort(reverse=True)

              # De-duplicate while preserving score order.
              output = []
              seen = set()
              for _, href in scored:
                  if href not in seen:
                      output.append(href)
                      seen.add(href)

              return output[:5]

          def line_candidates(lines, label_regex):
              output = []

              for idx, line in enumerate(lines):
                  if not re.search(label_regex, line, re.I):
                      continue

                  # Number may be on same line or visually above/below it.
                  for offset in (0, -1, 1, -2, 2, -3):
                      pos = idx + offset
                      if not (0 <= pos < len(lines)):
                          continue

                      for m in re.finditer(NUMBER, lines[pos]):
                          value = parse_number(m.group(0))
                          distance = abs(offset)
                          output.append(
                              (distance, value, pos)
                          )

              return output

          def parse_snapshot_pdf(text, effective, url):
              lines = [
                  line.rstrip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              fatalities = line_candidates(
                  lines,
                  r"\breported\s+fatalit(?:y|ies)\b",
              )
              injuries = line_candidates(
                  lines,
                  r"\breported\s+injur(?:y|ies)\b",
              )

              if not fatalities:
                  fatalities = line_candidates(
                      lines,
                      r"\bfatalit(?:y|ies)\b",
                  )

              if not injuries:
                  injuries = line_candidates(
                      lines,
                      r"\binjur(?:y|ies)\b",
                  )

              possible = []

              for kd, killed, kp in fatalities:
                  if not (100 <= killed <= 500000):
                      continue

                  for idist, injured, ip in injuries:
                      if not (100 <= injured <= 1000000):
                          continue
                      if injured <= killed:
                          continue

                      # Cumulative Gaza totals have consistently had injuries
                      # above fatalities, generally by a substantial margin.
                      ratio = injured / killed
                      if not (1.15 <= ratio <= 5.0):
                          continue

                      # Prefer labels/numbers close together in the layout and
                      # larger cumulative totals over subgroup counts.
                      score = (
                          1000
                          - kd * 80
                          - idist * 80
                          - abs(kp - ip) * 10
                          + min(killed, 200000) / 500
                          + min(injured, 400000) / 500
                      )

                      possible.append(
                          (score, killed, injured)
                      )

              if not possible:
                  return None

              possible.sort(reverse=True)
              best = possible[0]

              # Reject genuinely ambiguous layouts.
              if len(possible) > 1:
                  second = possible[1]
                  if (
                      best[0] - second[0] < 20
                      and (best[1], best[2])
                      != (second[1], second[2])
                  ):
                      return None

              return {
                  "date": effective.isoformat(),
                  "killed": best[1],
                  "injured": best[2],
                  "source_url": url,
                  "series_label": "OCHA Reported Impact Snapshot",
                  "source_type": "ocha-snapshot-pdf",
                  "confidence": 70,
              }

          def extract_snapshot(meta):
              links = snapshot_pdf_links(meta["url"])

              for pdf in links:
                  try:
                      text = pdf_text(pdf)
                  except Exception as error:
                      print("PDF READ FAILED", pdf, error)
                      continue

                  if len(text.strip()) < 200:
                      continue

                  row = parse_snapshot_pdf(
                      text,
                      meta["date"],
                      meta["url"],
                  )

                  if row:
                      row["asset_url"] = pdf
                      return row

              return None

          def collect_snapshots(existing_html):
              metas = discover_snapshots()

              # We don't need every snapshot if HTML already gives good
              # weekly coverage. Parse at most one snapshot per ISO week,
              # choosing the latest one in each week.
              weeks = {}
              for meta in metas:
                  iso = meta["date"].isocalendar()
                  key = (iso.year, iso.week)
                  if (
                      key not in weeks
                      or meta["date"] > weeks[key]["date"]
                  ):
                      weeks[key] = meta

              selected = list(weeks.values())
              selected.sort(key=lambda x: x["date"])

              print(
                  "Parsing",
                  len(selected),
                  "weekly snapshot candidates",
              )

              rows = []

              # PDFs are heavier; keep concurrency low.
              with ThreadPoolExecutor(max_workers=3) as executor:
                  futures = {
                      executor.submit(extract_snapshot, meta):
                      meta["url"]
                      for meta in selected
                  }

                  done = 0
                  for future in as_completed(futures):
                      done += 1
                      try:
                          row = future.result()
                      except Exception as error:
                          print(
                              "SNAPSHOT PARSE FAILED",
                              futures[future],
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "SNAPSHOT",
                              row["date"],
                              row["killed"],
                              row["injured"],
                          )
                          rows.append(row)

                      if done % 25 == 0:
                          print(
                              "Snapshots checked",
                              done,
                              "/",
                              len(selected),
                          )

              return rows

          # -----------------------------------------------------------------
          # 3. CROSS-CHECK, WEEKLY SAMPLING, MONTHLY COVERAGE ASSERTION
          # -----------------------------------------------------------------

          def plausible_transition(previous, current):
              if not previous:
                  return True

              d1 = datetime.fromisoformat(
                  previous["date"]
              ).date()
              d2 = datetime.fromisoformat(
                  current["date"]
              ).date()

              if d2 <= d1:
                  return False

              if (
                  current["killed"] < previous["killed"]
                  or current["injured"] < previous["injured"]
              ):
                  return False

              days = max(1, (d2 - d1).days)
              killed_rate = (
                  current["killed"]
                  - previous["killed"]
              ) / days
              injured_rate = (
                  current["injured"]
                  - previous["injured"]
              ) / days

              # Very generous parser-error guards, not substantive claims.
              return (
                  killed_rate <= 5000
                  and injured_rate <= 15000
              )

          def reconcile(html_rows, snapshot_rows):
              all_rows = html_rows + snapshot_rows

              # De-duplicate same date. Prefer HTML because the cumulative
              # statement is directly machine-readable and source-attributed.
              by_date = {}

              for row in all_rows:
                  key = row["date"]

                  if key not in by_date:
                      by_date[key] = row
                      continue

                  old = by_date[key]

                  if (
                      old["killed"] == row["killed"]
                      and old["injured"] == row["injured"]
                  ):
                      if row["source_type"] == "ocha-html":
                          by_date[key] = row
                      continue

                  # Conflict: HTML wins over PDF. PDF-vs-PDF conflict is omitted.
                  if old["source_type"] == "ocha-html":
                      continue
                  if row["source_type"] == "ocha-html":
                      by_date[key] = row
                  else:
                      by_date[key] = None
                      print("PDF DATE CONFLICT", key)

              candidates = [
                  row
                  for row in by_date.values()
                  if row is not None
              ]
              candidates.sort(key=lambda r: r["date"])

              # Walk forward and reject implausible transitions.
              valid = []
              for row in candidates:
                  if plausible_transition(
                      valid[-1] if valid else None,
                      row,
                  ):
                      valid.append(row)
                  else:
                      print(
                          "TRANSITION OMITTED",
                          row,
                      )

              # One point per ISO week, choose the latest trusted point.
              weekly = {}
              for row in valid:
                  d = datetime.fromisoformat(
                      row["date"]
                  ).date()
                  iso = d.isocalendar()
                  key = (iso.year, iso.week)

                  old = weekly.get(key)
                  if old is None:
                      weekly[key] = row
                      continue

                  old_date = datetime.fromisoformat(
                      old["date"]
                  ).date()

                  if d > old_date:
                      weekly[key] = row
                  elif (
                      d == old_date
                      and row["source_type"] == "ocha-html"
                  ):
                      weekly[key] = row

              output = list(weekly.values())
              output.sort(key=lambda r: r["date"])
              return output

          def month_range(start, end):
              year, month = start.year, start.month
              while (year, month) <= (end.year, end.month):
                  yield year, month
                  if month == 12:
                      year += 1
                      month = 1
                  else:
                      month += 1

          def assert_monthly_coverage(rows):
              if not rows:
                  raise RuntimeError(
                      "No casualty records were produced."
                  )

              first = datetime.fromisoformat(
                  rows[0]["date"]
              ).date()
              last = datetime.fromisoformat(
                  rows[-1]["date"]
              ).date()

              present = {
                  (
                      datetime.fromisoformat(
                          row["date"]
                      ).year,
                      datetime.fromisoformat(
                          row["date"]
                      ).month,
                  )
                  for row in rows
              }

              missing = []
              for year, month in month_range(
                  max(first, START_DATE),
                  last,
              ):
                  if (year, month) not in present:
                      missing.append(
                          f"{calendar.month_name[month]} {year}"
                      )

              if missing:
                  raise RuntimeError(
                      "Refusing to publish: no trustworthy casualty "
                      "point was found for these month(s): "
                      + ", ".join(missing)
                  )

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              html_rows = collect_html()
              snapshot_rows = collect_snapshots(
                  html_rows
              )

              weekly = reconcile(
                  html_rows,
                  snapshot_rows,
              )

              weekly = [
                  row
                  for row in weekly
                  if row["date"] >= "2023-10-08"
              ]

              assert_monthly_coverage(weekly)

              public = []
              for row in weekly:
                  public.append({
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "source_type": row["source_type"],
                      "parser_version": VERSION,
                  })

              payload = {
                  "source": (
                      "UN OCHA oPt Gaza HTML updates and official "
                      "Reported Impact Snapshots; Palestinian casualty "
                      "figures are attributed by OCHA to the Gaza "
                      "Ministry of Health."
                  ),
                  "sampling": (
                      "Maximum one trusted point per ISO week. "
                      "Workflow refuses to publish if a calendar month "
                      "within the covered range has no trusted point."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "weekly points from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_casualties.py

