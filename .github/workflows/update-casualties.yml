name: Update Gaza casualty timeline from WHO

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4

      - name: Build WHO casualty timeline
        shell: bash
        run: |
          cat > /tmp/update_who.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urljoin
          import json
          import re
          import subprocess
          import tempfile

          import requests
          from bs4 import BeautifulSoup

          OUT = Path("data/casualty-timeline.json")
          VERSION = 12

          ARCHIVES = [
              "https://www.emro.who.int/opt/information-resources/emergency-situation-reports.html",
              "https://www.emro.who.int/fr/opt/information-resources/emergency-situation-reports.html",
              "https://www.emro.who.int/opt/information-resources/",
              "https://www.emro.who.int/fr/opt/information-resources/",
          ]

          # WHO's archive currently resolves Issue 68 to the wrong PDF on
          # some mirrors. This is the official WHO EMRO Issue 68 PDF.
          DIRECT_ISSUE_URLS = {
              68: "https://www.emro.who.int/images/stories/palestine/Sitrep_68.pdf",
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-WHO-CasualtyTimeline/10.0",
              "Accept-Language": "en",
          })

          ISSUE_LABEL = re.compile(
              r"\bIssue\s+(\d+)\s*,?\s*"
              r"(\d{1,2}\s+"
              r"(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|"
              r"May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|"
              r"Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
              r"\s+20\d{2})",
              re.I,
          )

          PDF_ISSUE = re.compile(
              r"\bIssue\s*#?\s*(\d+)\b",
              re.I,
          )

          NUM = r"\d{1,3}(?:[,\s]\d{3})+|\d{3,6}"

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def n(raw):
              return int(re.sub(r"[\s,]", "", raw))

          def get(url, timeout=90):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r

          def parse_label_date(raw):
              raw = clean(raw)
              for fmt in (
                  "%d %B %Y",
                  "%d %b %Y",
              ):
                  try:
                      return datetime.strptime(
                          raw,
                          fmt,
                      ).date().isoformat()
                  except Exception:
                      pass
              return None

          def discover():
              """
              The WHO archive is our source of truth for:
              - issue number
              - issue/report date
              - PDF URL

              We do NOT infer those values from arbitrary PDF body text.
              """
              issues = {}

              for archive in ARCHIVES:
                  try:
                      soup = BeautifulSoup(
                          get(archive).text,
                          "html.parser",
                      )
                  except Exception as error:
                      print("ARCHIVE FAILED", archive, error)
                      continue

                  links = soup.find_all("a", href=True)

                  for a in links:
                      label = clean(
                          a.get_text(" ", strip=True)
                      )
                      match = ISSUE_LABEL.search(label)

                      if not match:
                          continue

                      issue = int(match.group(1))
                      report_date = parse_label_date(
                          match.group(2)
                      )

                      if not report_date:
                          continue

                      href = urljoin(
                          archive,
                          a["href"],
                      )

                      # Some archive links redirect to a PDF rather than
                      # ending with .pdf, so do not require a .pdf suffix.
                      current = issues.get(issue)

                      candidate = {
                          "issue": issue,
                          "date": report_date,
                          "url": href,
                          "archive_label": label,
                      }

                      # Prefer links that visibly point to PDFs.
                      if current is None:
                          issues[issue] = candidate
                      elif (
                          ".pdf" in href.lower()
                          and ".pdf" not in current["url"].lower()
                      ):
                          issues[issue] = candidate

              if not issues:
                  raise RuntimeError(
                      "No WHO Gaza emergency situation-report "
                      "issues were discovered."
                  )

              output = [
                  issues[key]
                  for key in sorted(issues)
              ]

              print(
                  "WHO archive discovered",
                  len(output),
                  "issues:",
                  output[0]["issue"],
                  "through",
                  output[-1]["issue"],
              )

              return output

          def pdf_first_page_issue(pdf_bytes):
              """
              Return the WHO issue number printed on page 1, if present.
              Used to prevent an intermediate WHO page from sending us to
              a different issue's PDF.
              """
              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "candidate.pdf"
                  txt = Path(folder) / "candidate.txt"
                  pdf.write_bytes(pdf_bytes)

                  result = subprocess.run(
                      [
                          "pdftotext",
                          "-f", "1",
                          "-l", "1",
                          "-layout",
                          str(pdf),
                          str(txt),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if (
                      result.returncode != 0
                      or not txt.exists()
                  ):
                      return None

                  content = txt.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  match = PDF_ISSUE.search(content[:2500])
                  return (
                      int(match.group(1))
                      if match else None
                  )

          def resolve_pdf(url, expected_issue):
              """
              Resolve the WHO archive link to the PDF for exactly
              expected_issue.

              Some WHO archive links open an intermediate page containing
              multiple situation-report PDFs. The older resolver simply chose
              the highest-scoring PDF and could therefore select a later issue.
              This version verifies the issue number printed on page 1.
              """
              r = get(url, timeout=90)

              ctype = (
                  r.headers.get(
                      "content-type",
                      "",
                  ).lower()
              )

              # Direct PDF link: only accept it if the printed issue matches.
              if (
                  r.content.startswith(b"%PDF")
                  or "application/pdf" in ctype
              ):
                  actual_issue = pdf_first_page_issue(
                      r.content
                  )

                  if (
                      actual_issue is None
                      or actual_issue == expected_issue
                  ):
                      return r.url, r.content

                  raise RuntimeError(
                      f"direct PDF is issue {actual_issue}, "
                      f"expected issue {expected_issue}"
                  )

              soup = BeautifulSoup(
                  r.text,
                  "html.parser",
              )

              candidates = []

              for a in soup.find_all("a", href=True):
                  href = urljoin(
                      r.url,
                      a["href"],
                  )

                  if ".pdf" not in href.lower():
                      continue

                  label = clean(
                      a.get_text(" ", strip=True)
                  ).lower()
                  low_href = href.lower()

                  score = 0

                  # Strongly prefer a link whose visible text/filename
                  # mentions the exact expected issue.
                  issue_tokens = (
                      f"issue-{expected_issue}",
                      f"issue_{expected_issue}",
                      f"issue {expected_issue}",
                      f"sitrep_{expected_issue}",
                      f"sitrep-{expected_issue}",
                      f"sitrep{expected_issue}",
                  )

                  combined = label + " " + low_href

                  if any(
                      token in combined
                      for token in issue_tokens
                  ):
                      score += 100

                  score += (
                      ("download" in label) * 2
                      + ("report" in label) * 2
                      + ("sitrep" in low_href) * 3
                      + ("palestine" in low_href) * 2
                      + ("opt" in low_href) * 2
                  )

                  candidates.append(
                      (score, href)
                  )

              if not candidates:
                  raise RuntimeError(
                      "WHO archive link did not expose any PDFs: "
                      + url
                  )

              # Highest-likelihood links first, but verify the printed
              # issue number before accepting anything.
              candidates.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              seen = set()

              for _, href in candidates:
                  if href in seen:
                      continue
                  seen.add(href)

                  try:
                      candidate = get(
                          href,
                          timeout=120,
                      )
                  except Exception as error:
                      print(
                          "Candidate PDF fetch failed:",
                          href,
                          error,
                      )
                      continue

                  if not candidate.content.startswith(b"%PDF"):
                      continue

                  actual_issue = pdf_first_page_issue(
                      candidate.content
                  )

                  if actual_issue == expected_issue:
                      print(
                          f"Resolved archive issue {expected_issue} "
                          f"to matching PDF: {candidate.url}"
                      )
                      return (
                          candidate.url,
                          candidate.content,
                      )

                  print(
                      f"Rejected candidate PDF for issue "
                      f"{expected_issue}: printed issue "
                      f"{actual_issue} ({candidate.url})"
                  )

              raise RuntimeError(
                  f"No PDF with printed issue {expected_issue} "
                  f"was found from WHO archive link {url}"
              )

          def first_page_texts(pdf_bytes):
              """
              Return both layout-preserving and raw reading-order text.
              WHO's early reports use multi-column cards: one representation
              may separate a number from its label while the other keeps them
              together. We require exact Gaza labels either way.
              """
              outputs = []

              with tempfile.TemporaryDirectory() as folder:
                  pdf = Path(folder) / "report.pdf"
                  pdf.write_bytes(pdf_bytes)

                  for mode in ("layout", "raw"):
                      txt = Path(folder) / f"page1-{mode}.txt"

                      command = [
                          "pdftotext",
                          "-f", "1",
                          "-l", "1",
                      ]

                      if mode == "layout":
                          command.append("-layout")
                      else:
                          command.append("-raw")

                      command += [
                          str(pdf),
                          str(txt),
                      ]

                      result = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                      )

                      if (
                          result.returncode == 0
                          and txt.exists()
                      ):
                          content = txt.read_text(
                              encoding="utf-8",
                              errors="ignore",
                          )

                          if content.strip():
                              outputs.append(
                                  (mode, content)
                              )

              return outputs

          def valid(killed, injured):
              return (
                  100 <= killed <= 500000
                  and 100 <= injured <= 1000000
                  and injured > killed
              )

          def exact_label_values(text, label_regex):
              """
              Find a number attached to an exact semantic label without
              assuming whether pdftotext placed the number before or after it.

              We only look within 180 characters of the exact Gaza label.
              """
              flat = clean(text)
              values = set()

              for label in re.finditer(
                  label_regex,
                  flat,
                  re.I,
              ):
                  left = flat[
                      max(0, label.start() - 180):
                      label.start()
                  ]
                  right = flat[
                      label.end():
                      min(len(flat), label.end() + 180)
                  ]

                  left_nums = list(
                      re.finditer(NUM, left)
                  )
                  right_nums = list(
                      re.finditer(NUM, right)
                  )

                  candidates = []

                  if left_nums:
                      m = left_nums[-1]
                      candidates.append(
                          (
                              len(left) - m.end(),
                              n(m.group(0)),
                          )
                      )

                  if right_nums:
                      m = right_nums[0]
                      candidates.append(
                          (
                              m.start(),
                              n(m.group(0)),
                          )
                      )

                  for distance, value in candidates:
                      if distance <= 90:
                          values.add(value)

              return values

          def pairs_from_early_gaza_labels(text):
              """
              Early WHO cards explicitly label Gaza figures. We use those
              exact labels and tolerate pdftotext putting the value on either
              side of the phrase.
              """
              killed = set()
              injured = set()

              killed_labels = [
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"Palestinians?\s+killed\s+in\s+Gaza",
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"people\s+killed\s+in\s+Gaza",
              ]

              injured_labels = [
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"Palestinians?\s+injured\s+in\s+Gaza",
                  r"(?:Estimated\s+number\s+of\s+)?"
                  r"people\s+injured\s+in\s+Gaza",
              ]

              for label in killed_labels:
                  killed.update(
                      exact_label_values(
                          text,
                          label,
                      )
                  )

              for label in injured_labels:
                  injured.update(
                      exact_label_values(
                          text,
                          label,
                      )
                  )

              return [
                  (k, i, "explicit-gaza-labels")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def pairs_from_overview(text):
              """
              Later WHO format:

              Gaza Strip
              Overview
              Source: Ministry of Health.
              41,272 Fatalities
              95,551 Injuries

              Only inspect the first-page Gaza overview BEFORE
              'Health Facility' / 'Health Care' so health-attack casualty
              counts cannot be selected accidentally.
              """
              flat = clean(text)
              low = flat.lower()

              gaza_pos = low.find("gaza strip")
              if gaza_pos < 0:
                  return []

              source_pos = low.find(
                  "source: ministry of health",
                  gaza_pos,
              )

              if source_pos < 0:
                  source_pos = low.find(
                      "source: ministry of health.",
                      gaza_pos,
                  )

              if source_pos < 0:
                  return []

              end_positions = []

              for marker in (
                  "health facility",
                  "health care functioning",
                  "healthcare functioning",
                  "health attacks",
                  "hospitals functionality",
                  "phccs functionality",
              ):
                  pos = low.find(
                      marker,
                      source_pos + 20,
                  )
                  if pos > source_pos:
                      end_positions.append(pos)

              end = (
                  min(end_positions)
                  if end_positions
                  else min(
                      len(flat),
                      source_pos + 2200,
                  )
              )

              overview = flat[
                  gaza_pos:end
              ]

              killed = set()
              injured = set()

              for m in re.finditer(
                  rf"(?P<n>{NUM})\s+"
                  rf"(?:Reported\s+)?Fatalit(?:y|ies)\b",
                  overview,
                  re.I,
              ):
                  killed.add(
                      n(m.group("n"))
                  )

              for m in re.finditer(
                  rf"(?P<n>{NUM})\s+"
                  rf"(?:Reported\s+)?Injur(?:y|ies)\b",
                  overview,
                  re.I,
              ):
                  injured.add(
                      n(m.group("n"))
                  )

              # Some layouts put labels before values after text extraction.
              if not killed:
                  for m in re.finditer(
                      rf"\bFatalit(?:y|ies)\b"
                      rf"[^\d]{{0,40}}(?P<n>{NUM})",
                      overview,
                      re.I,
                  ):
                      killed.add(
                          n(m.group("n"))
                      )

              if not injured:
                  for m in re.finditer(
                      rf"\bInjur(?:y|ies)\b"
                      rf"[^\d]{{0,40}}(?P<n>{NUM})",
                      overview,
                      re.I,
                  ):
                      injured.add(
                          n(m.group("n"))
                      )

              return [
                  (k, i, "gaza-overview-moh")
                  for k in killed
                  for i in injured
                  if valid(k, i)
              ]

          def pairs_from_cumulative_sentence(text):
              """
              Backup for recent issues if WHO changes the cards but writes an
              explicit cumulative Gaza sentence on page 1.
              """
              flat = clean(text)
              patterns = [
                  re.compile(
                      rf"(?:cumulative\s+toll|cumulatively)"
                      rf".{{0,140}}?(?:since\s+October\s+2023|"
                      rf"since\s+7\s+October\s+2023)"
                      rf".{{0,160}}?(?P<k>{NUM})\s+"
                      rf"(?:deaths|fatalities|people\s+(?:have\s+been\s+)?killed)"
                      rf".{{0,180}}?(?P<i>{NUM})\s+"
                      rf"(?:injuries|people\s+injured|injured)",
                      re.I | re.S,
                  ),
              ]

              output = []

              for pattern in patterns:
                  for m in pattern.finditer(flat):
                      killed = n(m.group("k"))
                      injured = n(m.group("i"))

                      if valid(killed, injured):
                          output.append(
                              (
                                  killed,
                                  injured,
                                  "explicit-cumulative-sentence",
                              )
                          )

              return output

          def parse_issue(meta):
              try:
                  if meta["issue"] in DIRECT_ISSUE_URLS:
                      direct = DIRECT_ISSUE_URLS[
                          meta["issue"]
                      ]
                      response = get(
                          direct,
                          timeout=120,
                      )

                      if not response.content.startswith(b"%PDF"):
                          raise RuntimeError(
                              "direct WHO override is not a PDF"
                          )

                      actual_issue = pdf_first_page_issue(
                          response.content
                      )

                      if actual_issue != meta["issue"]:
                          raise RuntimeError(
                              f"direct override printed issue "
                              f"{actual_issue}, expected "
                              f"{meta['issue']}"
                          )

                      pdf_url = response.url
                      pdf_bytes = response.content

                  else:
                      pdf_url, pdf_bytes = resolve_pdf(
                          meta["url"],
                          meta["issue"],
                      )

              except Exception as error:
                  print(
                      f"ISSUE {meta['issue']} PDF FAILED:",
                      error,
                  )
                  return None

              texts = first_page_texts(
                  pdf_bytes
              )

              if not texts:
                  print(
                      "ISSUE",
                      meta["issue"],
                      "has no usable first-page text",
                  )
                  return None

              all_pairs = {}

              for mode, content in texts:
                  issue_match = PDF_ISSUE.search(
                      content[:2500]
                  )

                  if issue_match:
                      parsed_issue = int(
                          issue_match.group(1)
                      )

                      if parsed_issue != meta["issue"]:
                          print(
                              "ISSUE NUMBER MISMATCH:",
                              meta["issue"],
                              "archive vs",
                              parsed_issue,
                              f"PDF ({mode})",
                          )
                          continue

                  candidates = []
                  candidates.extend(
                      pairs_from_early_gaza_labels(
                          content
                      )
                  )
                  candidates.extend(
                      pairs_from_overview(
                          content
                      )
                  )
                  candidates.extend(
                      pairs_from_cumulative_sentence(
                          content
                      )
                  )

                  for killed, injured, method in candidates:
                      all_pairs.setdefault(
                          (killed, injured),
                          set(),
                      ).add(
                          f"{method}:{mode}"
                      )

              if not all_pairs:
                  print(
                      "NO CASUALTY PAIR: issue",
                      meta["issue"],
                      meta["date"],
                  )
                  return None

              # The same true pair appearing through multiple layouts/methods
              # is strong agreement. Different pairs are rejected.
              if len(all_pairs) > 1:
                  print(
                      "AMBIGUOUS ISSUE",
                      meta["issue"],
                      list(all_pairs),
                  )
                  return None

              (killed, injured), methods = next(
                  iter(all_pairs.items())
              )

              return {
                  "date": meta["date"],
                  "killed": killed,
                  "injured": injured,
                  "source_url": pdf_url,
                  "series_label": (
                      "WHO Emergency Situation Report "
                      f"#{meta['issue']}"
                  ),
                  "source_type": "WHO EMRO",
                  "issue": meta["issue"],
                  "parse_method": "+".join(
                      sorted(methods)
                  ),
                  "parser_version": VERSION,
              }

          def validate(rows):
              rows.sort(
                  key=lambda row: row["issue"]
              )

              final = []

              for row in rows:
                  if final:
                      previous = final[-1]

                      # WHO/MoH cumulative figures should not go backwards.
                      # Never correct a source value automatically.
                      if (
                          row["killed"]
                          < previous["killed"]
                          or row["injured"]
                          < previous["injured"]
                      ):
                          print(
                              "DECREASING TOTAL OMITTED:",
                              row["issue"],
                              row["killed"],
                              row["injured"],
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              metas = discover()
              rows = []

              for index, meta in enumerate(
                  metas,
                  start=1,
              ):
                  print(
                      f"Parsing WHO issue {meta['issue']} "
                      f"({index}/{len(metas)})"
                  )

                  row = parse_issue(meta)

                  if row:
                      print(
                          "FOUND",
                          row["issue"],
                          row["date"],
                          row["killed"],
                          row["injured"],
                          row["parse_method"],
                      )
                      rows.append(row)

              rows = validate(rows)

              # Safety gate. WHO currently has far more than 19 Gaza issues.
              # If parsing suddenly collapses, do NOT overwrite good data.
              if len(rows) < 30:
                  missing = sorted(
                      set(meta["issue"] for meta in metas)
                      - set(row["issue"] for row in rows)
                  )

                  raise RuntimeError(
                      "Only "
                      + str(len(rows))
                      + " WHO issues parsed successfully. "
                      + "Refusing to publish. Missing/unparsed issues: "
                      + ", ".join(map(str, missing))
                  )

              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "source_type": row["source_type"],
                      "issue": row["issue"],
                      "parser_version": VERSION,
                  }
                  for row in rows
              ]

              payload = {
                  "source": (
                      "WHO Eastern Mediterranean Regional Office "
                      "Gaza emergency situation reports"
                  ),
                  "underlying_source": (
                      "Gaza Ministry of Health, as labelled by WHO"
                  ),
                  "method": (
                      "Issue number and date come from WHO's official report "
                      "archive. Casualty totals come only from first-page "
                      "Gaza-specific labels or the Gaza Overview block marked "
                      "'Source: Ministry of Health'. No OCR, interpolation, "
                      "nearest-number matching, or inferred totals."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS:",
                  len(public),
                  "WHO casualty points from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_who.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Expand WHO Gaza casualty timeline"
          git push
