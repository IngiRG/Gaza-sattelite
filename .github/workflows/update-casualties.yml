name: Update Gaza casualty timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests beautifulsoup4

      - name: Build casualty timeline from OCHA
        shell: bash
        run: |
          cat > /tmp/update_casualties.py <<'PY'
          from pathlib import Path
          from datetime import date, datetime, timedelta, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import re

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://www.ochaopt.org/content/"
          OUT = Path("data/casualty-timeline.json")
          VERSION = 6

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized-CasualtyTimeline/6.0",
              "Accept-Language": "en",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|"
              "August|September|October|November|December"
          )

          NUMBER_RE = re.compile(
              r"(?<![\d.])"
              r"(\d{1,3}(?:,\d{3})+|\d{3,6})"
              r"(?![\d])"
          )

          DATE_RE = re.compile(
              rf"\b(\d{{1,2}}\s+(?:{MONTHS})\s+20\d{{2}})\b",
              re.I,
          )

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def parse_num(raw):
              return int(raw.replace(",", ""))

          def fetch(url):
              try:
                  r = session.get(url, timeout=25)
                  if r.status_code == 404:
                      return None
                  r.raise_for_status()

                  soup = BeautifulSoup(r.text, "html.parser")

                  for tag in soup([
                      "script", "style", "nav", "header",
                      "footer", "form"
                  ]):
                      tag.decompose()

                  title = clean(
                      soup.title.get_text(" ", strip=True)
                      if soup.title else ""
                  )
                  text = clean(
                      soup.get_text(" ", strip=True)
                  )
                  return title, text

              except Exception as error:
                  print("FETCH FAILED", url, error)
                  return None

          def parse_page_date(title, text):
              # Prefer title / page header date.
              for haystack in (title, text[:1800]):
                  matches = list(DATE_RE.finditer(haystack))
                  if not matches:
                      continue

                  # Prefer the last date in the title/header; this avoids
                  # accidentally selecting "7 October 2023" from a sentence.
                  for m in reversed(matches):
                      raw = m.group(1)
                      try:
                          d = datetime.strptime(
                              raw, "%d %B %Y"
                          ).date()
                      except Exception:
                          continue

                      if d >= date(2023, 10, 8) and d <= date.today():
                          return d.isoformat()

              return None

          def split_chunks(text):
              # Use overlapping windows around casualty keywords rather than
              # relying on exact sentence punctuation.
              low = text.lower()
              positions = []

              for keyword in (
                  "killed",
                  "injured",
                  "fatalities",
                  "injuries",
                  "casualty toll",
                  "ministry of health",
                  "moh",
              ):
                  for m in re.finditer(keyword, low):
                      positions.append(m.start())

              windows = []

              for pos in positions:
                  start = max(0, pos - 450)
                  end = min(len(text), pos + 650)
                  chunk = clean(text[start:end])
                  if len(chunk) >= 80:
                      windows.append(chunk)

              # Deduplicate exact repeated windows.
              return list(dict.fromkeys(windows))

          def context_score(chunk):
              low = chunk.lower()
              score = 0

              if "gaza" in low:
                  score += 5

              if "ministry of health" in low or re.search(r"\bmoh\b", low):
                  score += 5

              if "palestinian" in low:
                  score += 3

              if "7 october 2023" in low:
                  score += 4

              if "since 7 october" in low:
                  score += 3

              if "between 7 october 2023 and" in low:
                  score += 4

              if "casualty toll" in low:
                  score += 2

              if "reported" in low:
                  score += 1

              # Penalize likely subgroup/incident contexts.
              penalties = (
                  "unrwa staff",
                  "staff killed",
                  "children killed",
                  "women killed",
                  "journalists killed",
                  "aid workers killed",
                  "health workers killed",
                  "israeli soldiers",
                  "hostages",
                  "west bank",
                  "east jerusalem",
                  "school was hit",
                  "single incident",
              )

              for p in penalties:
                  if p in low:
                      score -= 8

              return score

          def nearby_values(chunk, label):
              low = chunk.lower()
              out = []

              if label == "killed":
                  patterns = (
                      r"\bkilled\b",
                      r"\bfatalit(?:y|ies)\b",
                  )
              else:
                  patterns = (
                      r"\binjured\b",
                      r"\binjur(?:y|ies)\b",
                  )

              label_positions = []

              for pattern in patterns:
                  for m in re.finditer(pattern, low):
                      label_positions.append(m.start())

              if not label_positions:
                  return []

              nums = [
                  (m.start(), parse_num(m.group(1)))
                  for m in NUMBER_RE.finditer(chunk)
              ]

              for label_pos in label_positions:
                  for num_pos, value in nums:
                      distance = abs(num_pos - label_pos)

                      if distance > 180:
                          continue

                      out.append((distance, value))

              out.sort(key=lambda x: x[0])
              return out

          def pick_pair(chunk):
              score = context_score(chunk)
              if score < 6:
                  return None

              killed_candidates = nearby_values(chunk, "killed")
              injured_candidates = nearby_values(chunk, "injured")

              if not killed_candidates or not injured_candidates:
                  return None

              pairs = []

              for kd, killed in killed_candidates:
                  if not (100 <= killed <= 500000):
                      continue

                  for idist, injured in injured_candidates:
                      if not (100 <= injured <= 1000000):
                          continue

                      if injured <= killed:
                          continue

                      # Prefer close labels and large cumulative values.
                      pair_score = (
                          score * 1000
                          - kd
                          - idist
                          + min(killed, 200000) / 1000
                          + min(injured, 400000) / 1000
                      )

                      pairs.append(
                          (pair_score, killed, injured)
                      )

              if not pairs:
                  return None

              pairs.sort(reverse=True)
              best = pairs[0]

              # If top two pairs are nearly tied but disagree, reject.
              if len(pairs) > 1:
                  second = pairs[1]
                  if (
                      abs(best[0] - second[0]) < 25
                      and (best[1], best[2]) != (second[1], second[2])
                  ):
                      return None

              return {
                  "score": best[0],
                  "killed": best[1],
                  "injured": best[2],
              }

          def parse_page(url, label):
              result = fetch(url)
              if not result:
                  return None

              title, text = result
              effective = parse_page_date(title, text)
              if not effective:
                  return None

              candidates = []

              for chunk in split_chunks(text):
                  pair = pick_pair(chunk)
                  if pair:
                      pair["chunk"] = chunk
                      candidates.append(pair)

              if not candidates:
                  return None

              # Highest-confidence contextual pair wins.
              candidates.sort(
                  key=lambda row: row["score"],
                  reverse=True,
              )

              best = candidates[0]

              # Extra guard: if another high-confidence candidate on the same
              # page strongly disagrees, omit the page.
              for other in candidates[1:4]:
                  if (
                      best["score"] - other["score"] < 60
                      and (
                          best["killed"] != other["killed"]
                          or best["injured"] != other["injured"]
                      )
                  ):
                      print(
                          "AMBIGUOUS PAGE OMITTED",
                          url,
                          (best["killed"], best["injured"]),
                          (other["killed"], other["injured"]),
                      )
                      return None

              return {
                  "date": effective,
                  "killed": best["killed"],
                  "injured": best["injured"],
                  "source_url": url,
                  "series_label": label,
                  "confidence": round(best["score"], 2),
                  "parser_version": VERSION,
              }

          def targets():
              rows = []

              # Early October 2023 "Escalation..." URLs.
              for n in range(1, 40):
                  rows.append((
                      BASE
                      + "escalation-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                  ))

              # Main early-war Flash Update series.
              for n in range(1, 220):
                  rows.append((
                      BASE
                      + "hostilities-gaza-strip-and-israel-flash-update-"
                      + str(n),
                      f"Flash Update #{n}",
                  ))

              # Humanitarian Situation Updates.
              for n in range(120, 500):
                  rows.append((
                      BASE
                      + "humanitarian-situation-update-"
                      + str(n)
                      + "-gaza-strip",
                      f"Situation Update #{n}",
                  ))

              # Gaza humanitarian response reports.
              for n in range(1, 160):
                  rows.append((
                      BASE
                      + "gaza-humanitarian-response-situation-report-no-"
                      + str(n),
                      f"Gaza Humanitarian Response Report #{n}",
                  ))

              # Current date-based Situation Reports.
              current = date(2025, 10, 1)
              today = date.today()

              while current <= today:
                  slug = (
                      f"{current.day}-"
                      f"{current.strftime('%B').lower()}-"
                      f"{current.year}"
                  )

                  rows.append((
                      BASE
                      + "humanitarian-situation-report-"
                      + slug,
                      "Humanitarian Situation Report",
                  ))

                  current += timedelta(days=1)

              return rows

          def collect():
              todo = targets()

              print(
                  "Checking",
                  len(todo),
                  "possible OCHA URLs",
              )

              records = []

              with ThreadPoolExecutor(
                  max_workers=6
              ) as executor:
                  futures = {
                      executor.submit(
                          parse_page,
                          url,
                          label,
                      ): url
                      for url, label in todo
                  }

                  done = 0

                  for future in as_completed(futures):
                      done += 1

                      try:
                          row = future.result()
                      except Exception as error:
                          print(
                              "PARSE FAILED",
                              futures[future],
                              error,
                          )
                          row = None

                      if row:
                          print(
                              "FOUND",
                              row["date"],
                              row["killed"],
                              row["injured"],
                              row["series_label"],
                              "score",
                              row["confidence"],
                          )
                          records.append(row)

                      if done % 100 == 0:
                          print(
                              "Checked",
                              done,
                              "/",
                              len(todo),
                          )

              return records

          def reconcile(records):
              by_date = {}

              for row in records:
                  by_date.setdefault(
                      row["date"],
                      [],
                  ).append(row)

              selected = []

              for effective in sorted(by_date):
                  rows = by_date[effective]

                  # Group identical pairs.
                  groups = {}

                  for row in rows:
                      key = (
                          row["killed"],
                          row["injured"],
                      )
                      groups.setdefault(
                          key,
                          [],
                      ).append(row)

                  # Prefer the pair supported by the most OCHA pages on that
                  # date; confidence breaks ties.
                  ranked = sorted(
                      groups.items(),
                      key=lambda item: (
                          len(item[1]),
                          max(r["confidence"] for r in item[1]),
                      ),
                      reverse=True,
                  )

                  best_pair, best_rows = ranked[0]

                  if len(ranked) > 1:
                      second_pair, second_rows = ranked[1]

                      if (
                          len(best_rows) == len(second_rows)
                          and abs(
                              max(r["confidence"] for r in best_rows)
                              - max(r["confidence"] for r in second_rows)
                          ) < 50
                      ):
                          print(
                              "DATE CONFLICT OMITTED",
                              effective,
                              best_pair,
                              second_pair,
                          )
                          continue

                  # Prefer a Situation Update source when available.
                  best_rows.sort(
                      key=lambda row: (
                          "Situation Update"
                          not in row["series_label"]
                          and "Humanitarian Situation Report"
                          not in row["series_label"],
                          -row["confidence"],
                          row["source_url"],
                      )
                  )

                  selected.append(best_rows[0])

              # Validate cumulative progression.
              final = []

              for row in selected:
                  if final:
                      prev = final[-1]

                      if (
                          row["killed"] < prev["killed"]
                          or row["injured"] < prev["injured"]
                      ):
                          print(
                              "DECREASING POINT OMITTED",
                              row,
                          )
                          continue

                      # Reject impossible jumps likely caused by a bad match.
                      delta_days = max(
                          1,
                          (
                              datetime.fromisoformat(row["date"]).date()
                              - datetime.fromisoformat(prev["date"]).date()
                          ).days,
                      )

                      killed_jump = (
                          row["killed"] - prev["killed"]
                      )
                      injured_jump = (
                          row["injured"] - prev["injured"]
                      )

                      # These limits are deliberately very generous and only
                      # catch obvious parser mistakes.
                      if killed_jump / delta_days > 5000:
                          print(
                              "IMPOSSIBLE KILLED JUMP OMITTED",
                              row,
                          )
                          continue

                      if injured_jump / delta_days > 15000:
                          print(
                              "IMPOSSIBLE INJURED JUMP OMITTED",
                              row,
                          )
                          continue

                  final.append(row)

              return final

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              records = reconcile(
                  collect()
              )

              if not records:
                  raise RuntimeError(
                      "No reliable OCHA Gaza casualty points "
                      "were extracted."
                  )

              public = [
                  {
                      "date": row["date"],
                      "killed": row["killed"],
                      "injured": row["injured"],
                      "source_url": row["source_url"],
                      "series_label": row["series_label"],
                      "parser_version": VERSION,
                  }
                  for row in records
                  if row["date"] >= "2023-10-08"
              ]

              if not public:
                  raise RuntimeError(
                      "No records remained after validation."
                  )

              payload = {
                  "source": (
                      "UN OCHA oPt Gaza updates; Palestinian "
                      "casualty totals attributed by OCHA to "
                      "the Gaza Ministry of Health."
                  ),
                  "method": (
                      "Context-based extraction of cumulative killed/"
                      "injured pairs near Gaza/MoH casualty language, "
                      "with ambiguity, monotonicity, and jump checks."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "parser_version": VERSION,
                  "records": public,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  "SUCCESS",
                  len(public),
                  "records from",
                  public[0]["date"],
                  "through",
                  public[-1]["date"],
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_casualties.py

      - name: Commit casualty timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casualty-timeline.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gaza casualty timeline"
          git push
