name: Update OCHA humanitarian access timeline
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Discover and validate new OCHA access periods
        run: |
          python - <<'PY2'
          import json,re
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          OUT=Path("data/ocha-access-denials.json");BASE="https://www.ochaopt.org";S=requests.Session();S.headers.update({"User-Agent":"GazaTimeline-OCHA-Access/1.0","Accept-Language":"en"})
          def get(u,t=30):
              r=S.get(u,timeout=t);r.raise_for_status();return r
          data=json.loads(OUT.read_text());records=data.get("records",[]);known={(r["date"],r["url"]) for r in records};newest=max(r["date"] for r in records)
          urls=set()
          for q in ("humanitarian situation report","Gaza Humanitarian Response Situation Report","humanitarian access Gaza"):
              try:
                  s=BeautifulSoup(get(BASE+"/search?search_api_fulltext="+q.replace(" ","%20"),25).text,"html.parser")
                  for a in s.find_all("a",href=True):
                      u=urljoin(BASE,a["href"]).split("?")[0];low=u.lower()
                      if "/content/" in low and any(x in low for x in ("humanitarian-situation-report","gaza-humanitarian-response-situation-report","humanitarian-situation-update","humanitarian-access-snapshot")):urls.add(u)
              except Exception as e: print("discovery warning",e)
          today=datetime.now(timezone.utc).date()
          for dlt in range(70):
              d=today.fromordinal(today.toordinal()-dlt);urls.add(BASE+f"/content/humanitarian-situation-report-{d.day}-{d.strftime('%B').lower()}-{d.year}")
          def cnear(t,word):
              for p in (rf"\b\d{{1,3}}(?:\.\d+)?\s*(?:per cent|%)\s*\((\d{{1,4}})\)[^.{{}}]{{0,45}}?\b{word}\b",rf"\b(\d{{1,4}})\s*\([^)]*(?:per cent|%)[^)]*\)[^.{{}}]{{0,45}}?\b{word}\b",rf"\b(\d{{1,4}})\s+(?:missions?|movements?|attempts?)?\s*(?:were|was|had to be|were outright|were fully)?\s*[^.{{}}]{{0,28}}?\b{word}\b"):
                  m=re.search(p,t,re.I)
                  if m:return int(m.group(1))
          def parse(u):
              try:s=BeautifulSoup(get(u,20).text,"html.parser")
              except:return None
              title=s.find("h1").get_text(" ",strip=True) if s.find("h1") else "";whole=" ".join(s.stripped_strings)
              meta=s.find("meta",attrs={"property":"article:published_time"});pub=meta.get("content","")[:10] if meta else None
              if not pub:
                  m=re.search(r"\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b",whole,re.I)
                  if m:pub=datetime.strptime(" ".join(m.groups()),"%d %B %Y").date().isoformat()
              if not pub or pub<=newest:return None
              cand=[]
              for tag in s.find_all(["p","li"]):
                  t=" ".join(tag.stripped_strings);low=t.lower()
                  if not (80<=len(t)<=2500 and "israeli authorit" in low and "denied" in low and "facilitated" in low and any(x in low for x in ("humanitarian mission","humanitarian movement","planned aid movement","coordinate planned"))):continue
                  total=None
                  for p in (r"\bout of\s+(\d{1,4})\s+(?:planned\s+)?(?:humanitarian\s+)?(?:missions?|movements?|attempts?)",r"\bcoordinat(?:ed|e)[^.]{0,35}?(\d{1,4})\s+humanitarian\s+(?:missions?|movements?)",r"\ba total of\s+(\d{1,4})\s+humanitarian\s+(?:missions?|movements?)"):
                      m=re.search(p,t,re.I)
                      if m:total=int(m.group(1));break
                  if not total:continue
                  fac=cnear(t,"facilitated");den=cnear(t,"denied");imp=cnear(t,"impeded|impediments") or 0;can=cnear(t,"cancelled|canceled|withdrawn") or 0
                  if fac is None or den is None:continue
                  used=fac+den+imp+can
                  if used>total or (total-used)/total>.25:continue
                  cand.append({"date":pub,"label":title or pub,"period":f"Reporting period ending {pub}","scope":"Gaza Strip","total":total,"facilitated":fac,"impeded":imp,"denied":den,"cancelled":can,"other":total-used,"url":u})
              return max(cand,key=lambda x:x["total"]) if cand else None
          add=[]
          for u in sorted(urls):
              r=parse(u)
              if r and (r["date"],r["url"]) not in known:add.append(r);known.add((r["date"],r["url"]));print("VALID",r)
          if not add: print("No new comparable OCHA access periods; keeping existing file.");raise SystemExit(0)
          records.extend(add);records=sorted(records,key=lambda r:r["date"])
          for r in records:
              if r["total"]!=sum(int(r.get(k,0)) for k in ("facilitated","impeded","denied","cancelled","other")):raise RuntimeError("arithmetic validation failed")
          tmp=OUT.with_suffix(".tmp");tmp.write_text(json.dumps({"generated_at":datetime.now(timezone.utc).isoformat(),"source":"United Nations OCHA occupied Palestinian territory","method":"Comparable reporting periods only. No interpolation.","records":records},ensure_ascii=False,separators=(",",":")));json.loads(tmp.read_text());tmp.replace(OUT)
          PY2
      - name: Commit OCHA access data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ocha-access-denials.json
          git diff --cached --quiet && exit 0
          git commit -m "Update OCHA humanitarian access timeline"
          git pull --rebase origin main
          git push origin main
