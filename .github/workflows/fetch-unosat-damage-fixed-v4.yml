name: Fetch UNOSAT Gaza damage overlay

on:
  workflow_dispatch:
  schedule:
    # Run weekly, after the satellite imagery workflow.
    - cron: "20 5 * * 1"

permissions:
  contents: write

concurrency:
  group: unosat-gaza-damage
  cancel-in-progress: false

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin unzip sqlite3 build-essential git libsqlite3-dev zlib1g-dev
          python -m pip install --upgrade pip requests

      - name: Install tippecanoe
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j2
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Download latest full-Strip UNOSAT assessment
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fetch_unosat.py <<'PY'
          from __future__ import annotations
          import json, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          API="https://data.humdata.org/api/3/action/package_search"
          FALLBACK="unosat-gaza-strip-comprehensive-damage-assessment-11-october-2025"
          OUT=Path('/tmp/unosat')
          OUT.mkdir(parents=True,exist_ok=True)

          session=requests.Session()
          session.headers.update({"User-Agent":"GenocideChronicle-UNOSAT-overlay/1.0"})

          def api(params):
              r=session.get(API,params=params,timeout=90)
              r.raise_for_status()
              payload=r.json()
              if not payload.get('success'):
                  raise RuntimeError('HDX CKAN request failed')
              return payload['result']

          # Search HDX rather than hard-coding a single download URL. HDX's CKAN
          # API is designed for automated dataset discovery/download.
          query='title:"UNOSAT Gaza Strip Comprehensive Damage Assessment"'
          try:
              result=api({"q":query,"rows":100,"sort":"metadata_modified desc"})
              packages=result.get('results',[])
          except Exception as exc:
              print('HDX search failed, using known fallback:',exc,file=sys.stderr)
              packages=[]

          # Keep only Gaza Strip comprehensive assessments. This deliberately
          # excludes Gaza City-only, road-only, agricultural and corridor products.
          matches=[]
          exact_prefix='UNOSAT Gaza Strip Comprehensive Damage Assessment'
          for p in packages:
              title=(p.get('title') or '').strip()
              source=' '.join([str(p.get('dataset_source') or ''),str((p.get('organization') or {}).get('title') or '')]).lower()
              if not title.lower().startswith(exact_prefix.lower()):
                  continue
              if 'unosat' not in source and 'united nations satellite centre' not in source:
                  continue
              matches.append(p)

          if not matches:
              # package_search occasionally changes ranking/indexing. Resolve the
              # current known full-Strip assessment by its stable HDX slug.
              url=f"https://data.humdata.org/api/3/action/package_show?id={FALLBACK}"
              r=session.get(url,timeout=90); r.raise_for_status(); payload=r.json()
              if not payload.get('success'): raise RuntimeError('Fallback HDX package lookup failed')
              matches=[payload['result']]

          def title_date(p):
              title=p.get('title','')
              m=re.search(r'(\d{1,2}\s+[A-Za-z]+\s+20\d{2})',title)
              if m:
                  for fmt in ('%d %B %Y','%d %b %Y'):
                      try:return datetime.strptime(m.group(1),fmt).replace(tzinfo=timezone.utc)
                      except ValueError:pass
              for key in ('dataset_date','last_modified','metadata_modified'):
                  value=p.get(key)
                  if value:
                      try:
                          parsed=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                          # CKAN/HDX metadata is not completely consistent: some
                          # timestamps include an offset while others are naive.
                          # Normalize all of them to aware UTC datetimes before
                          # comparing candidate assessments.
                          if parsed.tzinfo is None:
                              parsed=parsed.replace(tzinfo=timezone.utc)
                          else:
                              parsed=parsed.astimezone(timezone.utc)
                          return parsed
                      except Exception:
                          pass
              return datetime.min.replace(tzinfo=timezone.utc)

          package=max(matches,key=title_date)
          resources=package.get('resources') or []

          def resource_score(r):
              text=' '.join([str(r.get('name') or ''),str(r.get('format') or ''),str(r.get('description') or ''),str(r.get('url') or '')]).lower()
              score=0
              if 'gdb' in text or 'geodatabase' in text: score+=100
              if '.zip' in text: score+=30
              if 'shp' in text or 'shapefile' in text: score+=60
              if 'geojson' in text: score+=50
              if 'pdf' in text or '.pdf' in text: score-=200
              if 'xlsx' in text or 'csv' in text: score-=50
              return score

          candidates=[r for r in resources if r.get('url') and resource_score(r)>0]
          if not candidates:
              raise RuntimeError('No downloadable geospatial resource found in selected HDX dataset')
          resource=max(candidates,key=resource_score)
          url=resource['url']
          suffix=Path(urlparse(url).path).suffix or '.zip'
          download=OUT/f"source{suffix}"
          print('Selected dataset:',package.get('title'))
          print('Selected resource:',resource.get('name'),url)
          with session.get(url,stream=True,timeout=180) as r:
              r.raise_for_status()
              with download.open('wb') as f:
                  for chunk in r.iter_content(1024*1024):
                      if chunk:f.write(chunk)

          meta={
              "dataset_name":package.get('name'),
              "dataset_title":package.get('title'),
              "assessment_date":title_date(package).date().isoformat(),
              "dataset_url":"https://data.humdata.org/dataset/"+str(package.get('name')),
              "resource_name":resource.get('name'),
              "resource_url":url,
              "license_title":package.get('license_title'),
              "dataset_source":package.get('dataset_source') or (package.get('organization') or {}).get('title'),
              "fetched_at":datetime.now(timezone.utc).isoformat(),
          }
          (OUT/'source-metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(download)
          PY
          python /tmp/fetch_unosat.py

      - name: Extract and select building-damage layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unosat/extracted
          mkdir -p /tmp/unosat/extracted

          # HDX resource URLs do not always preserve the archive's filename or
          # extension. Detect ZIP content from its bytes, then recursively unpack
          # any nested ZIPs (UNOSAT commonly distributes zipped FileGDBs).
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          root=Path('/tmp/unosat')
          out=root/'extracted'
          sources=[p for p in root.iterdir() if p.is_file() and p.name.startswith('source') and not p.name.endswith('.json')]
          if not sources:
              raise SystemExit('Downloaded UNOSAT source file was not found')
          source=sources[0]

          def unpack_or_copy(src:Path,dst:Path):
              if zipfile.is_zipfile(src):
                  with zipfile.ZipFile(src) as z:
                      z.extractall(dst)
              else:
                  shutil.copy2(src,dst/src.name)

          unpack_or_copy(source,out)

          # Some HDX resources contain another ZIP inside the outer download.
          # Keep expanding archives until none remain.
          seen=set()
          while True:
              archives=[p for p in out.rglob('*') if p.is_file() and zipfile.is_zipfile(p) and str(p) not in seen]
              if not archives:
                  break
              for archive in archives:
                  seen.add(str(archive))
                  target=archive.parent/(archive.stem+'_unzipped')
                  target.mkdir(exist_ok=True)
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(target)
                  print('Expanded nested archive:',archive)
          PY

          cat > /tmp/select_layer.py <<'PY'
          from pathlib import Path
          import json,re,subprocess

          root=Path('/tmp/unosat/extracted')

          # Treat a .gdb directory as one dataset; do not separately inspect the
          # many internal binary files that make up a File Geodatabase.
          datasets=[]
          gdb_dirs=[p for p in root.rglob('*') if p.is_dir() and p.name.lower().endswith('.gdb')]
          datasets.extend(gdb_dirs)

          inside_gdb=set()
          for gdb in gdb_dirs:
              inside_gdb.update(gdb.rglob('*'))

          for p in root.rglob('*'):
              if not p.is_file() or p in inside_gdb:
                  continue
              if p.suffix.lower() in ('.shp','.gpkg','.geojson','.json','.kml'):
                  datasets.append(p)

          if not datasets:
              sample='\n'.join(str(p) for p in list(root.rglob('*'))[:80])
              raise SystemExit('No GDAL-readable vector dataset found after extraction. Extracted files:\n'+sample)

          def inspect(ds:Path):
              # -al lets GDAL enumerate every layer using a stable "Layer name:"
              # heading, avoiding driver-specific numbered-list formatting.
              try:
                  return subprocess.check_output(
                      ['ogrinfo','-ro','-so','-al',str(ds)],
                      text=True,stderr=subprocess.STDOUT,timeout=120
                  )
              except subprocess.CalledProcessError as exc:
                  print('GDAL could not open',ds,'\n',exc.output[:1500])
                  return ''
              except Exception as exc:
                  print('GDAL inspection failed for',ds,exc)
                  return ''

          candidates=[]
          for ds in datasets:
              text=inspect(ds)
              if not text:
                  continue

              # ogrinfo -so -al output consists of one block per layer.
              chunks=re.split(r'(?=^Layer name:\s*)',text,flags=re.MULTILINE)
              found=False
              for chunk in chunks:
                  m=re.search(r'^Layer name:\s*(.+?)\s*$',chunk,re.MULTILINE)
                  if not m:
                      continue
                  found=True
                  layer=m.group(1).strip()
                  cm=re.search(r'Feature Count:\s*(\d+)',chunk)
                  count=int(cm.group(1)) if cm else 0
                  low=(layer+' '+chunk[:6000]).lower()

                  # Favor the large structure/building damage layer. UNOSAT field
                  # names vary between releases, so score names + schema together.
                  score=count
                  if 'damage' in low: score+=2_000_000
                  if 'structure' in low or 'building' in low: score+=1_500_000
                  if any(k in low for k in ('damage_gra','damagegrade','damage_grade','dmg')): score+=1_000_000
                  if any(k in low for k in ('road','agric','field','boundary','admin','governorate')): score-=2_000_000
                  if 'point' in low or 'polygon' in low: score+=100_000
                  candidates.append((score,count,str(ds),layer))

              # Single-layer formats can occasionally omit "Layer name:" in some
              # GDAL builds. Ask GDAL using the file stem as a fallback.
              if not found and ds.is_file():
                  layer=ds.stem
                  try:
                      chunk=subprocess.check_output(
                          ['ogrinfo','-ro','-so',str(ds),layer],
                          text=True,stderr=subprocess.STDOUT,timeout=120
                      )
                  except Exception:
                      continue
                  cm=re.search(r'Feature Count:\s*(\d+)',chunk)
                  count=int(cm.group(1)) if cm else 0
                  low=(layer+' '+chunk[:6000]).lower()
                  score=count
                  if 'damage' in low: score+=2_000_000
                  if 'structure' in low or 'building' in low: score+=1_500_000
                  if any(k in low for k in ('road','agric','field','boundary','admin')): score-=2_000_000
                  candidates.append((score,count,str(ds),layer))

          if not candidates:
              raise SystemExit('GDAL opened the extracted data but no vector layers could be enumerated')

          candidates.sort(reverse=True)
          print('Top candidate layers:')
          for c in candidates[:10]:
              print(' ',c)

          _,count,ds,layer=candidates[0]
          if count <= 0:
              raise SystemExit(f'Selected layer {layer!r} has no features')
          print(f'Selected {layer!r} from {ds} with {count:,} features')
          Path('/tmp/unosat/selection.json').write_text(
              json.dumps({'dataset':ds,'layer':layer,'feature_count':count},indent=2),
              encoding='utf-8'
          )
          PY
          python /tmp/select_layer.py

          DATASET=$(python -c "import json;print(json.load(open('/tmp/unosat/selection.json'))['dataset'])")
          LAYER=$(python -c "import json;print(json.load(open('/tmp/unosat/selection.json'))['layer'])")

          # Convert whatever UNOSAT published into one WGS84 newline-delimited
          # GeoJSON stream for the normalization/tile stages below.
          ogr2ogr -f GeoJSONSeq /tmp/unosat/raw.geojsonseq "$DATASET" "$LAYER" \
            -t_srs EPSG:4326 -lco RS=YES

          test -s /tmp/unosat/raw.geojsonseq
          echo "Converted selected UNOSAT layer to $(du -h /tmp/unosat/raw.geojsonseq | cut -f1) GeoJSONSeq"

      - name: Normalize and validate UNOSAT damage classification
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize.py <<'PY'
          from __future__ import annotations
          import json, re
          from collections import Counter, defaultdict
          from pathlib import Path

          src=Path('/tmp/unosat/raw.geojsonseq')
          dst=Path('/tmp/unosat/normalized.geojsonseq')
          CANON=('destroyed','severe','moderate','possible')

          def clean(v):
              return re.sub(r'[^a-z0-9]+',' ',str(v).strip().lower()).strip()

          def text_class(v):
              s=clean(v)
              if not s:
                  return None
              if 'destroyed demolition zone' in s or re.search(r'\bdestroy(?:ed)?\b|\bdestruction\b|\btotal destruction\b',s):
                  return 'destroyed'
              if re.search(r'\bsevere(?:ly)?(?: damage| damaged)?\b|\bseverely damaged\b',s):
                  return 'severe'
              if re.search(r'\bmoderate(?:ly)?(?: damage| damaged)?\b|\bmoderately damaged\b',s):
                  return 'moderate'
              if 'adjacent impact' in s or re.search(r'\bpossible(?: damage| damaged)?\b|\bpossibly damaged\b',s):
                  return 'possible'
              return None

          # UNOSAT coded-value domain used by Main_Damage_Site_Class fields.
          # 1-4 are the four standard building-damage classes. Code 8 is
          # Destroyed (Demolition Zone), and 11 is Possible Damage from an
          # adjacent impact/debris. Other codes describe non-building impacts or
          # "No Visible Damage" and therefore must not overwrite an earlier
          # documented building-damage classification.
          CODE_MAP={
              1:'destroyed',
              2:'severe',
              3:'moderate',
              4:'possible',
              8:'destroyed',
              11:'possible',
          }
          IGNORE_CODES={5,6,7,9,10,12,13}

          def numeric_code(v):
              try:
                  f=float(v)
                  return int(f) if f.is_integer() else None
              except Exception:
                  return None

          def classify_value(v):
              c=text_class(v)
              if c:
                  return c
              code=numeric_code(v)
              return CODE_MAP.get(code)

          def assessment_index(field):
              # Main_Damage_Site_Class is assessment 1; _2, _3 ... are later.
              m=re.match(r'^main[_ ]damage[_ ]site[_ ]class(?:[_ ](\d+))?$',field,re.I)
              if not m:
                  return None
              return int(m.group(1) or 1)

          field_values=defaultdict(Counter)
          fields=set()
          total_input=0
          with src.open(encoding='utf-8') as fin:
              for line in fin:
                  line=line.strip('\x1e\n\r ')
                  if not line:
                      continue
                  f=json.loads(line)
                  props=f.get('properties') or {}
                  total_input+=1
                  fields.update(map(str,props.keys()))
                  for k,v in props.items():
                      if v is not None and v!='':
                          field_values[str(k)][str(v)] += 1

          if not total_input:
              raise SystemExit('UNOSAT selected layer contained zero features')

          # Find the full sequence of UNOSAT assessment columns rather than
          # choosing one column. Newer rounds are sparse: unchanged features are
          # commonly NULL in the newest field and must inherit their most recent
          # valid earlier classification.
          class_fields=[]
          for f in fields:
              idx=assessment_index(f)
              if idx is not None:
                  class_fields.append((idx,f))
          class_fields.sort()
          if not class_fields:
              raise SystemExit('Could not find any Main_Damage_Site_Class assessment fields')

          print('UNOSAT damage assessment fields, oldest -> newest:')
          for idx,f in class_fields:
              print(f'  {idx}: {f}  values={field_values[f].most_common(12)}')

          # Locate the UNOSAT grouping field. The comprehensive layer can include
          # a small number of roads, fields, greenhouses, etc.; only group 1 is
          # the building-damage population represented by the four-class legend.
          group_field=None
          for f in fields:
              n=clean(f)
              if n in ('grouped damage classes','grouped damage class'):
                  group_field=f; break
          if group_field:
              print('Building-group field:',group_field,field_values[group_field].most_common(20))
          else:
              print('WARNING: Grouped_Damage_Classes field not found; no group filter will be applied')

          def is_building_group(v):
              if group_field is None:
                  return True
              if v is None or v=='':
                  return False
              code=numeric_code(v)
              if code is not None:
                  return code==1
              s=clean(v)
              return ('damaged building' in s) or s in ('building','buildings')

          out_counts=Counter()
          source_field_counts=Counter()
          ignored_latest=Counter()
          unclassified_examples=Counter()
          building_total=0
          written=0

          with src.open(encoding='utf-8') as fin,dst.open('w',encoding='utf-8') as fout:
              for line in fin:
                  line=line.strip('\x1e\n\r ')
                  if not line:
                      continue
                  feature=json.loads(line)
                  props=feature.get('properties') or {}

                  if not is_building_group(props.get(group_field) if group_field else None):
                      continue
                  building_total+=1

                  cls=None
                  chosen_raw=None
                  chosen_field=None

                  # Walk newest -> oldest. A NULL means this feature was not
                  # reclassified in that round. A code such as 6 (No Visible
                  # Damage) is not one of the four damage severities; it also
                  # does not erase a prior documented damage classification for
                  # this cumulative damage-assessment overlay.
                  for idx,fname in reversed(class_fields):
                      raw=props.get(fname)
                      if raw is None or raw=='':
                          continue
                      candidate=classify_value(raw)
                      if candidate:
                          cls=candidate
                          chosen_raw=raw
                          chosen_field=fname
                          break
                      code=numeric_code(raw)
                      ignored_latest[str(raw)] += 1

                  if cls not in CANON:
                      unclassified_examples[str([(f,props.get(f)) for _,f in class_fields if props.get(f) not in (None,'')][-4:])] += 1
                      out_counts['other']+=1
                      continue

                  feature['properties']={
                      'damage':cls,
                      'source_class':str(chosen_raw),
                      'source_field':str(chosen_field),
                  }
                  out_counts[cls]+=1
                  source_field_counts[chosen_field]+=1
                  written+=1
                  fout.write(json.dumps(feature,separators=(',',':'))+'\n')

          unclassified=building_total-written
          unclassified_rate=unclassified/max(1,building_total)
          print('Input features:',total_input)
          print('Building-group features:',building_total)
          print('Canonical class counts:',dict(out_counts))
          print('Classification source fields:',source_field_counts.most_common())
          print('Ignored non-severity values encountered while backfilling:',ignored_latest.most_common(20))
          print(f'Unclassified building records: {unclassified:,}/{building_total:,} ({unclassified_rate:.3%})')
          if unclassified_examples:
              print('Example unresolved assessment histories:',unclassified_examples.most_common(10))

          # Future schema changes must fail visibly rather than turning the map
          # gray or silently dropping a large part of Gaza.
          if building_total < 100000:
              raise SystemExit(f'Only {building_total:,} building-group features found; dataset/layer selection is probably wrong')
          if unclassified_rate > 0.01:
              raise SystemExit(f'{unclassified_rate:.2%} of building features still lack a four-class damage severity')
          missing=[c for c in CANON if out_counts[c]==0]
          if missing:
              raise SystemExit('Missing expected UNOSAT damage classes: '+', '.join(missing))

          diagnostics={
              'method':'latest_valid_class_across_assessment_fields',
              'assessment_fields':[{'index':i,'field':f} for i,f in class_fields],
              'group_field':group_field,
              'input_feature_count':total_input,
              'building_feature_count':building_total,
              'written_feature_count':written,
              'class_counts':{c:out_counts[c] for c in CANON},
              'unclassified_count':unclassified,
              'unclassified_rate':unclassified_rate,
              'classification_source_fields':dict(source_field_counts),
          }
          Path('/tmp/unosat/class-counts.json').write_text(json.dumps({c:out_counts[c] for c in CANON},indent=2))
          Path('/tmp/unosat/classification-diagnostics.json').write_text(json.dumps(diagnostics,indent=2))
          PY
          python /tmp/normalize.py

      - name: Build static PBF vector tiles
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/unosat/unosat.mbtiles
          tippecanoe \
            -o /tmp/unosat/unosat.mbtiles \
            -l unosat \
            -Z 13 -z 14 \
            --no-tile-compression \
            --drop-densest-as-needed \
            --extend-zooms-if-still-dropping \
            --include=damage \
            --include=source_class \
            --include=source_field \
            --force \
            /tmp/unosat/normalized.geojsonseq

          rm -rf unosat-damage
          mkdir -p unosat-damage
          cat > /tmp/extract_mbtiles.py <<'PY'
          import json,sqlite3
          from pathlib import Path
          db=sqlite3.connect('/tmp/unosat/unosat.mbtiles')
          out=Path('unosat-damage')
          n=0
          for z,x,tms_y,data in db.execute('select zoom_level,tile_column,tile_row,tile_data from tiles'):
              y=(1<<z)-1-tms_y
              path=out/str(z)/str(x)/f'{y}.pbf'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              n+=1
          print('Wrote',n,'vector tiles')
          PY
          python /tmp/extract_mbtiles.py

          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.load(open('/tmp/unosat/source-metadata.json'))
          sel=json.load(open('/tmp/unosat/selection.json'))
          counts=json.load(open('/tmp/unosat/class-counts.json'))
          diagnostics=json.load(open('/tmp/unosat/classification-diagnostics.json'))
          meta.update({
              'minzoom':13,'maxzoom':14,'layer':'unosat',
              'feature_count':sel['feature_count'],'class_counts':counts,
              'classification':diagnostics,
              'note':'UNOSAT satellite-derived comprehensive building-damage assessment; preliminary analysis and not field validated.'
          })
          Path('unosat-damage/metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY

      - name: Commit overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unosat-damage
          git diff --cached --quiet && exit 0
          git commit -m "Update UNOSAT Gaza damage overlay"
          git push
