name: Update UNRWA timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests

      - name: Fetch UNRWA Situation Reports
        shell: bash
        run: |
          cat > /tmp/update_unrwa.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import re
          import time
          import requests

          OUT = Path("data/unrwa-reports.json")
          VERSION = 3

          # UNRWA blocks GitHub-hosted runners with HTTP 403.
          # Jina Reader is used only to retrieve the public UNRWA pages.
          # Unlike s.jina.ai Search, r.jina.ai Reader does not require
          # the search API used in the previous workflow.
          READER = "https://r.jina.ai/"
          UNRWA_LIST = "https://www.unrwa.org/resources/reports"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized/3.0",
              "Accept": "text/plain,text/markdown,*/*",
          })

          REPORT_TITLE = re.compile(
              r"UNRWA\s+Situation\s+Report\s+#\s*(\d+)"
              r".{0,180}?"
              r"(?:Gaza|Humanitarian Crisis in the Gaza Strip|"
              r"situation in the Gaza Strip)",
              re.I | re.S,
          )

          URL_RE = re.compile(
              r"https?://(?:www\.)?unrwa\.org/resources/reports/"
              r"[^\s\)\]<>\"']+",
              re.I,
          )

          MARKDOWN_LINK_RE = re.compile(
              r"\[([^\]]*UNRWA[^\]]*Situation Report[^\]]*)\]"
              r"\((https?://(?:www\.)?unrwa\.org/resources/reports/"
              r"[^\)]+)\)",
              re.I,
          )

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def reader(url, timeout=120):
              proxy_url = READER + url
              response = session.get(proxy_url, timeout=timeout)
              response.raise_for_status()
              return response.text

          def canonical(url):
              return url.split("#", 1)[0].split("?", 1)[0].rstrip(".,;:")

          def is_gaza_title(title):
              low = title.lower()
              if "unrwa situation report" not in low:
                  return False
              return (
                  "gaza" in low
                  or "humanitarian crisis in the gaza strip" in low
                  or "situation in the gaza strip" in low
              )

          def extract_links(text):
              found = {}

              # Best case: markdown title + URL stay paired.
              for title, url in MARKDOWN_LINK_RE.findall(text):
                  title = clean(title)
                  if not is_gaza_title(title):
                      continue
                  m = re.search(
                      r"Situation\s+Report\s+#\s*(\d+)",
                      title,
                      re.I,
                  )
                  if not m:
                      continue
                  found[int(m.group(1))] = canonical(url)

              # Fallback: associate each report heading with nearby URLs.
              for m in re.finditer(
                  r"UNRWA\s+Situation\s+Report\s+#\s*(\d+)"
                  r"[^\n]{0,260}",
                  text,
                  re.I,
              ):
                  number = int(m.group(1))
                  title = clean(m.group(0))
                  if not is_gaza_title(title):
                      continue

                  block = text[m.start():m.start() + 1800]
                  urls = URL_RE.findall(block)
                  if urls:
                      found.setdefault(
                          number,
                          canonical(urls[0]),
                      )

              return found

          def discover():
              found = {}
              empty_streak = 0

              # UNRWA has many report pages. Walk the archive until report #1
              # is found. Reader handles the direct UNRWA access for us.
              for page in range(0, 80):
                  url = (
                      UNRWA_LIST
                      if page == 0
                      else f"{UNRWA_LIST}?page={page}"
                  )

                  print("Reading listing page", page)

                  try:
                      text = reader(url)
                  except Exception as error:
                      print(
                          f"Listing page {page} failed: {error}"
                      )
                      empty_streak += 1
                      if empty_streak >= 5:
                          break
                      continue

                  page_found = extract_links(text)

                  if page_found:
                      found.update(page_found)
                      empty_streak = 0
                      print(
                          "Discovered report numbers:",
                          min(page_found),
                          "to",
                          max(page_found),
                      )
                  else:
                      empty_streak += 1

                  if 1 in found:
                      print("Reached Situation Report #1")
                      break

                  if page > 25 and empty_streak >= 8:
                      break

                  time.sleep(0.2)

              if not found:
                  raise RuntimeError(
                      "No Gaza UNRWA Situation Report links were "
                      "found in the UNRWA report archive through "
                      "the reader proxy."
                  )

              return found

          def report_date(text):
              patterns = [
                  (
                      r"\b(\d{1,2})\s+"
                      r"(January|February|March|April|May|June|July|"
                      r"August|September|October|November|December)"
                      r"\s+(20\d{2})\b",
                      "%d %B %Y",
                      (1, 2, 3),
                  ),
                  (
                      r"\b"
                      r"(January|February|March|April|May|June|July|"
                      r"August|September|October|November|December)"
                      r"\s+(\d{1,2}),\s+(20\d{2})\b",
                      "%B %d %Y",
                      (1, 2, 3),
                  ),
              ]

              for pattern, fmt, groups in patterns:
                  m = re.search(pattern, text, re.I)
                  if not m:
                      continue

                  raw = " ".join(
                      m.group(i)
                      for i in groups
                  )

                  try:
                      return datetime.strptime(
                          raw,
                          fmt,
                      ).date().isoformat()
                  except Exception:
                      pass

              return None

          def reporting_period(text):
              patterns = [
                  r"All information updated for\s+([^\n]{3,120})",
                  r"All information is valid as of\s+([^\n]{3,120})",
                  r"All information valid as of\s+([^\n]{3,120})",
                  r"All information from\s+([^\n]{3,120})",
                  r"Information covers the period\s+([^\n]{3,120})",
              ]

              for pattern in patterns:
                  m = re.search(pattern, text, re.I)
                  if m:
                      return clean(m.group(1))

              return None

          def chunks(text):
              return [
                  clean(part)
                  for part in re.split(
                      r"(?<=[.!?])\s+|\n+",
                      text.replace("\r", "\n"),
                  )
                  if 15 <= len(clean(part)) <= 1400
              ]

          def casualty(sentences, word):
              candidates = []

              expressions = [
                  rf"(\d[\d,]*)\s+"
                  rf"(?:Palestinians|people|persons|individuals|"
                  rf"civilians)?\s*"
                  rf"(?:have been|were|are|reportedly|reported)?\s*"
                  rf"{word}\b",
                  rf"\b{word}\b[^\d]{{0,55}}(\d[\d,]*)",
              ]

              for sentence in sentences:
                  low = sentence.lower()

                  if word not in low:
                      continue

                  if any(
                      excluded in low
                      for excluded in (
                          "unrwa staff",
                          "unrwa colleague",
                          "staff members",
                          "installation",
                          "facility",
                          "school was",
                          "school were",
                      )
                  ):
                      continue

                  if not any(
                      context in low
                      for context in (
                          "gaza",
                          "palestinian",
                          "ministry of health",
                          "moh",
                          "ocha",
                      )
                  ):
                      continue

                  for expression in expressions:
                      for match in re.finditer(
                          expression,
                          sentence,
                          re.I,
                      ):
                          value = int(
                              match.group(1).replace(",", "")
                          )
                          if value >= 100:
                              candidates.append(
                                  (value, sentence)
                              )

              if not candidates:
                  return None, None

              candidates.sort(
                  key=lambda pair: pair[0],
                  reverse=True,
              )
              return candidates[0]

          def casualty_source(sentence):
              if not sentence:
                  return None

              low = sentence.lower()

              if (
                  "ministry of health" in low
                  or "moh" in low
              ):
                  return (
                      "Gaza Ministry of Health, "
                      "as cited by UNRWA"
                  )

              if "ocha" in low:
                  return "OCHA, as cited by UNRWA"

              return "UNRWA Situation Report"

          def staff_killed(sentences):
              values = []

              for sentence in sentences:
                  low = sentence.lower()

                  if (
                      "unrwa" not in low
                      or "staff" not in low
                      or "killed" not in low
                  ):
                      continue

                  patterns = [
                      r"(\d[\d,]*)\s+(?:UNRWA\s+)?"
                      r"staff(?: members)?(?: have been| were)? killed",
                      r"(?:death toll among UNRWA staff|"
                      r"UNRWA staff killed)[^\d]{0,60}(\d[\d,]*)",
                  ]

                  for pattern in patterns:
                      m = re.search(
                          pattern,
                          sentence,
                          re.I,
                      )
                      if m:
                          values.append(
                              int(
                                  m.group(1).replace(",", "")
                              )
                          )

              return max(values) if values else None

          def sheltering(sentences):
              candidates = []

              for sentence in sentences:
                  low = sentence.lower()

                  if "shelter" not in low:
                      continue

                  if not any(
                      term in low
                      for term in (
                          "unrwa",
                          "displaced",
                          "idp",
                      )
                  ):
                      continue

                  nums = [
                      int(value.replace(",", ""))
                      for value in re.findall(
                          r"\b\d[\d,]{2,}\b",
                          sentence,
                      )
                  ]

                  if nums:
                      candidates.append(
                          (max(nums), sentence)
                      )

              if not candidates:
                  return None

              value, _ = max(
                  candidates,
                  key=lambda pair: pair[0],
              )

              return (
                  f"{value:,} people "
                  "(sheltering/displacement figure cited in report)"
              )

          def installations(sentences):
              values = []

              for sentence in sentences:
                  low = sentence.lower()

                  if "unrwa" not in low:
                      continue

                  if not (
                      "installation" in low
                      or "facilit" in low
                  ):
                      continue

                  if not any(
                      term in low
                      for term in (
                          "damage",
                          "damaged",
                          "impact",
                          "impacted",
                          "hit",
                      )
                  ):
                      continue

                  for m in re.finditer(
                      r"(\d[\d,]*)\s+(?:UNRWA\s+)?"
                      r"(?:installations|facilities)",
                      sentence,
                      re.I,
                  ):
                      values.append(
                          int(
                              m.group(1).replace(",", "")
                          )
                      )

              return max(values) if values else None

          def parse_report(number, url):
              text = reader(url)
              sentences = chunks(text)

              killed, killed_sentence = casualty(
                  sentences,
                  "killed",
              )
              injured, injured_sentence = casualty(
                  sentences,
                  "injured",
              )

              return {
                  "number": number,
                  "title": (
                      f"UNRWA Situation Report #{number}"
                  ),
                  "url": url,
                  "date": report_date(text),
                  "reporting_period": reporting_period(text),
                  "killed": killed,
                  "injured": injured,
                  "casualty_source": casualty_source(
                      killed_sentence
                      or injured_sentence
                  ),
                  "unrwa_staff_killed": staff_killed(
                      sentences
                  ),
                  "sheltering_text": sheltering(
                      sentences
                  ),
                  "installations_affected": installations(
                      sentences
                  ),
                  "scraper_version": VERSION,
              }

          def load_old():
              if not OUT.exists():
                  return {}

              try:
                  payload = json.loads(
                      OUT.read_text(encoding="utf-8")
                  )
                  return {
                      int(report["number"]): report
                      for report in payload.get(
                          "reports",
                          [],
                      )
                      if report.get("number") is not None
                  }
              except Exception:
                  return {}

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              old = load_old()
              discovered = discover()

              print(
                  f"Discovered {len(discovered)} "
                  "official Gaza report URLs."
              )

              reports = []

              for index, number in enumerate(
                  sorted(discovered),
                  start=1,
              ):
                  url = discovered[number]
                  previous = old.get(number)

                  if (
                      previous
                      and previous.get("scraper_version")
                      == VERSION
                      and previous.get("url") == url
                  ):
                      reports.append(previous)
                      continue

                  print(
                      f"Reading report #{number} "
                      f"({index}/{len(discovered)})"
                  )

                  try:
                      parsed = parse_report(
                          number,
                          url,
                      )

                      if parsed.get("date"):
                          reports.append(parsed)
                      elif previous:
                          reports.append(previous)
                      else:
                          print(
                              f"Skipping #{number}: "
                              "date could not be parsed"
                          )

                  except Exception as error:
                      print(
                          f"Report #{number} failed: {error}"
                      )

                      if previous:
                          reports.append(previous)

                  time.sleep(0.25)

              # Keep any previously parsed reports that temporarily
              # disappeared from the listing crawl.
              known_numbers = {
                  int(report["number"])
                  for report in reports
              }

              for number, previous in old.items():
                  if number not in known_numbers:
                      reports.append(previous)

              unique = {
                  int(report["number"]): report
                  for report in reports
              }

              reports = list(unique.values())
              reports.sort(
                  key=lambda report: (
                      report.get("date")
                      or "9999-12-31",
                      report["number"],
                  )
              )

              if not reports:
                  raise RuntimeError(
                      "No UNRWA reports were successfully parsed."
                  )

              payload = {
                  "source": (
                      "Official UNRWA Situation Reports"
                  ),
                  "source_index": UNRWA_LIST,
                  "transport": (
                      "Public UNRWA pages retrieved through "
                      "Jina Reader because unrwa.org returns "
                      "HTTP 403 to GitHub-hosted runners."
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "scraper_version": VERSION,
                  "reports": reports,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  f"Wrote {len(reports)} reports "
                  f"to {OUT}"
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_unrwa.py

      - name: Commit timeline data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unrwa-reports.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UNRWA Situation Report timeline"
          git push
