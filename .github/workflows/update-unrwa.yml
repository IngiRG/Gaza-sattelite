name: Update UNRWA timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install requests

      - name: Fetch UNRWA Situation Reports through reader proxy
        shell: bash
        run: |
          cat > /tmp/update_unrwa.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote
          import json
          import re
          import time
          import requests

          OUT = Path("data/unrwa-reports.json")
          VERSION = 2

          # Jina Reader/Search is used only as a transport layer because
          # unrwa.org returns HTTP 403 to GitHub-hosted runners.
          SEARCH_BASE = "https://s.jina.ai/"
          READ_BASE = "https://r.jina.ai/"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "DestructionVisualized/2.0",
              "Accept": "text/plain",
          })

          REPORT_TITLE = re.compile(
              r"UNRWA\s+Situation\s+Report\s+#\s*(\d+)",
              re.I,
          )

          UNRWA_URL = re.compile(
              r"https://www\.unrwa\.org/resources/reports/"
              r"[^\s\)\]<>]+",
              re.I,
          )

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def get_text(url, timeout=90):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r.text

          def jina_search(query):
              return get_text(
                  SEARCH_BASE + quote(query, safe=""),
                  timeout=120,
              )

          def jina_read(url):
              return get_text(
                  READ_BASE + url,
                  timeout=120,
              )

          def discover_recent():
              queries = [
                  'site:unrwa.org/resources/reports "UNRWA Situation Report #" Gaza',
                  'site:unrwa.org/resources/reports "UNRWA Situation Report" "Gaza Strip" "West Bank"',
                  'site:unrwa.org/resources/reports "Humanitarian Crisis in the Gaza Strip" UNRWA',
              ]

              found = {}

              for query in queries:
                  text = jina_search(query)

                  for url in UNRWA_URL.findall(text):
                      url = url.rstrip(".,;:")
                      around = text[max(0, text.find(url)-500):text.find(url)+500]
                      m = REPORT_TITLE.search(around)

                      if m:
                          found[int(m.group(1))] = url

                  # Search output normally includes report titles separately
                  # from URLs, so also pair report numbers with nearby links.
                  for m in REPORT_TITLE.finditer(text):
                      n = int(m.group(1))
                      block = text[m.start():m.start()+1200]
                      urls = UNRWA_URL.findall(block)

                      if urls:
                          found[n] = urls[0].rstrip(".,;:")

                  time.sleep(0.5)

              return found

          def discover_one(number):
              query = (
                  f'site:unrwa.org/resources/reports '
                  f'"UNRWA Situation Report #{number}" Gaza'
              )
              text = jina_search(query)

              # Prefer a URL whose nearby title contains this exact number.
              for m in REPORT_TITLE.finditer(text):
                  if int(m.group(1)) != number:
                      continue
                  block = text[m.start():m.start()+1500]
                  urls = UNRWA_URL.findall(block)
                  if urls:
                      return urls[0].rstrip(".,;:")

              urls = UNRWA_URL.findall(text)
              return urls[0].rstrip(".,;:") if urls else None

          def report_date(text):
              patterns = [
                  r"Published(?:\s+on)?[:\s]+(\d{1,2}\s+[A-Za-z]+\s+20\d{2})",
                  r"\b(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+"
                  r"([A-Za-z]+)\s+(\d{1,2}),\s+(20\d{2})",
                  r"\b(\d{1,2}\s+[A-Za-z]+\s+20\d{2})\b",
              ]

              for i, pattern in enumerate(patterns):
                  m = re.search(pattern, text, re.I)
                  if not m:
                      continue

                  try:
                      if i == 1:
                          raw = f"{m.group(2)} {m.group(3)} {m.group(4)}"
                          return datetime.strptime(
                              raw,
                              "%B %d %Y",
                          ).date().isoformat()
                      raw = m.group(1)
                      return datetime.strptime(
                          raw,
                          "%d %B %Y",
                      ).date().isoformat()
                  except Exception:
                      pass

              return None

          def reporting_period(text):
              patterns = [
                  r"All information updated for\s+([^\n]{3,100})",
                  r"All information valid as of\s+([^\n]{3,100})",
                  r"Information covers the period\s+([^\n]{3,100})",
              ]

              for pattern in patterns:
                  m = re.search(pattern, text, re.I)
                  if m:
                      return clean(m.group(1))

              return None

          def chunks(text):
              text = text.replace("\r", "\n")
              parts = re.split(
                  r"(?<=[.!?])\s+|\n{1,}",
                  text,
              )
              return [
                  clean(part)
                  for part in parts
                  if 15 <= len(clean(part)) <= 1200
              ]

          def casualty(sentences, word):
              matches = []

              patterns = [
                  rf"(\d[\d,]*)\s+(?:people|persons|Palestinians|individuals|civilians)?"
                  rf"\s*(?:have been|were|are|reportedly|reported)?\s*{word}\b",
                  rf"(?:{word}|number of [^\n]* {word})[^\d]{{0,50}}(\d[\d,]*)",
              ]

              for sentence in sentences:
                  low = sentence.lower()

                  if word not in low:
                      continue

                  # Exclude small subgroup counts such as UNRWA staff,
                  # shelter incidents, women/children-only figures, etc.
                  excluded = [
                      "unrwa staff",
                      "unrwa colleague",
                      "staff members",
                      "idps were",
                      "school",
                      "installation",
                      "facility",
                      "children were",
                      "women were",
                  ]
                  if any(x in low for x in excluded):
                      continue

                  # Prefer general Gaza casualty totals and their cited sources.
                  if not any(
                      x in low
                      for x in (
                          "ministry of health",
                          "moh",
                          "gaza",
                          "ocha",
                          "palestinians",
                      )
                  ):
                      continue

                  for pattern in patterns:
                      for m in re.finditer(pattern, sentence, re.I):
                          value = int(m.group(1).replace(",", ""))

                          # General cumulative Gaza totals are well above
                          # isolated incident counts after the opening days.
                          if value >= 100:
                              matches.append((value, sentence))

              if not matches:
                  return None, None

              matches.sort(key=lambda x: x[0], reverse=True)
              return matches[0]

          def staff_killed(sentences):
              values = []

              for sentence in sentences:
                  low = sentence.lower()

                  if (
                      "unrwa" not in low
                      or "staff" not in low
                      or "killed" not in low
                  ):
                      continue

                  for pattern in [
                      r"bringing the total to\s+(\d[\d,]*)\s+(?:UNRWA\s+)?(?:staff|colleagues)",
                      r"(\d[\d,]*)\s+(?:UNRWA\s+)?(?:staff|colleagues)(?: members)?(?: have been| were)? killed",
                      r"(?:UNRWA staff killed|death toll among UNRWA staff)[^\d]{0,60}(\d[\d,]*)",
                  ]:
                      m = re.search(pattern, sentence, re.I)
                      if m:
                          values.append(
                              int(m.group(1).replace(",", ""))
                          )

              return max(values) if values else None

          def sheltering(sentences):
              candidates = []

              for sentence in sentences:
                  low = sentence.lower()

                  if "shelter" not in low:
                      continue
                  if (
                      "unrwa" not in low
                      and "displaced" not in low
                      and "idp" not in low
                  ):
                      continue

                  nums = [
                      int(x.replace(",", ""))
                      for x in re.findall(
                          r"\b\d[\d,]{2,}\b",
                          sentence,
                      )
                  ]

                  if nums:
                      candidates.append(
                          (max(nums), sentence)
                      )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True,
              )

              value, sentence = candidates[0]
              return (
                  f"{value:,} people "
                  "(sheltering/displacement figure cited in report)"
              )

          def installations(sentences):
              values = []

              for sentence in sentences:
                  low = sentence.lower()

                  if "unrwa" not in low:
                      continue
                  if (
                      "installation" not in low
                      and "facilit" not in low
                  ):
                      continue
                  if not any(
                      word in low
                      for word in (
                          "damage",
                          "damaged",
                          "impact",
                          "impacted",
                          "hit",
                      )
                  ):
                      continue

                  for m in re.finditer(
                      r"(\d[\d,]*)\s+(?:UNRWA\s+)?"
                      r"(?:installations|facilities)",
                      sentence,
                      re.I,
                  ):
                      values.append(
                          int(m.group(1).replace(",", ""))
                      )

              return max(values) if values else None

          def casualty_source(sentence):
              if not sentence:
                  return None

              low = sentence.lower()

              if "ministry of health" in low or "moh" in low:
                  return "Gaza Ministry of Health, as cited by UNRWA"
              if "ocha" in low:
                  return "OCHA, as cited by UNRWA"

              return "UNRWA Situation Report"

          def parse_report(number, url):
              text = jina_read(url)

              title_match = REPORT_TITLE.search(text)
              parsed_number = (
                  int(title_match.group(1))
                  if title_match
                  else number
              )

              sentences = chunks(text)
              killed, killed_sentence = casualty(
                  sentences,
                  "killed",
              )
              injured, injured_sentence = casualty(
                  sentences,
                  "injured",
              )

              return {
                  "number": parsed_number,
                  "title": (
                      title_match.group(0)
                      if title_match
                      else f"UNRWA Situation Report #{number}"
                  ),
                  "url": url,
                  "date": report_date(text),
                  "reporting_period": reporting_period(text),
                  "killed": killed,
                  "injured": injured,
                  "casualty_source": casualty_source(
                      killed_sentence or injured_sentence
                  ),
                  "unrwa_staff_killed": staff_killed(sentences),
                  "sheltering_text": sheltering(sentences),
                  "installations_affected": installations(sentences),
                  "scraper_version": VERSION,
              }

          def load_old():
              if not OUT.exists():
                  return {}

              try:
                  data = json.loads(
                      OUT.read_text(encoding="utf-8")
                  )
                  return {
                      int(report["number"]): report
                      for report in data.get("reports", [])
                      if report.get("number") is not None
                  }
              except Exception:
                  return {}

          def main():
              OUT.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              old = load_old()

              print("Discovering recent official UNRWA report URLs...")
              recent = discover_recent()

              if not recent:
                  raise RuntimeError(
                      "Search proxy returned no UNRWA Situation Reports."
                  )

              latest = max(recent)
              print("Latest report number discovered:", latest)

              reports = []

              # On later runs, old parsed reports are retained. Only missing
              # report numbers are searched/fetched.
              for number in range(1, latest + 1):
                  existing = old.get(number)

                  if (
                      existing
                      and existing.get("scraper_version") == VERSION
                  ):
                      reports.append(existing)
                      continue

                  url = recent.get(number)

                  if not url:
                      print(f"Searching for report #{number}")
                      try:
                          url = discover_one(number)
                      except Exception as error:
                          print(
                              f"Search failed for #{number}: {error}"
                          )
                          url = None

                  if not url:
                      if existing:
                          reports.append(existing)
                      else:
                          print(
                              f"No official URL found for report #{number}"
                          )
                      continue

                  print(
                      f"Reading report #{number}: {url}"
                  )

                  try:
                      parsed = parse_report(number, url)

                      if parsed.get("date"):
                          reports.append(parsed)
                      elif existing:
                          reports.append(existing)
                      else:
                          print(
                              f"Could not determine date for #{number}"
                          )
                  except Exception as error:
                      print(
                          f"Could not read report #{number}: {error}"
                      )

                      if existing:
                          reports.append(existing)

                  time.sleep(0.35)

              # Some report-number gaps can exist in the site's archive.
              unique = {
                  int(report["number"]): report
                  for report in reports
                  if report.get("number") is not None
              }

              final_reports = list(unique.values())
              final_reports.sort(
                  key=lambda r: (
                      r.get("date") or "9999-12-31",
                      r["number"],
                  )
              )

              if not final_reports:
                  raise RuntimeError(
                      "No reports could be parsed."
                  )

              payload = {
                  "source": "UNRWA official Situation Reports",
                  "transport": (
                      "UNRWA pages read through Jina Reader because "
                      "unrwa.org blocks GitHub-hosted runners"
                  ),
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "scraper_version": VERSION,
                  "reports": final_reports,
              }

              OUT.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print(
                  f"Wrote {len(final_reports)} reports to {OUT}"
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/update_unrwa.py

      - name: Commit timeline data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unrwa-reports.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UNRWA Situation Report timeline"
          git push
