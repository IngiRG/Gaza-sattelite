name: Update UCDP attacks by Israel map

on:
  workflow_dispatch:
  schedule:
    - cron: "40 13 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader
        run: pip install requests beautifulsoup4

      - name: Build conservative UCDP attacks-by-Israel timeline
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          START = "2023-10-07"
          DOWNLOADS = "https://ucdp.uu.se/downloads/"
          HISTORY = "https://ucdp.uu.se/downloads/olddw.html"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "GazaTimeline-UCDP-PublicDownloads/4.0",
              "Accept": "*/*",
          })

          # Explicit Israeli/IDF subject.
          ACTOR = (
              r"(?:"
              r"Israeli\s+(?:forces?|military|army|troops?|soldiers?|"
              r"air\s*force|aircraft|warplanes?|jets?|drones?|navy|artillery)|"
              r"Israel(?:'s)?\s+(?:forces?|military|army|air\s*force|"
              r"aircraft|warplanes?|jets?|drones?|navy|artillery)|"
              r"IDF"
              r")"
          )

          # Attack verb/action after the Israeli actor.
          ACTION = (
              r"(?:"
              r"attack(?:ed|s|ing)?|"
              r"strike|strikes|struck|"
              r"bomb(?:ed|ing|s)?|bombard(?:ed|ment|ments|ing)?|"
              r"shell(?:ed|ing|s)?|"
              r"raid(?:ed|s|ing)?|"
              r"shot|shoot(?:s|ing)?|"
              r"fire(?:d|s|ing)?\s+(?:at|on|toward|towards)|"
              r"launched?\s+(?:a\s+)?(?:missile|missiles|strike|strikes|attack|attacks)|"
              r"carried\s+out\s+(?:a\s+)?(?:strike|attack|raid|bombardment)|"
              r"conducted\s+(?:a\s+)?(?:strike|attack|raid|bombardment)"
              r")"
          )

          # Subject-before-action: strongest active-voice evidence.
          ACTIVE = re.compile(
              rf"\b{ACTOR}\b.{{0,140}}\b{ACTION}\b",
              re.I | re.S,
          )

          # Passive voice where Israeli actor is explicitly introduced by "by".
          PASSIVE = re.compile(
              rf"\b(?:"
              r"attacked|struck|bombed|bombarded|shelled|raided|shot"
              rf")\b.{{0,100}}\bby\s+{ACTOR}\b",
              re.I | re.S,
          )

          # Strong noun phrases encoding Israeli authorship directly.
          ATTRIBUTED_NOUN = re.compile(
              r"\b(?:"
              r"Israeli|Israel(?:'s)?|IDF"
              r")\s+(?:"
              r"air[\s-]?strike|air[\s-]?raid|drone[\s-]?strike|"
              r"artillery\s+(?:strike|shelling)|missile\s+strike|"
              r"naval\s+(?:strike|shelling)|military\s+strike|"
              r"bombardment|shelling|raid|attack"
              r")s?\b",
              re.I,
          )

          # Explicit patterns indicating Israel is the object/target.
          TARGET_ISRAEL = re.compile(
              r"\b(?:"
              r"attack(?:ed|s|ing)?|strike|strikes|struck|"
              r"rocket(?:s)?\s+(?:at|toward|towards)|"
              r"missile(?:s)?\s+(?:at|toward|towards)|"
              r"fire(?:d)?\s+(?:at|toward|towards)"
              r")\s+(?:on\s+|against\s+|at\s+|toward\s+|towards\s+)?"
              r"(?:Israel|Israeli\s+(?:territory|forces?|soldiers?|towns?|cities|communities))\b",
              re.I,
          )

          def fetch_text(url):
              r=session.get(url,timeout=90)
              r.raise_for_status()
              return r.text

          def download_bytes(url):
              r=session.get(url,timeout=180)
              r.raise_for_status()
              if len(r.content)<100:
                  raise RuntimeError(f"Suspiciously small download: {url}")
              return r.content

          def version_tuple(text):
              return tuple(int(n) for n in re.findall(r"\d+",text))

          def discover_downloads():
              annual=[]
              candidates=[]

              for page in (DOWNLOADS,HISTORY):
                  soup=BeautifulSoup(fetch_text(page),"html.parser")

                  for a in soup.find_all("a",href=True):
                      href=urljoin(page,a["href"])
                      low=href.lower()

                      if re.search(r"/downloads/ged/ged\d+-csv\.zip$",low):
                          annual.append(href)

                      if re.search(r"/downloads/candidateged/gedevent_v26_0_\d+\.csv$",low):
                          candidates.append(href)

              annual=sorted(set(annual),key=version_tuple,reverse=True)
              candidates=sorted(set(candidates),key=version_tuple)

              if not annual:
                  annual=["https://ucdp.uu.se/downloads/ged/ged261-csv.zip"]

              if not candidates:
                  candidates=[
                      "https://ucdp.uu.se/downloads/candidateged/GEDEvent_v26_0_6.csv"
                  ]

              return annual[0],candidates

          def decode(data):
              for enc in ("utf-8-sig","utf-8","latin-1"):
                  try:return data.decode(enc)
                  except UnicodeDecodeError:pass
              return data.decode("utf-8",errors="replace")

          def csv_rows(data):
              text=decode(data)
              try:
                  dialect=csv.Sniffer().sniff(text[:10000],delimiters=",;\t")
              except Exception:
                  dialect=csv.excel
              return list(csv.DictReader(io.StringIO(text),dialect=dialect))

          def annual_rows(url):
              with zipfile.ZipFile(io.BytesIO(download_bytes(url))) as z:
                  names=[
                      n for n in z.namelist()
                      if n.lower().endswith(".csv") and not n.startswith("__MACOSX")
                  ]
                  if not names:
                      raise RuntimeError("No CSV inside annual GED ZIP")
                  names.sort(key=lambda n:z.getinfo(n).file_size,reverse=True)
                  print("Annual CSV:",names[0])
                  return csv_rows(z.read(names[0]))

          def first(row,*names):
              for name in names:
                  value=row.get(name)
                  if value not in (None,""):
                      return value

              lookup={str(k).lower():v for k,v in row.items()}

              for name in names:
                  value=lookup.get(name.lower())
                  if value not in (None,""):
                      return value

              return None

          def number(v,default=None):
              try:return float(v)
              except:return default

          def integer(v,default=0):
              try:return int(float(v))
              except:return default

          def event_date(row):
              raw=str(first(row,"date_start","date","date_end") or "")

              m=re.search(r"\b20\d{2}-\d{2}-\d{2}\b",raw)
              if m:
                  return m.group(0)

              m=re.search(r"\b(\d{1,2})/(\d{1,2})/(20\d{2})\b",raw)
              if m:
                  return f"{m.group(3)}-{int(m.group(2)):02d}-{int(m.group(1)):02d}"

              return None

          def israel_in_conflict(row):
              text=" | ".join(
                  str(first(row,f) or "")
                  for f in ("side_a","side_b","dyad_name","conflict_name")
              )
              return bool(re.search(r"\bGovernment of Israel\b",text,re.I))

          def metadata(row):
              return " | ".join(
                  str(first(row,f) or "")
                  for f in (
                      "source_article",
                      "source_headline",
                      "source_original",
                      "where_description",
                  )
              )

          def explicitly_by_israel(row):
              text=metadata(row)

              # If the same text clearly describes Israel as the target and
              # does not independently contain an explicit Israeli-attributed
              # attack phrase, reject.
              positive=bool(
                  ACTIVE.search(text)
                  or PASSIVE.search(text)
                  or ATTRIBUTED_NOUN.search(text)
              )

              if not positive:
                  return False

              if TARGET_ISRAEL.search(text):
                  # Retain only when the positive attribution appears in a
                  # different local clause; easiest conservative rule is to
                  # reject the ambiguous record entirely.
                  return False

              return True

          def normalize(row,label):
              lat=number(first(row,"latitude","lat"))
              lon=number(first(row,"longitude","lon"))
              date=event_date(row)

              if lat is None or lon is None or not date:
                  return None

              return {
                  "id":str(first(row,"id") or ""),
                  "relid":first(row,"relid"),
                  "date":date,
                  "date_end":first(row,"date_end"),
                  "lat":lat,
                  "lon":lon,
                  "location":first(row,"where_coordinates") or first(row,"where_description"),
                  "country":first(row,"country"),
                  "where_prec":integer(first(row,"where_prec"),None),
                  "date_prec":integer(first(row,"date_prec"),None),
                  # Retained only as UCDP metadata for a popup if needed.
                  # It is NOT summed into a site-wide casualty statistic.
                  "best":integer(first(row,"best"),0),
                  "side_a":first(row,"side_a"),
                  "side_b":first(row,"side_b"),
                  "dataset":label,
              }

          annual_url,candidate_urls=discover_downloads()
          sources=[("UCDP GED annual",annual_rows(annual_url))]

          for url in candidate_urls:
              try:
                  sources.append((
                      "UCDP Candidate "+url.rsplit("/",1)[-1],
                      csv_rows(download_bytes(url))
                  ))
              except Exception as error:
                  print("Candidate failed:",url,error)

          collected={}
          scanned=0
          actor_events=0
          explicit_events=0

          for label,rows in sources:
              kept=0

              for row in rows:
                  scanned+=1
                  date=event_date(row)

                  if not date or date<START:
                      continue

                  if not israel_in_conflict(row):
                      continue

                  actor_events+=1

                  if not explicitly_by_israel(row):
                      continue

                  explicit_events+=1

                  item=normalize(row,label)
                  if not item:
                      continue

                  key=item.get("relid") or (
                      f"{item['date']}|{item['lat']:.5f}|{item['lon']:.5f}|"
                      f"{item.get('side_a')}|{item.get('side_b')}"
                  )

                  collected[key]=item
                  kept+=1

              print(label,"rows:",len(rows),"explicit attacks by Israel:",kept)

          events=sorted(
              collected.values(),
              key=lambda e:(e["date"],e.get("relid") or "",e.get("id") or "")
          )

          if not events:
              raise RuntimeError(
                  "Strict attacks-by-Israel classifier produced zero events."
              )

          output={
              "source":"Uppsala Conflict Data Program (UCDP) public downloads",
              "license":"CC BY 4.0",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "start_date":START,
              "method":{
                  "direction":"Only records whose UCDP text explicitly attributes the attack to Israeli/IDF forces are retained.",
                  "target_exclusion":"Records whose text clearly describes Israel as the target are rejected.",
                  "warning":"UCDP has no universal event-level attacker field. Ambiguous events are deliberately omitted, so this is not a complete census of Israeli attacks."
              },
              "scanned_records":scanned,
              "events_with_israel_actor":actor_events,
              "explicit_attacks_by_israel":len(events),
              "events":events
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/ucdp-attacks.json").write_text(
              json.dumps(output,ensure_ascii=False,separators=(",",":")),
              encoding="utf-8"
          )

          print(
              f"SUCCESS: {len(events)} explicitly attributed attacks by Israel, "
              f"{events[0]['date']} through {events[-1]['date']}"
          )
          PY

      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucdp-attacks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UCDP attacks-by-Israel map"
          git push
