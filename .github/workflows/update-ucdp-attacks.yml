name: Update UCDP attacks map

on:
  workflow_dispatch:
  schedule:
    - cron: "40 13 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader
        run: pip install requests beautifulsoup4

      - name: Build UCDP attacks timeline from public downloads
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          START = "2023-10-07"
          DOWNLOADS = "https://ucdp.uu.se/downloads/"
          HISTORY = "https://ucdp.uu.se/downloads/olddw.html"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "GazaTimeline-UCDP-PublicDownloads/3.0",
              "Accept": "*/*",
          })

          # UCDP does not encode perpetrator direction as a universal variable.
          # We therefore require explicit language in UCDP textual metadata that
          # describes Israeli forces as carrying out an attack.
          ISRAEL_SUBJECT = re.compile(
              r"\b("
              r"Israeli\s+(?:forces?|military|army|troops?|soldiers?|air\s*force|"
              r"aircraft|warplanes?|jets?|drones?|navy|artillery)|"
              r"IDF|Israel\s+(?:forces?|military|army|air\s*force|navy)"
              r")\b",
              re.I,
          )

          ATTACK_ACTION = re.compile(
              r"\b("
              r"attack(?:ed|s|ing)?|"
              r"strike|strikes|struck|"
              r"bomb(?:ed|ing|s)?|bombard(?:ed|ment|ments|ing)?|"
              r"shell(?:ed|ing|s)?|"
              r"fire(?:d|s|ing)?\s+(?:at|on|toward|towards)|"
              r"shoot(?:ing|s)?|shot|"
              r"raid(?:ed|s|ing)?|"
              r"storm(?:ed|ing)?|"
              r"drone[\s-]?(?:strike|attack)|"
              r"air[\s-]?(?:strike|raid)|"
              r"artillery\s+(?:strike|attack|fire|shelling)|"
              r"missile\s+(?:strike|attack)|"
              r"naval\s+(?:strike|attack|shelling)"
              r")\b",
              re.I,
          )

          # Strong direct phrases can be accepted without separately finding the
          # subject and verb, because the phrase itself encodes both.
          DIRECT_ISRAEL_ATTACK = re.compile(
              r"\b("
              r"Israel(?:i)?\s+(?:airstrike|air\s*strike|air\s*raid|"
              r"drone\s*strike|artillery\s*strike|shelling|bombardment|"
              r"military\s*strike|attack)|"
              r"IDF\s+(?:strike|attack|raid|shelling|bombardment)"
              r")",
              re.I,
          )

          def fetch_text(url):
              r=session.get(url,timeout=90)
              r.raise_for_status()
              return r.text

          def download_bytes(url):
              r=session.get(url,timeout=180)
              r.raise_for_status()
              if len(r.content)<100:
                  raise RuntimeError(f"Suspiciously small download: {url}")
              return r.content

          def version_tuple(text):
              return tuple(int(n) for n in re.findall(r"\d+",text))

          def discover_downloads():
              soups=[]
              for page in (DOWNLOADS,HISTORY):
                  soups.append((BeautifulSoup(fetch_text(page),"html.parser"),page))

              annual=[]
              candidates=[]

              for soup,page in soups:
                  for a in soup.find_all("a",href=True):
                      href=urljoin(page,a["href"])
                      low=href.lower()

                      if re.search(r"/downloads/ged/ged\d+-csv\.zip$",low):
                          annual.append(href)

                      if re.search(r"/downloads/candidateged/gedevent_v26_0_\d+\.csv$",low):
                          candidates.append(href)

              annual=sorted(set(annual),key=version_tuple,reverse=True)
              candidates=sorted(set(candidates),key=version_tuple)

              if not annual:
                  annual=["https://ucdp.uu.se/downloads/ged/ged261-csv.zip"]

              if not candidates:
                  candidates=[
                      "https://ucdp.uu.se/downloads/candidateged/GEDEvent_v26_0_6.csv"
                  ]

              print("Annual:",annual[0])
              print("Candidates:",*candidates,sep="\n  ")

              return annual[0],candidates

          def decode(data):
              for enc in ("utf-8-sig","utf-8","latin-1"):
                  try:return data.decode(enc)
                  except UnicodeDecodeError:pass
              return data.decode("utf-8",errors="replace")

          def csv_rows(data):
              text=decode(data)
              try:
                  dialect=csv.Sniffer().sniff(text[:10000],delimiters=",;\t")
              except Exception:
                  dialect=csv.excel
              return list(csv.DictReader(io.StringIO(text),dialect=dialect))

          def annual_rows(url):
              with zipfile.ZipFile(io.BytesIO(download_bytes(url))) as z:
                  names=[n for n in z.namelist() if n.lower().endswith(".csv") and not n.startswith("__MACOSX")]
                  if not names:raise RuntimeError("No CSV in annual GED zip")
                  names.sort(key=lambda n:z.getinfo(n).file_size,reverse=True)
                  print("Annual CSV:",names[0])
                  return csv_rows(z.read(names[0]))

          def first(row,*names):
              for name in names:
                  value=row.get(name)
                  if value not in (None,""):return value
              lookup={str(k).lower():v for k,v in row.items()}
              for name in names:
                  value=lookup.get(name.lower())
                  if value not in (None,""):return value
              return None

          def num(v,default=None):
              try:return float(v)
              except:return default

          def integer(v,default=0):
              try:return int(float(v))
              except:return default

          def event_date(row):
              raw=str(first(row,"date_start","date","date_end") or "")
              m=re.search(r"\b20\d{2}-\d{2}-\d{2}\b",raw)
              if m:return m.group(0)
              m=re.search(r"\b(\d{1,2})/(\d{1,2})/(20\d{2})\b",raw)
              if m:return f"{m.group(3)}-{int(m.group(2)):02d}-{int(m.group(1)):02d}"
              return None

          def israel_actor(row):
              text=" | ".join(str(first(row,f) or "") for f in (
                  "side_a","side_b","dyad_name","conflict_name"
              ))
              return bool(re.search(r"\bGovernment of Israel\b",text,re.I))

          def textual_metadata(row):
              fields=(
                  "source_article","source_headline","source_original",
                  "where_description"
              )
              return " | ".join(str(first(row,f) or "") for f in fields)

          def explicit_israeli_attack(row):
              text=textual_metadata(row)

              if DIRECT_ISRAEL_ATTACK.search(text):
                  return True

              # Require Israeli subject and an attack action reasonably close in
              # the same metadata text. This reduces events where Israel appears
              # only as the target/victim of the incident.
              subjects=list(ISRAEL_SUBJECT.finditer(text))
              actions=list(ATTACK_ACTION.finditer(text))

              for s in subjects:
                  for a in actions:
                      if abs(a.start()-s.start())<=180:
                          # Prefer subject before action, but allow passive phrases
                          # such as "was struck by Israeli forces".
                          window=text[max(0,min(s.start(),a.start())-80):min(len(text),max(s.end(),a.end())+80)]
                          if re.search(
                              r"(?:Israeli|IDF|Israel).{0,120}(?:attack|strike|struck|bomb|shell|raid|shot|shoot|fire|bombard)|"
                              r"(?:attack|strike|struck|bomb|shell|raid|shot|shoot|fire|bombard).{0,120}(?:by\s+)?(?:Israeli|IDF|Israel)",
                              window,re.I
                          ):
                              return True
              return False

          def normalize(row,label):
              lat=num(first(row,"latitude","lat"))
              lon=num(first(row,"longitude","lon"))
              date=event_date(row)

              if lat is None or lon is None or not date:
                  return None

              return {
                  "id":str(first(row,"id") or ""),
                  "relid":first(row,"relid"),
                  "date":date,
                  "date_end":first(row,"date_end"),
                  "lat":lat,
                  "lon":lon,
                  "location":first(row,"where_coordinates") or first(row,"where_description"),
                  "country":first(row,"country"),
                  "where_prec":integer(first(row,"where_prec"),None),
                  "date_prec":integer(first(row,"date_prec"),None),
                  "best":integer(first(row,"best"),0),
                  "deaths_civilians":integer(first(row,"deaths_civilians"),0),
                  "side_a":first(row,"side_a"),
                  "side_b":first(row,"side_b"),
                  "dataset":label,
              }

          annual_url,candidate_urls=discover_downloads()

          sources=[("UCDP GED annual",annual_rows(annual_url))]

          for url in candidate_urls:
              try:
                  sources.append((
                      "UCDP Candidate "+url.rsplit("/",1)[-1],
                      csv_rows(download_bytes(url))
                  ))
              except Exception as e:
                  print("Candidate failed:",url,e)

          collected={}
          scanned=0

          for label,rows in sources:
              kept=0

              for row in rows:
                  scanned+=1
                  date=event_date(row)

                  if not date or date<START:
                      continue
                  if not israel_actor(row):
                      continue
                  if not explicit_israeli_attack(row):
                      continue

                  item=normalize(row,label)
                  if not item:
                      continue

                  key=item.get("relid") or (
                      f"{item['date']}|{item['lat']:.5f}|{item['lon']:.5f}|"
                      f"{item.get('side_a')}|{item.get('side_b')}"
                  )

                  collected[key]=item
                  kept+=1

              print(label,"rows:",len(rows),"classified attacks:",kept)

          events=sorted(
              collected.values(),
              key=lambda e:(e["date"],e.get("relid") or "",e.get("id") or "")
          )

          if not events:
              raise RuntimeError(
                  "Attack classifier produced zero events; refusing to overwrite."
              )

          output={
              "source":"Uppsala Conflict Data Program (UCDP) public downloads",
              "license":"CC BY 4.0",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "start_date":START,
              "annual_download":annual_url,
              "candidate_downloads":candidate_urls,
              "method":{
                  "actor_filter":"Government of Israel must be coded as a UCDP conflict actor.",
                  "attack_filter":"Conservative textual classification requiring UCDP metadata to explicitly describe Israeli/IDF forces carrying out an attack/strike/shelling/bombardment/raid/shooting or related military attack.",
                  "warning":"UCDP does not provide a universal perpetrator/weapon variable. This is a classified subset of UCDP events, not a complete census of every Israeli attack."
              },
              "scanned_records":scanned,
              "classified_events":len(events),
              "events":events
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/ucdp-attacks.json").write_text(
              json.dumps(output,ensure_ascii=False,separators=(",",":")),
              encoding="utf-8"
          )

          print(
              f"SUCCESS: {len(events)} classified Israeli attack events, "
              f"{events[0]['date']} through {events[-1]['date']}"
          )
          PY

      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucdp-attacks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UCDP attacks map"
          git push
