name: Rebuild OCHA humanitarian access timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Rebuild timeline directly from OCHA
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import urljoin, quote

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://www.ochaopt.org"
          OUT = Path("data/ocha-access-denials.json")

          S = requests.Session()
          S.headers.update({
              "User-Agent": "GazaTimeline-OCHA-Access/4.0",
              "Accept-Language": "en-US,en;q=0.9",
          })

          MONTHS = (
              "January|February|March|April|May|June|July|August|"
              "September|October|November|December"
          )

          def clean(s):
              return re.sub(r"\s+", " ", (s or "").replace("\xa0", " ")).strip()

          def fetch(url, timeout=30, retries=3):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      r = S.get(url, timeout=timeout)

                      if r.status_code == 404:
                          return None

                      r.raise_for_status()
                      return r.text

                  except Exception as e:
                      last = e
                      if attempt < retries:
                          time.sleep(attempt)

              print("FETCH WARNING:", url, repr(last))
              return None

          # ------------------------------------------------------------
          # DATE: HEADER/METADATA ONLY.
          # Never search the article body for a publication date.
          # ------------------------------------------------------------
          def publication_date(soup):
              meta_specs = [
                  ("property", "article:published_time"),
                  ("name", "date"),
                  ("name", "dcterms.date"),
                  ("property", "og:published_time"),
              ]

              for attr, value in meta_specs:
                  tag = soup.find("meta", attrs={attr: value})
                  if tag and tag.get("content"):
                      raw = tag["content"]
                      m = re.search(r"(20\d{2}-\d{2}-\d{2})", raw)
                      if m:
                          return m.group(1)

              # Drupal/OCHA pages normally expose a <time> element.
              for tag in soup.find_all("time"):
                  raw = tag.get("datetime") or clean(tag.get_text(" ", strip=True))

                  m = re.search(r"(20\d{2}-\d{2}-\d{2})", raw)
                  if m:
                      return m.group(1)

                  m = re.search(
                      rf"\b(\d{{1,2}})\s+({MONTHS})\s+(20\d{{2}})\b",
                      raw,
                      re.I,
                  )
                  if m:
                      return datetime.strptime(
                          " ".join(m.groups()),
                          "%d %B %Y",
                      ).date().isoformat()

              # Final fallback: only inspect text immediately around the H1,
              # never the article body.
              h1 = soup.find("h1")
              if h1:
                  nearby = []
                  node = h1
                  for _ in range(8):
                      node = node.find_next()
                      if not node:
                          break
                      t = clean(node.get_text(" ", strip=True))
                      if t:
                          nearby.append(t)
                      if sum(map(len, nearby)) > 500:
                          break

                  header_text = " ".join(nearby)
                  m = re.search(
                      rf"\b(\d{{1,2}})\s+({MONTHS})\s+(20\d{{2}})\b",
                      header_text,
                      re.I,
                  )
                  if m:
                      return datetime.strptime(
                          " ".join(m.groups()),
                          "%d %B %Y",
                      ).date().isoformat()

                  m = re.search(
                      rf"\b(\d{{1,2}})\s+"
                      rf"(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)"
                      rf"\s+(20\d{{2}})\b",
                      header_text,
                      re.I,
                  )
                  if m:
                      return datetime.strptime(
                          " ".join(m.groups()),
                          "%d %b %Y",
                      ).date().isoformat()

              return None

          def period_from_text(text, pubdate):
              m = re.search(
                  r"\bBetween\s+(.{1,100}?)\s*,\s*"
                  r"(?:out of|the UN|UN attempted|according to)",
                  text,
                  re.I,
              )
              if m:
                  return clean(m.group(1))

              m = re.search(
                  r"\bBetween\s+(.{1,90}?)\s*,?\s+"
                  r"(?:\d{1,4}|out of)",
                  text,
                  re.I,
              )
              if m:
                  return clean(m.group(1))

              return None

          def region_from_text(text):
              low = text.lower()

              if any(x in low for x in (
                  "northern gaza",
                  "north gaza",
                  "north of wadi gaza",
                  "areas in northern gaza",
                  "missions to northern gaza",
              )):
                  return "north"

              if any(x in low for x in (
                  "southern gaza",
                  "areas in southern gaza",
                  "missions to areas in southern gaza",
                  "south of wadi gaza",
              )):
                  return "south"

              if any(x in low for x in (
                  "across the gaza strip",
                  "inside gaza",
                  "across gaza",
                  "gaza strip requiring coordination",
              )):
                  return "gaza"

              return "unknown"

          def total_count(text):
              patterns = [
                  r"\bout of\s+(?:the\s+)?(\d{1,4})\s+coordinated\s+humanitarian\s+assistance\s+missions?",
                  r"\bout of\s+(\d{1,4})\s+(?:planned\s+)?(?:aid|humanitarian)\s+(?:movements?|missions?)",
                  r"\bout of\s+(\d{1,4})\s+attempts?\s+to\s+coordinate\s+(?:planned\s+)?aid\s+movements?",
                  r"\bUN\s+attempted\s+to\s+coordinate\s+with\s+the\s+Israeli\s+authorities\s+(\d{1,4})\s+humanitarian\s+missions?",
                  r"\bUN\s+attempted\s+to\s+coordinate\s+(\d{1,4})\s+humanitarian\s+missions?",
                  r"\b(\d{1,4})\s+humanitarian\s+missions?\s+inside\s+Gaza\b",
                  r"\b(\d{1,4})\s+coordinated\s+(?:aid|humanitarian)\s+(?:movements?|missions?)",
              ]

              for pat in patterns:
                  m = re.search(pat, text, re.I)
                  if m:
                      return int(m.group(1))

              return None

          WORD_NUMBERS = {
              "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4,
              "five": 5, "six": 6, "seven": 7, "eight": 8,
              "nine": 9, "ten": 10, "eleven": 11, "twelve": 12,
              "thirteen": 13, "fourteen": 14, "fifteen": 15,
              "sixteen": 16, "seventeen": 17, "eighteen": 18,
              "nineteen": 19, "twenty": 20,
          }

          def category_count(text, labels):
              label = "(?:" + "|".join(labels) + ")"

              patterns = [
                  # 34 per cent (159) were facilitated
                  rf"\b\d{{1,3}}(?:\.\d+)?\s*(?:per cent|%)\s*"
                  rf"\((\d{{1,4}})\)[^.;:]{{0,80}}?\b{label}\b",

                  # 8 (47 per cent) were facilitated
                  rf"\b(\d{{1,4}})\s*\([^)]*(?:per cent|%)[^)]*\)"
                  rf"[^.;:]{{0,80}}?\b{label}\b",

                  # 23 were facilitated / 11 were denied
                  rf"\b(\d{{1,4}})\b[^.;:]{{0,60}}?\b{label}\b",
              ]

              for pat in patterns:
                  m = re.search(pat, text, re.I)
                  if m:
                      return int(m.group(1))

              for word, number in WORD_NUMBERS.items():
                  if re.search(
                      rf"\b{word}\b[^.;:]{{0,60}}?\b{label}\b",
                      text,
                      re.I,
                  ):
                      return number

              return None

          def parse_outcome_block(text, pubdate, inherited_period=None):
              low = text.lower()

              if "israeli authorit" not in low:
                  return None

              if "facilitated" not in low or "denied" not in low:
                  return None

              if not (
                  "humanitarian" in low
                  or "aid movement" in low
              ):
                  return None

              total = total_count(text)
              if not total:
                  return None

              facilitated = category_count(
                  text,
                  ["fully facilitated", "facilitated"],
              )
              denied = category_count(
                  text,
                  ["denied access", "denied outright", "denied"],
              )
              impeded = category_count(
                  text,
                  [
                      "approved but faced impediments",
                      "faced impediments",
                      "impeded",
                  ],
              )
              cancelled = category_count(
                  text,
                  [
                      "had to be withdrawn",
                      "withdrawn",
                      "cancelled",
                      "canceled",
                  ],
              )

              if facilitated is None or denied is None:
                  return None

              # If a category is mentioned but no number could be attached,
              # reject instead of silently treating it as zero.
              if impeded is None:
                  if "imped" in low:
                      return None
                  impeded = 0

              if cancelled is None:
                  if "cancel" in low or "withdraw" in low:
                      return None
                  cancelled = 0

              parts = facilitated + denied + impeded + cancelled

              if parts > total:
                  return None

              other = total - parts

              if other / total > 0.15:
                  return None

              return {
                  "date": pubdate,
                  "period": period_from_text(text, pubdate) or inherited_period,
                  "region": region_from_text(text),
                  "total": total,
                  "facilitated": facilitated,
                  "impeded": impeded,
                  "denied": denied,
                  "cancelled": cancelled,
                  "other": other,
              }

          def parse_page(url):
              html = fetch(url)
              if not html:
                  return []

              soup = BeautifulSoup(html, "html.parser")
              pubdate = publication_date(soup)

              if not pubdate:
                  print("SKIP NO HEADER DATE:", url)
                  return []

              # Never allow a report URL from 2024+ to acquire an October 2023
              # date from body text.
              if "humanitarian-situation-update-" in url:
                  m = re.search(r"update-(\d+)", url)
                  if m and int(m.group(1)) >= 150 and pubdate < "2024-01-01":
                      print("SKIP IMPLAUSIBLE DATE:", pubdate, url)
                      return []

              h1 = soup.find("h1")
              title = clean(h1.get_text(" ", strip=True)) if h1 else url

              paras = [
                  clean(p.get_text(" ", strip=True))
                  for p in soup.find_all(["p", "li"])
              ]
              paras = [p for p in paras if 50 <= len(p) <= 4000]

              rows = []
              last_period = None

              # Parse individual paragraphs first. This is critical for early
              # reports that list northern and southern Gaza separately.
              for p in paras:
                  explicit_period = period_from_text(p, pubdate)
                  inherited = last_period

                  row = parse_outcome_block(
                      p,
                      pubdate,
                      inherited_period=inherited,
                  )

                  if explicit_period:
                      last_period = explicit_period

                  if row:
                      row["period"] = row["period"] or last_period or (
                          f"Reporting period in report published {pubdate}"
                      )
                      rows.append(row)

              # Also parse adjacent paragraph windows for later reports where
              # cancellation is placed in the next paragraph.
              for size in (2, 3):
                  for i in range(len(paras) - size + 1):
                      joined = clean(" ".join(paras[i:i + size]))

                      row = parse_outcome_block(
                          joined,
                          pubdate,
                          inherited_period=None,
                      )

                      if row:
                          row["period"] = row["period"] or (
                              f"Reporting period in report published {pubdate}"
                          )
                          rows.append(row)

              # ------------------------------------------------------
              # Exact Gaza-wide records first.
              # ------------------------------------------------------
              gaza = [
                  r for r in rows
                  if r["region"] == "gaza"
              ]

              # ------------------------------------------------------
              # If OCHA only gives NORTH + SOUTH for the same period,
              # aggregate them. This is arithmetic derived entirely from
              # two source rows in the same OCHA report.
              # ------------------------------------------------------
              regional = [
                  r for r in rows
                  if r["region"] in ("north", "south")
              ]

              aggregated = []

              # Group by normalized period; if one adjacent regional paragraph
              # inherited the first paragraph's period, they now match.
              groups = {}

              for r in regional:
                  key = clean(r["period"]).lower()
                  groups.setdefault(key, []).append(r)

              for period_key, group in groups.items():
                  north = [
                      r for r in group
                      if r["region"] == "north"
                  ]
                  south = [
                      r for r in group
                      if r["region"] == "south"
                  ]

                  if not north or not south:
                      continue

                  # Choose largest regional total in case paragraph windows
                  # duplicate the same row.
                  n = max(north, key=lambda r: r["total"])
                  s = max(south, key=lambda r: r["total"])

                  agg = {
                      "date": pubdate,
                      "period": n["period"],
                      "region": "gaza",
                      "total": n["total"] + s["total"],
                      "facilitated": n["facilitated"] + s["facilitated"],
                      "impeded": n["impeded"] + s["impeded"],
                      "denied": n["denied"] + s["denied"],
                      "cancelled": n["cancelled"] + s["cancelled"],
                      "other": n["other"] + s["other"],
                      "derived_from_regions": ["north", "south"],
                  }

                  aggregated.append(agg)

              candidates = gaza + aggregated

              # Deduplicate numerical duplicates within the same page.
              unique = {}
              for r in candidates:
                  key = (
                      r["period"].lower(),
                      r["total"],
                      r["facilitated"],
                      r["impeded"],
                      r["denied"],
                      r["cancelled"],
                  )

                  r["label"] = title
                  r["scope"] = "Gaza Strip"
                  r["url"] = url

                  unique[key] = r

              return list(unique.values())

          # ------------------------------------------------------------
          # DISCOVER FROM OCHA ONLY.
          # No historical JSON is read.
          # ------------------------------------------------------------
          urls = set()

          queries = [
              "facilitated denied impeded Gaza humanitarian",
              "coordinated humanitarian assistance missions Gaza",
              "planned aid movements Israeli authorities Gaza",
              "humanitarian situation update Gaza",
              "Gaza humanitarian response situation report",
          ]

          for query in queries:
              for page in range(0, 15):
                  search_url = (
                      BASE
                      + "/search?search_api_fulltext="
                      + quote(query)
                      + f"&page={page}"
                  )

                  html = fetch(
                      search_url,
                      timeout=25,
                      retries=2,
                  )

                  if not html:
                      continue

                  soup = BeautifulSoup(
                      html,
                      "html.parser",
                  )

                  found = 0

                  for a in soup.find_all("a", href=True):
                      href = urljoin(
                          search_url,
                          a["href"],
                      ).split("?")[0].rstrip("/")

                      low = href.lower()

                      if (
                          BASE in href
                          and "/content/" in href
                          and any(
                              token in low
                              for token in (
                                  "humanitarian-situation-update",
                                  "humanitarian-situation-report",
                                  "gaza-humanitarian-response-situation-report",
                                  "humanitarian-access-snapshot",
                              )
                          )
                      ):
                          urls.add(href)
                          found += 1

                  if found == 0 and page >= 3:
                      break

          # URL discovery, not data seeding.
          for number in range(150, 330):
              urls.add(
                  BASE
                  + f"/content/humanitarian-situation-update-{number}-gaza-strip"
              )

          for number in range(1, 110):
              urls.add(
                  BASE
                  + f"/content/gaza-humanitarian-response-situation-report-no-{number}"
              )

          start = datetime(2026, 1, 1).date()
          today = datetime.now(timezone.utc).date()
          d = start

          while d <= today:
              urls.add(
                  BASE
                  + "/content/humanitarian-situation-report-"
                  + f"{d.day}-{d.strftime('%B').lower()}-{d.year}"
              )
              d += timedelta(days=1)

          print("Candidate OCHA URLs:", len(urls))

          extracted = []

          for i, url in enumerate(sorted(urls), start=1):
              page_rows = parse_page(url)

              for r in page_rows:
                  # Hard arithmetic validation.
                  total = r["total"]
                  parts = sum(
                      r[k]
                      for k in (
                          "facilitated",
                          "impeded",
                          "denied",
                          "cancelled",
                          "other",
                      )
                  )

                  if parts != total:
                      continue

                  extracted.append(r)

                  marker = (
                      "AGGREGATED NORTH+SOUTH"
                      if r.get("derived_from_regions")
                      else "DIRECT"
                  )

                  print(
                      "VALID",
                      marker,
                      r["date"],
                      r["total"],
                      r["facilitated"],
                      r["impeded"],
                      r["denied"],
                      r["cancelled"],
                      url,
                  )

              if i % 100 == 0:
                  print(
                      f"Scanned {i}/{len(urls)} candidate URLs"
                  )

          # ------------------------------------------------------------
          # Deduplicate repeated OCHA periods.
          # ------------------------------------------------------------
          unique = {}

          for r in extracted:
              signature = (
                  clean(r["period"]).lower(),
                  r["total"],
                  r["facilitated"],
                  r["impeded"],
                  r["denied"],
                  r["cancelled"],
              )

              old = unique.get(signature)

              # Prefer direct Gaza-wide extraction over derived N+S.
              if old is None:
                  unique[signature] = r
              elif (
                  old.get("derived_from_regions")
                  and not r.get("derived_from_regions")
              ):
                  unique[signature] = r

          records = sorted(
              unique.values(),
              key=lambda r: (
                  r["date"],
                  r["total"],
              ),
          )

          # A source outage should not erase a healthy file, but the threshold
          # is deliberately modest: reliability matters more than forcing a
          # predetermined historical record count.
          if len(records) < 8:
              raise RuntimeError(
                  f"Only {len(records)} independently validated OCHA "
                  "periods were reconstructed. Refusing to replace the "
                  "existing dataset."
              )

          for r in records:
              if r["date"] < "2024-01-01":
                  raise RuntimeError(
                      f"Implausible publication date survived validation: {r}"
                  )

              if sum(
                  r[k]
                  for k in (
                      "facilitated",
                      "impeded",
                      "denied",
                      "cancelled",
                      "other",
                  )
              ) != r["total"]:
                  raise RuntimeError(
                      f"Arithmetic validation failed: {r}"
                  )

          payload = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": (
                  "United Nations Office for the Coordination of "
                  "Humanitarian Affairs (OCHA), occupied Palestinian territory"
              ),
              "method": (
                  "Source-first rebuild. Historical and current OCHA HTML "
                  "are processed with the same parser. Publication dates come "
                  "only from page header/metadata. Direct Gaza-wide outcome "
                  "breakdowns are preferred; when an OCHA report publishes "
                  "complementary northern and southern Gaza outcome tables "
                  "for the same period, they are summed arithmetically. "
                  "No historical seed values, interpolation, carry-forward "
                  "or guessed categories are used."
              ),
              "records": records,
          }

          OUT.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          tmp = OUT.with_suffix(".tmp")

          tmp.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          check = json.loads(
              tmp.read_text(
                  encoding="utf-8"
              )
          )

          if len(check["records"]) != len(records):
              raise RuntimeError(
                  "Final JSON validation failed"
              )

          tmp.replace(OUT)

          print()
          print("VALID SOURCE-FIRST OCHA ACCESS TIMELINE")
          print("Comparable periods:", len(records))
          print("First:", records[0]["date"])
          print("Last:", records[-1]["date"])
          PY

      - name: Commit OCHA access data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ocha-access-denials.json
          git diff --cached --quiet && exit 0

          git commit -m "Rebuild OCHA humanitarian access timeline"
          git pull --rebase origin main
          git push origin main
