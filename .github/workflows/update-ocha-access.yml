name: Update OCHA humanitarian access

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Build validated OCHA access data
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          OUT=Path("data/ocha-access.json")
          S=requests.Session(); S.headers["User-Agent"]="GazaTimeline-OCHA/1.0"

          # OCHA search pages are used only to discover official report URLs.
          seeds=[
            "https://www.ochaopt.org/content/gaza-humanitarian-response-situation-report-no-69",
            "https://www.ochaopt.org/content/humanitarian-situation-report-6-march-2026",
            "https://www.ochaopt.org/content/humanitarian-situation-report-27-march-2026",
            "https://www.ochaopt.org/content/humanitarian-situation-report-1-may-2026",
            "https://www.ochaopt.org/content/humanitarian-situation-report-15-may-2026",
          ]
          # Also discover links from current OCHA content listing/search pages.
          discover=[
            "https://www.ochaopt.org/publications/situation-reports",
            "https://www.ochaopt.org/search?search_api_fulltext=humanitarian%20situation%20report",
          ]
          urls=set(seeds)
          for u in discover:
            try:
              r=S.get(u,timeout=60); r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                h=urljoin(u,a["href"])
                if "ochaopt.org/content/" in h and ("situation-report" in h or "humanitarian-response" in h):
                  urls.add(h.split("?")[0])
            except Exception as e: print("discovery warning",e)

          def val(p,text):
            m=re.search(p,text,re.I|re.S)
            return int(float(m.group(1).replace(",",""))) if m else None

          records=[]
          for url in sorted(urls):
            try:
              r=S.get(url,timeout=60); r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              text=" ".join(soup.stripped_strings)
              title=(soup.find("h1").get_text(" ",strip=True) if soup.find("h1") else url.rsplit("/",1)[-1])
              # Publication date from page metadata / title text.
              date=None
              meta=soup.find("meta",attrs={"property":"article:published_time"})
              if meta and meta.get("content"): date=meta["content"][:10]
              if not date:
                m=re.search(r"\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b",text,re.I)
                if m:
                  date=datetime.strptime(" ".join(m.groups()),"%d %B %Y").date().isoformat()
              if not date: continue

              off=val(r"([\d,.]+)\s+pallets[^.]{0,100}\boffloaded\b",text)
              col=val(r"([\d,.]+)\s+pallets[^.]{0,100}\b(?:collected|uplifted)\b",text)
              fac=val(r"(\d+)\s*(?:\([^)]*\))?\s*(?:missions?\s*)?(?:were\s+)?facilitated",text)
              den=val(r"(\d+)\s*(?:\([^)]*\))?\s*(?:missions?\s*)?(?:were\s+)?denied",text)
              imp=val(r"(\d+)\s*(?:\([^)]*\))?\s*(?:missions?\s*)?(?:were\s+)?(?:approved but )?(?:faced\s+)?impediments?",text)
              can=val(r"(\d+)\s*(?:\([^)]*\))?\s*(?:missions?\s*)?(?:were\s+)?cancelled",text)
              fuel=val(r"([\d,.]+)\s+litres?\s+of\s+(?:diesel|fuel)",text)
              if all(v is None for v in (off,col,fac,den,imp,can,fuel)): continue
              records.append({"date":date,"title":title,"url":url,"pallets_offloaded":off,"pallets_collected":col,
                "missions_facilitated":fac,"missions_denied":den,"missions_impeded":imp,"missions_cancelled":can,"fuel_litres":fuel})
            except Exception as e: print("skip",url,e)

          # Deduplicate by date/url, keep records with most populated metrics.
          best={}
          for r in records:
            score=sum(r[k] is not None for k in ("pallets_offloaded","pallets_collected","missions_facilitated","missions_denied","missions_impeded","missions_cancelled","fuel_litres"))
            key=(r["date"],r["url"])
            if key not in best or score>best[key][0]: best[key]=(score,r)
          records=sorted((x[1] for x in best.values()),key=lambda r:r["date"])

          if not records:
            if OUT.exists():
              print("No valid new OCHA records; retaining existing JSON."); raise SystemExit(0)
            raise SystemExit("No valid OCHA records and no previous file.")

          OUT.parent.mkdir(exist_ok=True)
          tmp=OUT.with_suffix(".tmp")
          tmp.write_text(json.dumps({"generated_at":datetime.now(timezone.utc).isoformat(),"source":"OCHA oPt / UN 2720","records":records},ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          json.loads(tmp.read_text()); tmp.replace(OUT)
          print("OCHA records",len(records),"through",records[-1]["date"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ocha-access.json
          git diff --cached --quiet && exit 0
          git commit -m "Update OCHA humanitarian access data"
          git pull --rebase origin main
          git push origin main
