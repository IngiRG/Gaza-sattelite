name: Update UCDP airstrike map

on:
  workflow_dispatch:
  schedule:
    - cron: "40 13 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build UCDP airstrike timeline
        env:
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          TOKEN=os.environ.get("UCDP_TOKEN","").strip()
          if not TOKEN:
              raise SystemExit("Missing GitHub secret UCDP_TOKEN. Request a free token from UCDP, then add it under repository Settings > Secrets and variables > Actions.")

          API="https://ucdpapi.pcr.uu.se/api/gedevents"
          START="2023-10-07"

          # Stable annual GED covers through 2025; Candidate adds the latest 2026 release.
          SOURCES=[
              ("GED 26.1","26.1",START,"2025-12-31"),
              ("Candidate 26.0.6","26.0.6","2026-01-01","2026-12-31"),
          ]

          # UCDP GED does NOT code weapon/attack type. We deliberately classify only
          # records whose UCDP source metadata contains explicit aerial-strike wording.
          AIR_RE=re.compile(
              r"\b("
              r"air[\s-]?strike(?:s)?|"
              r"air[\s-]?raid(?:s)?|"
              r"aerial\s+(?:strike|attack|raid|bombardment)(?:s)?|"
              r"drone[\s-]?(?:strike|attack)(?:s)?|"
              r"warplane(?:s)?\s+(?:struck|bombed|attacked)|"
              r"fighter[\s-]?jet(?:s)?\s+(?:struck|bombed|attacked)|"
              r"bombed\s+from\s+the\s+air"
              r")\b", re.I
          )

          def get_page(version,start,end,page):
              params=urllib.parse.urlencode({
                  "pagesize":1000,
                  "page":page,
                  "StartDate":start,
                  "EndDate":end,
              })
              req=urllib.request.Request(
                  f"{API}/{version}?{params}",
                  headers={"x-ucdp-access-token":TOKEN,"Accept":"application/json","User-Agent":"GazaTimeline-UCDP/1.0"}
              )
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.load(r)

          def israel_actor(row):
              text=" | ".join(str(row.get(k) or "") for k in ("side_a","side_b","dyad_name","conflict_name"))
              # Restrict to Government of Israel as a conflict actor, not mere mentions in sources.
              return bool(re.search(r"\bGovernment of Israel\b",text,re.I))

          def explicit_air(row):
              text=" | ".join(str(row.get(k) or "") for k in (
                  "source_article","source_headline","source_original","where_description"
              ))
              return bool(AIR_RE.search(text))

          def normalize(row,dataset):
              return {
                  "id":str(row.get("id","")),
                  "relid":row.get("relid"),
                  "date":row.get("date_start") or row.get("date_end"),
                  "date_end":row.get("date_end"),
                  "lat":row.get("latitude"),
                  "lon":row.get("longitude"),
                  "location":row.get("where_coordinates") or row.get("where_description"),
                  "country":row.get("country"),
                  "where_prec":row.get("where_prec"),
                  "date_prec":row.get("date_prec"),
                  "best":row.get("best") or 0,
                  "deaths_civilians":row.get("deaths_civilians") or 0,
                  "side_a":row.get("side_a"),
                  "side_b":row.get("side_b"),
                  "dataset":dataset,
              }

          collected={}
          scanned=0

          for label,version,start,end in SOURCES:
              page=1
              while True:
                  data=get_page(version,start,end,page)
                  rows=data.get("Result",[])
                  scanned += len(rows)
                  for row in rows:
                      if not israel_actor(row):
                          continue
                      if not explicit_air(row):
                          continue
                      if row.get("latitude") is None or row.get("longitude") is None:
                          continue
                      item=normalize(row,label)
                      key=item.get("relid") or f"{label}:{item['id']}"
                      collected[key]=item

                  total_pages=int(data.get("TotalPages") or 1)
                  print(f"{label}: page {page}/{total_pages}, classified {len(collected)}")
                  if page>=total_pages:
                      break
                  page += 1
                  time.sleep(.08)

          events=sorted(collected.values(),key=lambda x:(x.get("date") or "",x.get("id") or ""))
          if not events:
              raise RuntimeError("Classifier produced zero events. Refusing to overwrite existing map data.")

          out={
              "source":"Uppsala Conflict Data Program (UCDP)",
              "license":"CC BY 4.0",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "start_date":START,
              "method":{
                  "actor_filter":"Government of Israel must be a UCDP conflict actor (side_a/side_b/dyad/conflict field).",
                  "airstrike_filter":"Conservative keyword classification of UCDP source_article/source_headline/source_original/where_description.",
                  "warning":"UCDP does not contain a dedicated weapon-type field. These are UCDP events explicitly described with aerial-strike terminology, not a complete census of Israeli airstrikes or munitions."
              },
              "scanned_records":scanned,
              "classified_events":len(events),
              "events":events
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/ucdp-airstrikes.json").write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Wrote {len(events)} classified events")
          PY

      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucdp-airstrikes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UCDP airstrike map"
          git push
