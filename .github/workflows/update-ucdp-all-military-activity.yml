name: Update UCDP military activity map

on:
  workflow_dispatch:
  schedule:
  - cron: "40 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build all Israeli-involved UCDP events
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          START = "2023-10-07"
          DOWNLOADS = "https://ucdp.uu.se/downloads/"

          GED_FALLBACK = (
              "https://ucdp.uu.se/downloads/ged/"
              "ged261-csv.zip"
          )

          CANDIDATE_FALLBACK = (
              "https://ucdp.uu.se/downloads/candidateged/"
              "GEDEvent_v26_01_26_06.csv"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "GazaTimeline-UCDP-AllIsraeliActivity/2.0",
              "Accept": "*/*",
          })

          def get(url, timeout=180):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r

          def version_key(url):
              name = url.rsplit("/",1)[-1]
              m = re.search(
                  r"GEDEvent_v(\d+)_01_\d+_(\d+)\.csv",
                  name,
                  re.I,
              )
              if m:
                  return (
                      int(m.group(1)),
                      int(m.group(2)),
                  )
              return (0,0)

          def discover_current_files():
              """
              Discover current GED and newest cumulative Candidate release.
              Any future 26.01.26.07, 26.01.26.08, etc. is automatically chosen.
              """
              ged = GED_FALLBACK
              candidates = []

              try:
                  soup = BeautifulSoup(
                      get(DOWNLOADS,90).text,
                      "html.parser",
                  )

                  for a in soup.find_all(
                      "a",
                      href=True,
                  ):
                      href = urljoin(
                          DOWNLOADS,
                          a["href"],
                      )

                      low = href.lower()

                      if re.search(
                          r"/downloads/ged/ged\d+-csv\.zip$",
                          low,
                      ):
                          # Current page normally exposes only newest GED.
                          ged = href

                      if re.search(
                          r"/downloads/candidateged/"
                          r"gedevent_v26_01_26_\d+\.csv$",
                          low,
                      ):
                          candidates.append(
                              href
                          )

              except Exception as error:
                  print(
                      "WARNING: discovery failed:",
                      error,
                  )

              candidate = (
                  max(
                      candidates,
                      key=version_key,
                  )
                  if candidates
                  else CANDIDATE_FALLBACK
              )

              return (
                  ged,
                  candidate,
              )

          def decode(data):
              for enc in (
                  "utf-8-sig",
                  "utf-8",
                  "latin-1",
              ):
                  try:
                      return data.decode(
                          enc
                      )
                  except UnicodeDecodeError:
                      pass

              return data.decode(
                  "utf-8",
                  errors="replace",
              )

          def rows_from_csv(data):
              text = decode(data)

              try:
                  dialect = csv.Sniffer().sniff(
                      text[:12000],
                      delimiters=",;\t",
                  )
              except Exception:
                  dialect = csv.excel

              return list(
                  csv.DictReader(
                      io.StringIO(text),
                      dialect=dialect,
                  )
              )

          def load_ged(url):
              with zipfile.ZipFile(
                  io.BytesIO(
                      get(url).content
                  )
              ) as z:
                  names = [
                      n
                      for n in z.namelist()
                      if (
                          n.lower().endswith(".csv")
                          and not n.startswith("__MACOSX")
                      )
                  ]

                  if not names:
                      raise RuntimeError(
                          "No CSV inside GED ZIP."
                      )

                  names.sort(
                      key=lambda n: (
                          z.getinfo(n).file_size
                      ),
                      reverse=True,
                  )

                  print(
                      "GED CSV:",
                      names[0],
                  )

                  return rows_from_csv(
                      z.read(names[0])
                  )

          def norm_key(key):
              if key is None:
                  return ""

              key = str(key)
              key = key.replace("\ufeff", "")
              key = key.strip().lower()
              key = re.sub(r"[\s\-]+", "_", key)
              key = re.sub(r"[^a-z0-9_]", "", key)
              return key

          def first(row,*names):
              # Exact lookup first.
              for name in names:
                  value = row.get(name)

                  if value not in (
                      None,
                      "",
                  ):
                      return value

              # Candidate releases occasionally vary in whitespace/BOM/header
              # formatting, so normalize both requested and actual keys.
              lookup = {}

              for key,value in row.items():
                  if key is None:
                      continue

                  nk = norm_key(key)

                  if nk and value not in (
                      None,
                      "",
                  ):
                      lookup[nk] = value

              for name in names:
                  value = lookup.get(
                      norm_key(name)
                  )

                  if value not in (
                      None,
                      "",
                  ):
                      return value

              return None

          def clean_number(v):
              if v in (
                  None,
                  "",
              ):
                  return None

              if isinstance(
                  v,
                  (int,float),
              ):
                  return float(v)

              text_value = str(v).strip()

              # Decimal-comma fallback for quoted geographic values.
              if (
                  "," in text_value
                  and "." not in text_value
                  and text_value.count(",") == 1
              ):
                  text_value = text_value.replace(
                      ",",
                      ".",
                  )

              match = re.search(
                  r"[-+]?\d+(?:\.\d+)?",
                  text_value,
              )

              if not match:
                  return None

              try:
                  return float(
                      match.group(0)
                  )
              except Exception:
                  return None

          def integer(v,default=None):
              value = clean_number(v)

              if value is None:
                  return default

              try:
                  return int(value)
              except Exception:
                  return default

          def number(v,default=None):
              value = clean_number(v)

              if value is None:
                  return default

              return value

          def event_date(row):
              raw = str(
                  first(
                      row,
                      "date_start",
                      "date",
                      "date_end",
                  )
                  or ""
              )

              m = re.search(
                  r"\b20\d{2}-\d{2}-\d{2}\b",
                  raw,
              )

              if m:
                  return m.group(0)

              m = re.search(
                  r"\b(\d{1,2})/"
                  r"(\d{1,2})/"
                  r"(20\d{2})\b",
                  raw,
              )

              if m:
                  return (
                      f"{m.group(3)}-"
                      f"{int(m.group(2)):02d}-"
                      f"{int(m.group(1)):02d}"
                  )

              return None

          # --------------------------------------------------
          # LEARN ISRAEL'S UCDP ACTOR IDS FROM ANNUAL GED
          # --------------------------------------------------

          ID_FIELDS_A = (
              "side_a_new_id",
              "side_a_dset_id",
              "side_a_id",
          )

          ID_FIELDS_B = (
              "side_b_new_id",
              "side_b_dset_id",
              "side_b_id",
          )

          def learn_israel_ids(rows):
              ids = set()

              for row in rows:
                  side_a = str(
                      first(
                          row,
                          "side_a",
                      )
                      or ""
                  )

                  side_b = str(
                      first(
                          row,
                          "side_b",
                      )
                      or ""
                  )

                  if re.search(
                      r"\bGovernment of Israel\b",
                      side_a,
                      re.I,
                  ):
                      for field in ID_FIELDS_A:
                          value = first(
                              row,
                              field,
                          )

                          if value not in (
                              None,
                              "",
                          ):
                              ids.add(
                                  str(value).strip()
                              )

                  if re.search(
                      r"\bGovernment of Israel\b",
                      side_b,
                      re.I,
                  ):
                      for field in ID_FIELDS_B:
                          value = first(
                              row,
                              field,
                          )

                          if value not in (
                              None,
                              "",
                          ):
                              ids.add(
                                  str(value).strip()
                              )

              return ids

          def israel_related(
              row,
              israel_ids,
          ):
              side_a = str(
                  first(
                      row,
                      "side_a",
                  )
                  or ""
              )

              side_b = str(
                  first(
                      row,
                      "side_b",
                  )
                  or ""
              )

              dyad = str(
                  first(
                      row,
                      "dyad_name",
                      "conflict_name",
                  )
                  or ""
              )

              # Name match.
              if re.search(
                  r"\bGovernment of Israel\b",
                  f"{side_a} | {side_b} | {dyad}",
                  re.I,
              ):
                  return True

              # ID match learned from annual GED.
              row_ids = set()

              for field in (
                  *ID_FIELDS_A,
                  *ID_FIELDS_B,
              ):
                  value = first(
                      row,
                      field,
                  )

                  if value not in (
                      None,
                      "",
                  ):
                      row_ids.add(
                          str(value).strip()
                      )

              return bool(
                  row_ids
                  & israel_ids
              )

          # --------------------------------------------------
          # DIRECTION LABELS — LABEL, DO NOT FILTER
          # --------------------------------------------------

          ISRAEL_ACTOR = (
              r"(?:"
              r"Israeli\s+(?:forces?|military|army|troops?|"
              r"soldiers?|air\s*force|aircraft|warplanes?|"
              r"jets?|drones?|navy|artillery)|"
              r"Israel(?:'s)?\s+(?:forces?|military|army|"
              r"air\s*force|aircraft|warplanes?|jets?|"
              r"drones?|navy|artillery)|"
              r"IDF"
              r")"
          )

          ACTION = (
              r"(?:"
              r"attack(?:ed|s|ing)?|"
              r"strike|strikes|struck|"
              r"bomb(?:ed|ing|s)?|"
              r"bombard(?:ed|ment|ments|ing)?|"
              r"shell(?:ed|ing|s)?|"
              r"raid(?:ed|s|ing)?|"
              r"shot|shoot(?:s|ing)?|"
              r"fire(?:d|s|ing)?\s+"
              r"(?:at|on|toward|towards)|"
              r"launched?\s+(?:a\s+)?"
              r"(?:missile|missiles|strike|strikes|"
              r"attack|attacks)|"
              r"carried\s+out\s+(?:a\s+)?"
              r"(?:strike|attack|raid|bombardment)|"
              r"conducted\s+(?:a\s+)?"
              r"(?:strike|attack|raid|bombardment)"
              r")"
          )

          ISRAEL_ACTIVE = re.compile(
              rf"\b{ISRAEL_ACTOR}\b"
              rf".{{0,170}}\b{ACTION}\b",
              re.I | re.S,
          )

          ISRAEL_PASSIVE = re.compile(
              rf"\b(?:attacked|struck|bombed|"
              rf"bombarded|shelled|raided|shot)\b"
              rf".{{0,120}}\bby\s+"
              rf"{ISRAEL_ACTOR}\b",
              re.I | re.S,
          )

          ISRAEL_NOUN = re.compile(
              r"\b(?:Israeli|Israel(?:'s)?|IDF)\s+"
              r"(?:air[\s-]?strike|air[\s-]?raid|"
              r"drone[\s-]?strike|artillery\s+"
              r"(?:strike|shelling)|missile\s+strike|"
              r"naval\s+(?:strike|shelling)|"
              r"military\s+strike|bombardment|"
              r"shelling|raid|attack)s?\b",
              re.I,
          )

          OPPONENT = (
              r"(?:"
              r"Hamas|Hezbollah|Hizbollah|"
              r"Palestinian\s+Islamic\s+Jihad|PIJ|"
              r"Ansar\s+Allah|Houthis?|"
              r"Houthi\s+forces?|"
              r"al-Qassam\s+Brigades|"
              r"Qassam\s+Brigades|"
              r"al-Quds\s+Brigades|"
              r"Quds\s+Brigades|"
              r"Palestinian\s+armed\s+groups?"
              r")"
          )

          OPPONENT_ACTIVE = re.compile(
              rf"\b{OPPONENT}\b"
              rf".{{0,170}}\b{ACTION}\b",
              re.I | re.S,
          )

          ATTACK_ON_ISRAEL = re.compile(
              r"\b(?:attack(?:ed|s|ing)?|"
              r"strike|strikes|struck|"
              r"rocket(?:s)?|missile(?:s)?|"
              r"fire(?:d|s|ing)?|shot|shooting)"
              r".{0,120}"
              r"(?:Israel|Israeli\s+(?:forces?|"
              r"soldiers?|military|territory|"
              r"towns?|cities|communities))\b",
              re.I | re.S,
          )

          CLASH = re.compile(
              r"\b(?:clash(?:ed|es|ing)?|"
              r"exchange(?:d)?\s+(?:of\s+)?fire|"
              r"fighting|gunfight|battle|"
              r"engagement|crossfire)\b",
              re.I,
          )

          def metadata(row):
              return " | ".join(
                  str(
                      first(
                          row,
                          field,
                      )
                      or ""
                  )
                  for field
                  in (
                      "source_article",
                      "source_headline",
                      "source_original",
                      "where_description",
                  )
              )

          def label_direction(row):
              text = metadata(
                  row
              )

              israel_positive = bool(
                  ISRAEL_ACTIVE.search(text)
                  or ISRAEL_PASSIVE.search(text)
                  or ISRAEL_NOUN.search(text)
              )

              opponent_positive = bool(
                  OPPONENT_ACTIVE.search(
                      text
                  )
                  or ATTACK_ON_ISRAEL.search(
                      text
                  )
              )

              # If both are present, treat it as ambiguous combat.
              if (
                  israel_positive
                  and not opponent_positive
              ):
                  return "israeli_attack"

              if (
                  opponent_positive
                  and not israel_positive
              ):
                  return "attack_on_israel"

              if CLASH.search(
                  text
              ):
                  return "clash"

              return "clash"

          def normalize(
              row,
              label,
              category,
          ):
              date = event_date(
                  row
              )

              lat = number(
                  first(
                      row,
                      "latitude",
                      "lat",
                      "y",
                      "ycoord",
                      "y_coord",
                      "latitude_dd",
                      "lat_dd",
                  )
              )

              lon = number(
                  first(
                      row,
                      "longitude",
                      "lon",
                      "lng",
                      "long",
                      "x",
                      "xcoord",
                      "x_coord",
                      "longitude_dd",
                      "lon_dd",
                  )
              )

              # Last-resort schema-adaptive lookup. Only use fields whose
              # normalized header clearly identifies latitude/longitude.
              if lat is None or lon is None:
                  for key,value in row.items():
                      nk = norm_key(key)

                      if lat is None and (
                          nk == "latitude"
                          or nk.startswith("latitude_")
                          or nk.endswith("_latitude")
                      ):
                          lat = number(value)

                      if lon is None and (
                          nk == "longitude"
                          or nk.startswith("longitude_")
                          or nk.endswith("_longitude")
                      ):
                          lon = number(value)

              if (
                  not date
                  or lat is None
                  or lon is None
              ):
                  return None

              return {
                  "id": str(
                      first(
                          row,
                          "id",
                      )
                      or ""
                  ),
                  "relid": first(
                      row,
                      "relid",
                  ),
                  "date": date,
                  "lat": lat,
                  "lon": lon,
                  "location": (
                      first(
                          row,
                          "where_coordinates",
                      )
                      or first(
                          row,
                          "where_description",
                      )
                  ),
                  "country": first(
                      row,
                      "country",
                  ),
                  "where_prec": integer(
                      first(
                          row,
                          "where_prec",
                      ),
                      None,
                  ),
                  "date_prec": integer(
                      first(
                          row,
                          "date_prec",
                      ),
                      None,
                  ),
                  "side_a": first(
                      row,
                      "side_a",
                  ),
                  "side_b": first(
                      row,
                      "side_b",
                  ),
                  "type_of_violence": integer(
                      first(
                          row,
                          "type_of_violence",
                      ),
                      None,
                  ),
                  "dataset": label,
                  "category": category,
              }

          # --------------------------------------------------
          # LOAD
          # --------------------------------------------------

          ged_url, candidate_url = (
              discover_current_files()
          )

          print(
              "GED URL:",
              ged_url,
          )
          print(
              "Candidate cumulative URL:",
              candidate_url,
          )

          ged_rows = load_ged(
              ged_url
          )

          candidate_rows = rows_from_csv(
              get(
                  candidate_url
              ).content
          )

          israel_ids = learn_israel_ids(
              ged_rows
          )

          print(
              "Learned Israel actor IDs:",
              sorted(israel_ids),
          )

          print(
              "GED rows:",
              len(ged_rows),
          )
          print(
              "Candidate rows:",
              len(candidate_rows),
          )

          # Show Candidate schema in the log. This makes future schema changes
          # immediately visible instead of silently truncating the timeline.
          if candidate_rows:
              print(
                  "Candidate columns:",
                  ", ".join(
                      str(key)
                      for key in candidate_rows[0].keys()
                      if key is not None
                  ),
              )

              if None in candidate_rows[0]:
                  extra_values = candidate_rows[0].get(None) or []
                  print(
                      "WARNING: Candidate CSV contains",
                      len(extra_values),
                      "extra field value(s) beyond the parsed header in the first row."
                  )

              normalized_headers = [
                  norm_key(key)
                  for key in candidate_rows[0].keys()
                  if key is not None
              ]

              coordinate_headers = [
                  header
                  for header in normalized_headers
                  if (
                      "lat" in header
                      or "lon" in header
                      or "lng" in header
                      or header in (
                          "x",
                          "y",
                          "xcoord",
                          "ycoord",
                      )
                  )
              ]

              print(
                  "Candidate coordinate-like columns:",
                  coordinate_headers,
              )

              candidate_with_coords = 0
              candidate_israel_with_coords = 0

              for diagnostic_row in candidate_rows:
                  dlat = number(
                      first(
                          diagnostic_row,
                          "latitude",
                          "lat",
                          "y",
                          "ycoord",
                          "y_coord",
                          "latitude_dd",
                          "lat_dd",
                      )
                  )

                  dlon = number(
                      first(
                          diagnostic_row,
                          "longitude",
                          "lon",
                          "lng",
                          "long",
                          "x",
                          "xcoord",
                          "x_coord",
                          "longitude_dd",
                          "lon_dd",
                      )
                  )

                  if (
                      dlat is not None
                      and dlon is not None
                  ):
                      candidate_with_coords += 1

                      if israel_related(
                          diagnostic_row,
                          israel_ids,
                      ):
                          candidate_israel_with_coords += 1

              print(
                  "Candidate rows with directly usable coordinates:",
                  candidate_with_coords,
              )
              print(
                  "Israel-related Candidate rows with directly usable coordinates:",
                  candidate_israel_with_coords,
              )

              if candidate_israel_with_coords == 0:
                  print(
                      "WARNING: Candidate has Israel-related events but none "
                      "have coordinates under recognized coordinate columns. "
                      "If mapping still ends in 2025, this is the limiting step."
                  )

          def source_diagnostics(
              rows,
              label,
          ):
              raw_dates = [
                  event_date(row)
                  for row in rows
                  if event_date(row)
              ]

              related = [
                  row
                  for row in rows
                  if israel_related(
                      row,
                      israel_ids,
                  )
              ]

              related_dates = [
                  event_date(row)
                  for row in related
                  if event_date(row)
              ]

              print()
              print(
                  "===",
                  label,
                  "DIAGNOSTICS ===",
              )
              print(
                  "Rows:",
                  len(rows),
              )
              print(
                  "Newest raw date:",
                  max(
                      raw_dates,
                      default=None,
                  ),
              )
              print(
                  "Israel-related rows:",
                  len(related),
              )
              print(
                  "Newest Israel-related date:",
                  max(
                      related_dates,
                      default=None,
                  ),
              )

          source_diagnostics(
              ged_rows,
              "GED",
          )

          source_diagnostics(
              candidate_rows,
              "CANDIDATE",
          )

          # --------------------------------------------------
          # INCLUDE ALL ISRAEL-RELATED EVENTS
          # --------------------------------------------------

          events = []

          for label, rows in (
              (
                  "UCDP GED 26.1",
                  ged_rows,
              ),
              (
                  "UCDP Candidate 2026",
                  candidate_rows,
              ),
          ):
              accepted = 0

              for row in rows:
                  date = event_date(
                      row
                  )

                  if (
                      not date
                      or date < START
                  ):
                      continue

                  if not israel_related(
                      row,
                      israel_ids,
                  ):
                      continue

                  item = normalize(
                      row,
                      label,
                      label_direction(
                          row
                      ),
                  )

                  if item:
                      events.append(
                          item
                      )
                      accepted += 1

              print(
                  label,
                  "mapped Israel-related events:",
                  accepted,
              )

          # Deduplicate annual/candidate overlap by relid, otherwise stable
          # geography/date/dyad fallback.
          merged = {}

          for event in events:
              key = (
                  event.get(
                      "relid"
                  )
                  or (
                      f"{event['date']}|"
                      f"{event['lat']:.5f}|"
                      f"{event['lon']:.5f}|"
                      f"{event.get('side_a')}|"
                      f"{event.get('side_b')}"
                  )
              )

              merged[
                  key
              ] = event

          events = sorted(
              merged.values(),
              key=lambda e: (
                  e["date"],
                  e.get(
                      "relid"
                  )
                  or "",
                  e.get(
                      "id"
                  )
                  or "",
              ),
          )

          if not events:
              raise RuntimeError(
                  "No Israeli-involved UCDP events generated."
              )

          category_counts = {}

          for event in events:
              category_counts[
                  event["category"]
              ] = (
                  category_counts.get(
                      event["category"],
                      0,
                  )
                  + 1
              )

          newest_candidate_mapped = max(
              (
                  e["date"]
                  for e in events
                  if "Candidate" in e["dataset"]
              ),
              default=None,
          )

          print()
          print(
              "=== FINAL MAP ==="
          )
          print(
              "Total events:",
              len(events),
          )
          print(
              "Categories:",
              category_counts,
          )
          print(
              "Newest Candidate event mapped:",
              newest_candidate_mapped,
          )
          print(
              "Newest event overall:",
              events[-1]["date"],
          )

          # Safety diagnostic: current UCDP Candidate page is documented through
          # June 2026. If Candidate loads but no Israel-related Candidate event
          # maps, make it impossible to miss in Actions.
          if (
              candidate_rows
              and newest_candidate_mapped is None
          ):
              print(
                  "WARNING: Candidate dataset downloaded successfully "
                  "but no Israel-related Candidate rows mapped."
              )

          output = {
              "source": (
                  "Uppsala Conflict Data Program "
                  "(UCDP) public downloads"
              ),
              "license": "CC BY 4.0",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "start_date": START,
              "ged_download": ged_url,
              "candidate_download": candidate_url,
              "method": {
                  "inclusion": (
                      "All georeferenced UCDP events from 7 Oct 2023 "
                      "onward in which Government of Israel is identified "
                      "as a conflict actor, using actor names plus actor IDs "
                      "learned from GED 26.1."
                  ),
                  "geography": (
                      "No country or territory is excluded. Israel, Gaza, "
                      "the West Bank/Palestine, Lebanon, Syria and other "
                      "UCDP-coded locations can all appear."
                  ),
                  "direction_labels": (
                      "Text metadata is used only to label events as "
                      "Israeli-attributed, attack on Israel/Israeli forces, "
                      "or clash/direction unclear. Direction does not determine "
                      "whether an event is included."
                  ),
                  "warning": (
                      "UCDP has no universal event-level attacker field. "
                      "Direction labels are heuristic and ambiguous events "
                      "remain visible."
                  ),
              },
              "diagnostics": {
                  "ged_rows": len(
                      ged_rows
                  ),
                  "candidate_rows": len(
                      candidate_rows
                  ),
                  "israel_actor_ids": sorted(
                      israel_ids
                  ),
                  "category_counts": category_counts,
                  "newest_candidate_event": newest_candidate_mapped,
                  "newest_event": events[-1]["date"],
              },
              "events": events,
          }

          Path(
              "data"
          ).mkdir(
              exist_ok=True
          )

          Path(
              "data/ucdp-military-activity.json"
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(",",":"),
              ),
              encoding="utf-8",
          )

          print(
              "SUCCESS:",
              len(events),
              "events through",
              events[-1]["date"],
          )
          PY

      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucdp-military-activity.json
          git diff --cached --quiet && exit 0
          git commit -m "Update all UCDP Israeli-involved events"
          git push
