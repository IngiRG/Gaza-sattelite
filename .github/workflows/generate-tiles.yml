name: Generate monthly satellite timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 3 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tile generator
        run: pip install requests rio-tiler pillow numpy shapely

      - name: Generate monthly tiles with simple corner fallback
        shell: bash
        run: |
          cat > /tmp/generate_monthly.py <<'PY'
          from contextlib import ExitStack
          from datetime import datetime, timezone
          from pathlib import Path
          import calendar, json, math, shutil
          import numpy as np
          import requests
          from PIL import Image
          from rio_tiler.io import COGReader
          from shapely.geometry import box, shape

          SEARCH = "https://earth-search.aws.element84.com/v1/search"
          COLLECTION = "sentinel-2-l2a"
          BEFORE_ID = "S2A_36RXV_20230927_0_L2A"
          BBOX = (34.22, 31.30, 34.60, 31.67)
          ZOOMS = range(8, 15)
          OUT = Path("tiles")
          MANIFEST = OUT / "manifest.json"
          AOI = box(*BBOX)

          session = requests.Session()
          session.headers.update({
              "Accept": "application/geo+json,application/json",
              "User-Agent": "gaza-monthly-timeline-simple-fallback/1.0",
          })

          def visual(item):
              assets = item.get("assets", {})
              for key in ("visual", "tci", "TCI", "visual-jp2"):
                  asset = assets.get(key)
                  if asset and asset.get("href"):
                      return asset["href"]
              return None

          def item_datetime(item):
              p = item.get("properties", {})
              return p.get("datetime") or p.get("start_datetime")

          def cloud(item):
              try:
                  return float(item.get("properties", {}).get("eo:cloud_cover", 999))
              except (TypeError, ValueError):
                  return 999.0

          def get_item(item_id):
              url = f"https://earth-search.aws.element84.com/v1/collections/{COLLECTION}/items/{item_id}"
              r = session.get(url, timeout=90)
              r.raise_for_status()
              return r.json()

          def search_month(year, month):
              final_day = calendar.monthrange(year, month)[1]
              params = {
                  "collections": COLLECTION,
                  "bbox": ",".join(map(str, BBOX)),
                  "datetime": f"{year:04d}-{month:02d}-01T00:00:00Z/{year:04d}-{month:02d}-{final_day:02d}T23:59:59Z",
                  "limit": "100",
              }
              r = session.get(SEARCH, params=params, timeout=120)
              r.raise_for_status()
              output = []
              for item in r.json().get("features", []):
                  if not visual(item) or not item.get("geometry"):
                      continue
                  try:
                      if shape(item["geometry"]).intersects(AOI):
                          output.append(item)
                  except Exception:
                      continue
              return output

          def intersection(item):
              try:
                  return shape(item["geometry"]).intersection(AOI)
              except Exception:
                  return None

          def choose_primary_and_backup(items):
              if not items:
                  raise RuntimeError("No usable Sentinel-2 scenes found")
              ordered = sorted(items, key=lambda i: (cloud(i), item_datetime(i) or ""))
              primary = ordered[0]
              primary_geom = intersection(primary)
              uncovered = AOI.difference(primary_geom) if primary_geom is not None else AOI
              backup = None
              best = None
              for candidate in ordered[1:]:
                  geom = intersection(candidate)
                  if geom is None:
                      continue
                  score = (geom.intersection(uncovered).area, -cloud(candidate))
                  if best is None or score > best:
                      best = score
                      backup = candidate
              return primary, backup

          def lon_to_x(lon, z):
              return int((lon + 180.0) / 360.0 * (1 << z))

          def lat_to_y(lat, z):
              r = math.radians(lat)
              return int((1.0 - math.asinh(math.tan(r)) / math.pi) / 2.0 * (1 << z))

          def tile_coordinates():
              west, south, east, north = BBOX
              for z in ZOOMS:
                  for x in range(lon_to_x(west, z), lon_to_x(east, z) + 1):
                      for y in range(lat_to_y(north, z), lat_to_y(south, z) + 1):
                          yield z, x, y

          TILE_COORDINATES = list(tile_coordinates())

          def read_tile(reader, x, y, z):
              if reader is None:
                  return None, None
              try:
                  image = reader.tile(x, y, z, tilesize=256)
              except Exception:
                  return None, None
              data = np.asarray(image.data)
              if data.ndim == 2:
                  data = data[np.newaxis, :, :]
              if data.shape[0] == 1:
                  data = np.repeat(data, 3, axis=0)
              elif data.shape[0] > 3:
                  data = data[:3]
              data = np.clip(data, 0, 255).astype(np.uint8)
              mask = np.asarray(image.mask)
              if mask.ndim == 3:
                  mask = mask[0]
              return data, mask > 0

          def render_tile(primary_reader, backup_reader, x, y, z):
              rgb = np.zeros((3, 256, 256), dtype=np.uint8)
              valid = np.zeros((256, 256), dtype=bool)
              pdata, pvalid = read_tile(primary_reader, x, y, z)
              if pdata is not None:
                  rgb[:, pvalid] = pdata[:, pvalid]
                  valid |= pvalid
              if not np.all(valid):
                  bdata, bvalid = read_tile(backup_reader, x, y, z)
                  if bdata is not None:
                      take = bvalid & ~valid
                      rgb[:, take] = bdata[:, take]
                      valid |= take
              rgba = np.zeros((256, 256, 4), dtype=np.uint8)
              rgba[:, :, :3] = np.moveaxis(rgb, 0, 2)
              rgba[:, :, 3] = valid.astype(np.uint8) * 255
              return rgba, valid

          def load_manifest():
              if not MANIFEST.exists():
                  return {}
              try:
                  return json.loads(MANIFEST.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def previous_primary_id(previous):
              return previous.get("primary_id") or previous.get("id")

          def render_folder(label, primary, backup, previous):
              destination = OUT / label
              primary_id = primary["id"]
              backup_id = backup["id"] if backup else None
              if destination.exists() and previous_primary_id(previous) != primary_id:
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              generated = reused = transparent = 0
              with ExitStack() as stack:
                  primary_reader = stack.enter_context(COGReader(visual(primary)))
                  backup_reader = stack.enter_context(COGReader(visual(backup))) if backup else None
                  for z, x, y in TILE_COORDINATES:
                      path = destination / str(z) / str(x) / f"{y}.webp"
                      if path.exists() and path.stat().st_size > 100:
                          reused += 1
                          continue
                      rgba, valid = render_tile(primary_reader, backup_reader, x, y, z)
                      if not np.any(valid):
                          transparent += 1
                      path.parent.mkdir(parents=True, exist_ok=True)
                      Image.fromarray(rgba).save(path, "WEBP", quality=80, method=4)
                      generated += 1
              print(f"{label}: generated={generated}, reused={reused}, transparent={transparent}")
              return {
                  "id": primary_id,
                  "primary_id": primary_id,
                  "backup_id": backup_id,
                  "datetime": item_datetime(primary),
                  "cloud": cloud(primary),
                  "bbox": list(BBOX),
                  "zooms": [min(ZOOMS), max(ZOOMS)],
                  "simple_fallback": True,
              }

          def month_keys():
              current = datetime.now(timezone.utc)
              year, month = 2023, 10
              while (year, month) <= (current.year, current.month):
                  yield f"{year:04d}-{month:02d}", year, month
                  month += 1
                  if month == 13:
                      year += 1
                      month = 1

          def main():
              OUT.mkdir(exist_ok=True)
              old = load_manifest()
              before_primary = get_item(BEFORE_ID)
              before_result = render_folder("before", before_primary, None, old.get("before", {}))
              manifest = {
                  "generated_at": datetime.now(timezone.utc).isoformat(),
                  "bbox": list(BBOX),
                  "zooms": [min(ZOOMS), max(ZOOMS)],
                  "before": before_result,
                  "months": {},
              }
              for key, year, month in month_keys():
                  print("Processing", key)
                  primary, backup = choose_primary_and_backup(search_month(year, month))
                  result = render_folder(
                      f"monthly/{key}",
                      primary,
                      backup,
                      old.get("months", {}).get(key, {}),
                  )
                  manifest["months"][key] = result
                  MANIFEST.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
              MANIFEST.write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          if __name__ == "__main__":
              main()
          PY

          python /tmp/generate_monthly.py

      - name: Commit generated timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiles
          git diff --cached --quiet && exit 0
          git commit -m "Repair missing monthly satellite tiles"
          git push
