name: Generate monthly satellite timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 3 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tile generator
        run: pip install requests rio-tiler pillow numpy shapely

      - name: Generate robust monthly mosaics
        shell: bash
        run: |
          cat > /tmp/generate_monthly.py <<'PY'
          from contextlib import ExitStack
          from datetime import datetime, timezone
          from pathlib import Path
          import calendar
          import json
          import math
          import shutil
          import sys

          import numpy as np
          import requests
          from PIL import Image
          from rio_tiler.io import COGReader
          from shapely.geometry import box, shape
          from shapely.ops import unary_union

          SEARCH = "https://earth-search.aws.element84.com/v1/search"
          COLLECTION = "sentinel-2-l2a"

          BEFORE_DATE = "2023-09-27"

          # west, south, east, north
          BBOX = (34.22, 31.30, 34.60, 31.67)

          # Zoom levels 8 through 14.
          ZOOMS = range(8, 15)

          # Use no more than this many acquisition dates to fill a month.
          MAX_DATES_PER_MONTH = 6

          OUT = Path("tiles")
          TEMP = OUT / ".build"
          MANIFEST = OUT / "manifest.json"
          GENERATOR_VERSION = 3

          AOI = box(*BBOX)

          session = requests.Session()
          session.headers.update({
              "Accept": "application/geo+json,application/json",
              "User-Agent": "gaza-monthly-timeline/3.0",
          })

          def visual(item):
              assets = item.get("assets", {})
              for key in ("visual", "tci", "TCI", "visual-jp2"):
                  asset = assets.get(key)
                  if asset and asset.get("href"):
                      return asset["href"]
              return None

          def item_datetime(item):
              properties = item.get("properties", {})
              return (
                  properties.get("datetime")
                  or properties.get("start_datetime")
              )

          def cloud(item):
              try:
                  return float(
                      item.get("properties", {}).get(
                          "eo:cloud_cover",
                          999,
                      )
                  )
              except (TypeError, ValueError):
                  return 999.0

          def search_range(start, end):
              params = {
                  "collections": COLLECTION,
                  "bbox": ",".join(map(str, BBOX)),
                  "datetime": f"{start}/{end}",
                  "limit": "100",
              }
              response = session.get(
                  SEARCH,
                  params=params,
                  timeout=120,
              )
              response.raise_for_status()

              results = []
              for item in response.json().get("features", []):
                  if not visual(item) or not item.get("geometry"):
                      continue

                  try:
                      if shape(item["geometry"]).intersects(AOI):
                          results.append(item)
                  except Exception:
                      continue

              return results

          def search_day(date_string):
              return search_range(
                  f"{date_string}T00:00:00Z",
                  f"{date_string}T23:59:59Z",
              )

          def search_month(year, month):
              final_day = calendar.monthrange(year, month)[1]
              return search_range(
                  f"{year:04d}-{month:02d}-01T00:00:00Z",
                  (
                      f"{year:04d}-{month:02d}-"
                      f"{final_day:02d}T23:59:59Z"
                  ),
              )

          def date_key(item):
              value = item_datetime(item)
              if not value:
                  raise ValueError(
                      f"Item {item.get('id')} has no datetime"
                  )
              return value[:10]

          def analyse_day(day, items):
              pieces = []
              weighted_cloud = 0.0
              total_area = 0.0

              for item in items:
                  try:
                      intersection = (
                          shape(item["geometry"])
                          .intersection(AOI)
                      )
                  except Exception:
                      continue

                  if intersection.is_empty:
                      continue

                  pieces.append(intersection)
                  area = intersection.area
                  weighted_cloud += cloud(item) * area
                  total_area += area

              coverage = (
                  unary_union(pieces).area / AOI.area
                  if pieces
                  else 0.0
              )
              cloud_score = (
                  weighted_cloud / total_area
                  if total_area
                  else 999.0
              )

              return {
                  "date": day,
                  "items": items,
                  "coverage": min(1.0, coverage),
                  "cloud": cloud_score,
              }

          def ranked_days(items):
              grouped = {}

              for item in items:
                  grouped.setdefault(
                      date_key(item),
                      [],
                  ).append(item)

              days = [
                  analyse_day(day, day_items)
                  for day, day_items in grouped.items()
              ]

              # Prefer dates that nearly cover the complete AOI.
              # Within that group, choose the least cloudy date.
              full = [
                  candidate
                  for candidate in days
                  if candidate["coverage"] >= 0.985
              ]

              if full:
                  full.sort(
                      key=lambda candidate: (
                          candidate["cloud"],
                          -candidate["coverage"],
                          candidate["date"],
                      )
                  )
                  primary = full[0]
              else:
                  # Do not fail. Choose the best-covered date first,
                  # then the least cloudy among similarly covered dates.
                  days.sort(
                      key=lambda candidate: (
                          -candidate["coverage"],
                          candidate["cloud"],
                          candidate["date"],
                      )
                  )
                  if not days:
                      raise RuntimeError(
                          "No usable Sentinel-2 visual assets found"
                      )
                  primary = days[0]

              remaining = [
                  candidate
                  for candidate in days
                  if candidate["date"] != primary["date"]
              ]
              remaining.sort(
                  key=lambda candidate: (
                      candidate["cloud"],
                      -candidate["coverage"],
                      candidate["date"],
                  )
              )

              return [primary, *remaining][
                  :MAX_DATES_PER_MONTH
              ]

          def lon_to_x(lon, zoom):
              return int(
                  (lon + 180.0)
                  / 360.0
                  * (1 << zoom)
              )

          def lat_to_y(lat, zoom):
              radians = math.radians(lat)
              return int(
                  (
                      1.0
                      - math.asinh(
                          math.tan(radians)
                      )
                      / math.pi
                  )
                  / 2.0
                  * (1 << zoom)
              )

          def coordinates():
              west, south, east, north = BBOX

              for zoom in ZOOMS:
                  x0 = lon_to_x(west, zoom)
                  x1 = lon_to_x(east, zoom)
                  y0 = lat_to_y(north, zoom)
                  y1 = lat_to_y(south, zoom)

                  for x in range(x0, x1 + 1):
                      for y in range(y0, y1 + 1):
                          yield zoom, x, y

          TILE_COORDINATES = list(coordinates())

          def read_tile(reader, x, y, zoom):
              try:
                  image = reader.tile(
                      x,
                      y,
                      zoom,
                      tilesize=256,
                  )
              except Exception:
                  return None, None

              data = np.asarray(image.data)

              if data.ndim == 2:
                  data = data[np.newaxis, :, :]

              if data.shape[0] == 1:
                  data = np.repeat(data, 3, axis=0)
              elif data.shape[0] > 3:
                  data = data[:3]

              data = np.clip(
                  data,
                  0,
                  255,
              ).astype(np.uint8)

              mask = np.asarray(image.mask)

              if mask.ndim == 3:
                  mask = mask[0]

              valid = mask > 0
              return data, valid

          def source_signature(days):
              return [
                  {
                      "date": day["date"],
                      "source_ids": sorted(
                          item["id"]
                          for item in day["items"]
                      ),
                  }
                  for day in days
              ]

          def existing_manifest():
              if not MANIFEST.exists():
                  return {}

              try:
                  return json.loads(
                      MANIFEST.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return {}

          def can_reuse(previous, days):
              return (
                  previous.get("generator_version")
                  == GENERATOR_VERSION
                  and previous.get("bbox")
                  == list(BBOX)
                  and previous.get("zooms")
                  == [min(ZOOMS), max(ZOOMS)]
                  and previous.get("sources")
                  == source_signature(days)
              )

          def render(label, days):
              destination = OUT / label
              temporary = TEMP / label

              shutil.rmtree(
                  temporary,
                  ignore_errors=True,
              )
              temporary.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              ordered_items = []

              for day in days:
                  ordered_items.extend(
                      sorted(
                          day["items"],
                          key=lambda item: (
                              cloud(item),
                              item["id"],
                          ),
                      )
                  )

              source_urls = [
                  visual(item)
                  for item in ordered_items
              ]

              completely_empty = []
              partially_filled = 0

              with ExitStack() as stack:
                  readers = [
                      stack.enter_context(
                          COGReader(url)
                      )
                      for url in source_urls
                  ]

                  for number, (
                      zoom,
                      x,
                      y,
                  ) in enumerate(
                      TILE_COORDINATES,
                      start=1,
                  ):
                      rgb = np.zeros(
                          (3, 256, 256),
                          dtype=np.uint8,
                      )
                      valid = np.zeros(
                          (256, 256),
                          dtype=bool,
                      )

                      for reader in readers:
                          source, source_valid = read_tile(
                              reader,
                              x,
                              y,
                              zoom,
                          )

                          if source is None:
                              continue

                          take = source_valid & ~valid

                          if np.any(take):
                              rgb[:, take] = source[:, take]
                              valid[take] = True

                          if np.all(valid):
                              break

                      if not np.any(valid):
                          completely_empty.append(
                              f"{zoom}/{x}/{y}"
                          )
                      elif not np.all(valid):
                          partially_filled += 1

                      rgba = np.zeros(
                          (256, 256, 4),
                          dtype=np.uint8,
                      )
                      rgba[:, :, :3] = np.moveaxis(
                          rgb,
                          0,
                          2,
                      )
                      rgba[:, :, 3] = (
                          valid.astype(np.uint8)
                          * 255
                      )

                      path = (
                          temporary
                          / str(zoom)
                          / str(x)
                          / f"{y}.webp"
                      )
                      path.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      Image.fromarray(
                          rgba,
                      ).save(
                          path,
                          "WEBP",
                          quality=80,
                          method=4,
                      )

                      if number % 100 == 0:
                          print(
                              label,
                              number,
                              len(TILE_COORDINATES),
                          )

              # Empty edge tiles are published as transparent WebP
              # rather than causing the entire workflow to fail.
              if completely_empty:
                  print(
                      f"{label}: "
                      f"{len(completely_empty)} transparent "
                      "edge tiles; examples: "
                      + ", ".join(
                          completely_empty[:10]
                      ),
                      file=sys.stderr,
                  )

              if partially_filled:
                  print(
                      f"{label}: {partially_filled} tiles "
                      "contain some transparent edge pixels",
                      file=sys.stderr,
                  )

              shutil.rmtree(
                  destination,
                  ignore_errors=True,
              )
              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              temporary.rename(destination)

              primary = days[0]
              representative = sorted(
                  primary["items"],
                  key=lambda item: item["id"],
              )[0]

              fallback_dates = [
                  day["date"]
                  for day in days[1:]
              ]

              return {
                  "id": representative["id"],
                  "datetime": item_datetime(
                      representative
                  ),
                  "cloud": primary["cloud"],
                  "coverage": primary["coverage"],
                  "primary_date": primary["date"],
                  "fallback_dates": fallback_dates,
                  "is_composite": bool(
                      fallback_dates
                  ),
                  "sources": source_signature(days),
                  "bbox": list(BBOX),
                  "zooms": [
                      min(ZOOMS),
                      max(ZOOMS),
                  ],
                  "generator_version": GENERATOR_VERSION,
              }

          def month_keys():
              current = datetime.now(timezone.utc)
              year, month = 2023, 10

              while (
                  year,
                  month,
              ) <= (
                  current.year,
                  current.month,
              ):
                  yield (
                      f"{year:04d}-{month:02d}",
                      year,
                      month,
                  )

                  month += 1

                  if month == 13:
                      year += 1
                      month = 1

          def process(
              label,
              items,
              previous,
          ):
              days = ranked_days(items)

              if (
                  can_reuse(previous, days)
                  and (OUT / label).exists()
              ):
                  print(
                      label,
                      "unchanged; reusing tiles",
                  )
                  return previous

              return render(label, days)

          def main():
              OUT.mkdir(exist_ok=True)
              TEMP.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              old = existing_manifest()

              before = process(
                  "before",
                  search_day(BEFORE_DATE),
                  old.get("before", {}),
              )

              manifest = {
                  "generated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "generator_version": GENERATOR_VERSION,
                  "bbox": list(BBOX),
                  "zooms": [
                      min(ZOOMS),
                      max(ZOOMS),
                  ],
                  "before": before,
                  "months": {},
              }

              for key, year, month in month_keys():
                  print("Processing", key)

                  monthly = process(
                      f"monthly/{key}",
                      search_month(year, month),
                      old.get(
                          "months",
                          {},
                      ).get(key, {}),
                  )

                  manifest["months"][key] = monthly

                  MANIFEST.write_text(
                      json.dumps(
                          manifest,
                          indent=2,
                      ),
                      encoding="utf-8",
                  )

              MANIFEST.write_text(
                  json.dumps(
                      manifest,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              shutil.rmtree(
                  TEMP,
                  ignore_errors=True,
              )

              print(
                  json.dumps(
                      manifest,
                      indent=2,
                  )
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/generate_monthly.py

      - name: Commit generated timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiles
          git diff --cached --quiet && exit 0
          git commit -m "Update robust monthly satellite mosaics"
          git push
