name: Update UNOSAT satellite damage

on:
  workflow_dispatch:
  schedule:
    - cron: "40 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build validated UNOSAT assessment timeline
        run: |
          python - <<'PY'
          import json,re
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from datetime import datetime,timezone
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path("data/unosat-damage.json")
          S=requests.Session()
          S.headers.update({"User-Agent":"GazaTimeline-UNOSAT/2.0"})

          # Known Gaza-wide products plus a small forward range to discover newer ones.
          known={3734,3769,3793,3904,3984,4047,4130,4165,4213}
          ids=sorted(known | set(range(4214,4301)))

          def fetch(pid):
              url=f"https://unosat.org/products/{pid}"
              try:
                  r=S.get(url,timeout=12)
                  if r.status_code!=200:
                      return None
                  return pid,url,r.text
              except Exception:
                  return None

          def num(pattern,text):
              m=re.search(pattern,text,re.I|re.S)
              if not m:return None
              try:return int(m.group(1).replace(",",""))
              except:return None

          def parse(item):
              if not item:return None
              pid,url,raw=item
              soup=BeautifulSoup(raw,"html.parser")
              text=" ".join(soup.stripped_strings)

              if not re.search(r"Gaza Strip Comprehensive Damage Assessment",text,re.I):
                  return None

              # Avoid locality-only / thematic products.
              if re.search(r"Road Network|greenhouse|Gaza City Comprehensive|Gaza Governorate Comprehensive",text,re.I):
                  return None

              # Current UNOSAT wording:
              # "based on images collected on 04 April 2025..."
              dm=re.search(
                  r"(?:based on images? collected on|based on satellite imagery collected on|"
                  r"analysis[^.]{0,80}as of)\s+"
                  r"(?:the\s+)?(\d{1,2})(?:[–-]\d{1,2})?\s+"
                  r"(January|February|March|April|May|June|July|August|September|October|November|December)\s+"
                  r"(20\d{2})",
                  text,re.I
              )
              if not dm:
                  dm=re.search(
                      r"\bas of\s+(\d{1,2})\s+"
                      r"(January|February|March|April|May|June|July|August|September|October|November|December)\s+"
                      r"(20\d{2})",
                      text,re.I
                  )
              if not dm:
                  return None

              try:
                  date=datetime.strptime(" ".join(dm.groups()),"%d %B %Y").date().isoformat()
              except Exception:
                  return None

              destroyed=num(r"([\d,]+)\s+destroyed structures",text)
              severe=num(r"([\d,]+)\s+severely damaged structures",text)
              moderate=num(r"([\d,]+)\s+moderately damaged structures",text)
              possible=num(r"([\d,]+)\s+possibly damaged structures",text)

              total=num(r"for a total of\s+([\d,]+)\s+(?:affected\s+)?structures",text)
              if total is None:
                  total=num(r"(?:total of|totalling)\s+([\d,]+)\s+affected structures",text)

              housing=num(r"(?:total of\s+)?([\d,]+)\s+(?:estimated\s+)?damaged housing units",text)

              pct=None
              pm=re.search(
                  r"(?:approximately|around)?\s*(\d+(?:\.\d+)?)%\s+of\s+(?:all|the total)\s+structures",
                  text,re.I
              )
              if pm:
                  try:pct=float(pm.group(1))
                  except:pass

              # Validation: destroyed and total must exist, categories cannot exceed total wildly.
              if destroyed is None or total is None:
                  return None
              if destroyed<=0 or total<destroyed:
                  return None
              if severe is not None and severe>total:
                  return None
              if moderate is not None and moderate>total:
                  return None

              return {
                  "date":date,
                  "product_id":pid,
                  "title":"UNOSAT Gaza Strip Comprehensive Damage Assessment",
                  "url":url,
                  "destroyed":destroyed,
                  "severe":severe,
                  "moderate":moderate,
                  "possible":possible,
                  "total_affected":total,
                  "housing_units":housing,
                  "percent_structures":pct
              }

          results=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              futures=[ex.submit(fetch,pid) for pid in ids]
              for f in as_completed(futures):
                  item=parse(f.result())
                  if item:
                      results.append(item)

          # Preserve existing validated records too.
          if OUT.exists():
              try:
                  old=json.loads(OUT.read_text(encoding="utf-8"))
                  for r in old.get("records",[]):
                      if r.get("date") and r.get("url") and r.get("destroyed") and r.get("total_affected"):
                          results.append(r)
              except Exception as e:
                  print("Existing UNOSAT JSON warning:",e)

          bydate={}
          for r in results:
              d=r["date"]
              if d not in bydate or int(r.get("product_id") or 0)>int(bydate[d].get("product_id") or 0):
                  bydate[d]=r

          records=sorted(bydate.values(),key=lambda r:r["date"])

          if not records:
              if OUT.exists():
                  print("No newly parsed UNOSAT records; retaining existing JSON.")
                  raise SystemExit(0)
              raise SystemExit("No valid UNOSAT records and no previous file.")

          payload={
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "source":"UNOSAT",
              "records":records
          }

          OUT.parent.mkdir(exist_ok=True)
          tmp=OUT.with_suffix(".tmp")
          tmp.write_text(json.dumps(payload,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          json.loads(tmp.read_text(encoding="utf-8"))
          tmp.replace(OUT)

          print("UNOSAT assessments:",len(records))
          for r in records:
              print(r["date"],r["product_id"],r["destroyed"],r["total_affected"])
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unosat-damage.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UNOSAT satellite damage data"
          git pull --rebase origin main
          git push origin main
